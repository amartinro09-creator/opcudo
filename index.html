/* cálculo de una decisión: resultado por unidad frente al día de entrada, peor caso y si cumple el objetivo */
function prCalc(e,k,o){
 const S0=e.camino[0][1],SF=e.final,x=e.expo,pr=o?o.prima:0,K=o?o.strike:null;
 const opt=o?prIntr(k,K,SF)-pr:0,res=x*(SF-S0)+opt;
 let worst=null,ok=false;
 if(x>0){worst=k==='put'?K-S0-pr:-(S0+pr);ok=k==='put'&&worst>=e.limite}
 else if(x<0){worst=k==='call'?K+pr:null;ok=k==='call'&&worst<=e.limite}
 else{worst=k==='none'?0:-pr;ok=k==='none'}
 return{res,opt,worst,ok,paid:SF-opt}}
function prTodas(e){return [...['call','put'].flatMap(t=>e.cadena[t].map((o,i)=>({k:t,i,o}))),{k:'none',i:-1,o:null}].map(r=>({...r,c:prCalc(e,r.k,r.o)}))}
function prOrder(){const e=prE(PRS.id),s=PRS.sel;if(!s)return;
 if(PRS.paso==='review'&&Date.now()-(PRS.revT||0)<600)return;
 const o=s.k==='none'?null:e.cadena[s.k][s.i],c=prCalc(e,s.k,o);
 S.pr=S.pr||{};if(!S.pr[e.id])S.pr[e.id]={k:s.k,strike:o?o.strike:null,ok:c.ok,fin:false};
 S.prc=S.prc||{};S.prc[e.id]={k:s.k,i:s.k==='none'?-1:s.i,dia:0};save();
 PRS.fase='tiempo';PRS.dia=0;PRS.toast=true;render();window.scrollTo(0,0);prFoco('.pr-adv .btn')}
function prAdv(n){const e=prE(PRS.id),last=e.camino.length-1;PRS.toast=false;PRS.probe=null;
 PRS.dia=n==='fin'?last:Math.min(last,PRS.dia+n);if(PRS.dia>=last){PRS.fase='fin';PRS.vista='grafica'}
 const q=S.prc&&S.prc[PRS.id];if(PRS.fase==='fin'){if(S.pr&&S.pr[PRS.id])S.pr[PRS.id].fin=true;if(S.prc)delete S.prc[PRS.id];save()}else if(q){q.dia=PRS.dia;save()}
 render();if(PRS.fase==='fin'){window.scrollTo(0,0);prFoco('.pr-backb');const s=PRS.sel;fb(prCalc(e,s.k,s.k==='none'?null:e.cadena[s.k][s.i]).ok)}else prFoco('.pr-adv .btn')}
function prRepetir(){if(S.prc&&PRS){delete S.prc[PRS.id];save()}PRS={id:PRS.id,fase:'ficha',tab:'call',sel:null,paso:null,dia:0,pista:false,toast:false,vista:PRS.vista==='grafica'?'grafica':'tabla'};render();window.scrollTo(0,0)}

/* ---------- gráfico de la línea del subyacente ---------- */
function prChart(e,dia,K){
 const pts=e.camino.slice(0,dia+1),n=e.camino.length,S0=e.camino[0][1];
 const vals=pts.map(p=>p[1]).concat([S0]).concat(K!=null?[K]:[]);
 let lo=Math.min(...vals),hi=Math.max(...vals);const pad=Math.max((hi-lo)*.12,S0*.01);lo-=pad;hi+=pad;
 const W=340,H=200,PL=44,PR=12,PT=12,PB=26,cw=W-PL-PR,ch=H-PT-PB;
 const X=i=>PL+i/(n-1)*cw,Y=v=>PT+(hi-v)/(hi-lo)*ch,f=v=>v.toFixed(1);
 const step=(()=>{const r=(hi-lo)/100,c=[1,2,5,10,20,25,50,100];return (c.find(z=>r/z<=5)||100)*100})();
 let g='';
 for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step)g+=`<line x1="${PL}" x2="${W-PR}" y1="${f(Y(t))}" y2="${f(Y(t))}" stroke="var(--line)" opacity=".55"/><text x="${PL-5}" y="${f(Y(t)+3.5)}" font-size="9.5" fill="var(--ink-soft)" text-anchor="end">${Math.round(t/100)}</text>`;
 if(dia<n-1)g+=`<rect x="${f(X(dia))}" y="${PT}" width="${f(X(n-1)-X(dia))}" height="${ch}" fill="var(--soft)" opacity=".9"/><text x="${f((X(dia)+X(n-1))/2)}" y="${H-PB-8}" font-size="10" fill="var(--ink-soft)" text-anchor="middle">${X(n-1)-X(dia)>60?'por venir':''}</text>`;
 g+=`<line x1="${PL}" x2="${W-PR}" y1="${f(Y(S0))}" y2="${f(Y(S0))}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="1.5 3.5"/>`;
 if(K!=null)g+=`<line x1="${PL}" x2="${W-PR}" y1="${f(Y(K))}" y2="${f(Y(K))}" stroke="var(--ink-soft)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${W-PR-2}" y="${f(Y(K)-4)}" font-size="10" font-weight="700" fill="var(--ink-soft)" text-anchor="end" stroke="var(--surface)" stroke-width="3" paint-order="stroke">strike ${prK(K,e)}</text>`;
 (e.hitos||[]).forEach(([d],j)=>{const i=e.camino.findIndex(p=>p[0]===d);if(i<0||i>dia)return;
  g+=`<line x1="${f(X(i))}" x2="${f(X(i))}" y1="${PT}" y2="${H-PB}" stroke="var(--gold)" stroke-width="1" opacity=".6"/><circle cx="${f(X(i))}" cy="${PT+6}" r="7" fill="var(--gold)"/><text x="${f(X(i))}" y="${PT+9.5}" font-size="9" font-weight="700" fill="var(--on-accent)" text-anchor="middle">${j+1}</text>`});
 g+=`<polyline points="${pts.map((p,i)=>f(X(i))+','+f(Y(p[1]))).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
 g+=`<circle cx="${f(X(dia))}" cy="${f(Y(pts[pts.length-1][1]))}" r="5.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;
 g+=`<text x="${PL}" y="${H-8}" font-size="9.5" fill="var(--ink-soft)">${prFecha(e.camino[0][0])}</text><text x="${W-PR}" y="${H-8}" font-size="9.5" fill="var(--ink-soft)" text-anchor="end">vence ${prFecha(e.vencimiento)}</text>`;
 return `<svg class="pr-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${e.subyacente.ticker}: cierres diarios desde la entrada hasta ${prFecha(e.camino[dia][0])}">${g}</svg>
  <div class="tq-leg"><span><i class="hoy"></i>Precio de entrada: ${prMon(S0,e)}</span>${K!=null?`<span><i class="stk"></i>Strike de tu opción</span>`:''}</div>`}

/* ---------- v6: gráfico de resultado al vencimiento, como en un bróker (verde gana, rojo pierde) ---------- */
function prPfVal(e,k,o,mode,S){const x=e.expo,S0=e.camino[0][1];
 const opt=prIntr(k,o.strike,S)-o.prima;return mode==='tot'?x*(S-S0)+opt:opt}
function prPfRango(e,o){const S0=e.camino[0][1],dd=!PRS||PRS.fase==='fin'?e.camino.length-1:(PRS.fase==='ficha'?0:PRS.dia),ps=e.camino.slice(0,dd+1).map(p=>p[1]);
 let lo=Math.min(S0*.9,o.strike-2*o.prima,Math.min(...ps)*.97),hi=Math.max(S0*1.1,o.strike+2*o.prima,Math.max(...ps)*1.03);
 return [Math.floor(lo/100)*100,Math.ceil(hi/100)*100]}
function prPfKpi(e,k,o,mode){const m=e.subyacente.mult,S0=e.camino[0][1],pr=o.prima,K=o.strike,x=e.expo,T=v=>prMon(v*m,e);
 let loss,gain;const Sg=v=>prSg(v*m,e);
 if(mode==='tot'&&x>0){
  if(k==='put'){const w=K-S0-pr;loss=w<0?Sg(w):prMon(0,e);gain='Sin límite'}
  else{loss=Sg(-(S0+pr));gain='Sin límite'}}
 else{loss=Sg(-pr);gain=k==='call'?'Sin límite':Sg(K-pr)}
 const be=[];const [lo,hi]=prPfRango(e,o);let pv=null,ps=null;
 for(let i=0;i<=400;i++){const S=lo+(hi-lo)*i/400,v=prPfVal(e,k,o,mode,S);
  if(pv!==null&&((pv<0&&v>=0)||(pv>0&&v<=0))&&v!==pv){const z=ps+(S-ps)*(-pv)/(v-pv);if(!be.some(b=>Math.abs(b-z)<1))be.push(Math.round(z))}
  pv=v;ps=S}
 return{cost:T(pr),loss,gain,be}}
function prPayoff(e,k,o,px,lbl){
 const m=e.subyacente.mult,mode=e.expo>0&&PRS.pfm==='tot'?'tot':'opt',[lo,hi]=prPfRango(e,o);
 const probe=PRS.probe==null?px:PRS.probe;
 const W=340,H=210,PL=50,PR=10,PT=14,PB=26,cw=W-PL-PR,ch=H-PT-PB,N=160;
 const pts=[];for(let i=0;i<=N;i++){const S=lo+(hi-lo)*i/N;pts.push([S,prPfVal(e,k,o,mode,S)*m])}
 [o.strike,px].forEach(S=>{if(S>lo&&S<hi)pts.push([S,prPfVal(e,k,o,mode,S)*m])});pts.sort((a,b)=>a[0]-b[0]);
 let ymin=Math.min(0,...pts.map(p=>p[1])),ymax=Math.max(0,...pts.map(p=>p[1]));const pad=(ymax-ymin)*.1||100;ymin-=pad;ymax+=pad;
 const X=S=>PL+(S-lo)/(hi-lo)*cw,Y=v=>PT+(ymax-v)/(ymax-ymin)*ch,f=v=>v.toFixed(1),y0=Y(0);
 const line=pts.map(p=>f(X(p[0]))+','+f(Y(p[1]))).join(' ');
 const area=`M${f(X(lo))},${f(y0)} L${line.split(' ').join(' L')} L${f(X(hi))},${f(y0)} Z`;
 const nice=r=>{const p=Math.pow(10,Math.floor(Math.log10(r))),q=r/p;return (q<=1?1:q<=2?2:q<=2.5?2.5:q<=5?5:10)*p};
 const ys=nice((ymax-ymin)/5),xs=nice((hi-lo)/4);
 let g=`<defs><linearGradient id="pfG" x1="0" y1="${f(PT)}" x2="0" y2="${f(y0)}" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:var(--gain);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--gain);stop-opacity:.06"/></linearGradient>
  <linearGradient id="pfR" x1="0" y1="${f(y0)}" x2="0" y2="${f(H-PB)}" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:var(--loss);stop-opacity:.06"/><stop offset="1" style="stop-color:var(--loss);stop-opacity:.55"/></linearGradient>
  <clipPath id="pfUp"><rect x="0" y="0" width="${W}" height="${f(y0)}"/></clipPath><clipPath id="pfDn"><rect x="0" y="${f(y0)}" width="${W}" height="${f(H-y0)}"/></clipPath></defs>`;
 for(let t=Math.ceil(ymin/ys)*ys;t<=ymax;t+=ys)g+=`<line x1="${PL}" x2="${W-PR}" y1="${f(Y(t))}" y2="${f(Y(t))}" stroke="var(--line)" opacity=".5"/><text x="${PL-5}" y="${f(Y(t)+3.5)}" font-size="9" fill="var(--ink-soft)" text-anchor="end">${prSg(Math.round(t/100)*100,e).replace(/,00(?=[\s ])/,'')}</text>`;
 for(let t=Math.ceil(lo/xs)*xs;t<=hi;t+=xs)g+=`<text x="${f(X(t))}" y="${H-10}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${Math.round(t/100)}</text>`;
 g+=`<text x="${W-PR}" y="${H-1}" font-size="8.5" fill="var(--ink-soft)" text-anchor="end">${e.subyacente.ticker} al vencimiento (${e.subyacente.divisa})</text><text x="2" y="8" font-size="8.5" fill="var(--ink-soft)">${e.subyacente.divisa} ${mode==='tot'?'en total':'por contrato'}</text>`;
 g+=`<path d="${area}" fill="url(#pfG)" clip-path="url(#pfUp)"/><path d="${area}" fill="url(#pfR)" clip-path="url(#pfDn)"/>`;
 g+=`<line x1="${PL}" x2="${W-PR}" y1="${f(y0)}" y2="${f(y0)}" stroke="var(--ink-soft)" stroke-width="1"/>`;
 g+=`<line x1="${f(X(o.strike))}" x2="${f(X(o.strike))}" y1="${PT}" y2="${H-PB}" stroke="var(--ink-soft)" stroke-width="1.3" stroke-dasharray="5 4"/><text x="${f(X(o.strike))}" y="${PT-3}" font-size="9.5" font-weight="700" fill="var(--ink-soft)" text-anchor="middle">strike ${prKn(o.strike,e)}</text>`;
 if(px>lo&&px<hi)g+=`<line x1="${f(X(px))}" x2="${f(X(px))}" y1="${PT}" y2="${H-PB}" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="1.5 3"/>`;
 g+=`<polyline points="${line}" fill="none" stroke="var(--gain)" stroke-width="2.4" stroke-linejoin="round" clip-path="url(#pfUp)"/><polyline points="${line}" fill="none" stroke="var(--loss)" stroke-width="2.4" stroke-linejoin="round" clip-path="url(#pfDn)"/>`;
 const kp=prPfKpi(e,k,o,mode);
 kp.be.forEach(b=>{if(b>lo&&b<hi)g+=`<circle cx="${f(X(b))}" cy="${f(y0)}" r="3.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>`});
 const pv=prPfVal(e,k,o,mode,probe)*m;
 g+=`<line x1="${f(X(probe))}" x2="${f(X(probe))}" y1="${PT}" y2="${H-PB}" stroke="var(--ink)" stroke-width="1" opacity=".55"/><circle cx="${f(X(probe))}" cy="${f(Y(pv))}" r="5" fill="${pv>=0?'var(--gain)':'var(--loss)'}" stroke="var(--surface)" stroke-width="2"/>`;
 const nm=`${k==='call'?'Call':'Put'} ${prKn(o.strike,e)}`;
 const tg=e.expo>0?`<div class="pf-tog" role="group" aria-label="Qué se dibuja"><button class="${mode==='opt'?'on':''}" aria-pressed="${mode==='opt'}" onclick="prPfm('opt')">Solo la opción</button><button class="${mode==='tot'?'on':''}" aria-pressed="${mode==='tot'}" onclick="prPfm('tot')">Con tus ${m} ${prUs(e)}</button></div>`:'';
 return `<div class="pfb" id="prPf"><div class="pfb-h"><b>Resultado al vencimiento</b><span>${mode==='tot'?`1 ${nm} comprada + tus ${m} ${prUs(e)} · en total`:`1 ${nm} comprada · por contrato (${m} ${prUs(e)})`}</span></div>${tg}
  <div class="pfb-k"><div><span>Coste (prima)</span><b>${kp.cost}</b></div><div><span>Pérdida máxima</span><b class="neg">${kp.loss}</b></div><div><span>Ganancia máxima</span><b class="pos">${kp.gain}</b></div><div><span>Punto muerto</span><b>${kp.be.length?kp.be.map(b=>prKn(b,e)).join(' / '):'—'}</b></div></div>
  <svg class="pfb-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Resultado al vencimiento de la ${nm} comprada según el precio de ${e.subyacente.ticker}">${g}</svg>
  <p class="pfb-r">Si al vencimiento ${e.subyacente.ticker} está en <b>${prMon(probe,e)}</b>: <b class="${prCls(pv)}">${prSg(Math.round(pv),e)}</b> ${mode==='tot'?'en total':'por contrato'}</p>
  <input type="range" min="${lo}" max="${hi}" step="1" value="${Math.round(probe)}" oninput="prProbe(this.value)" aria-label="Precio de ${e.subyacente.ticker} al vencimiento" aria-valuetext="${prMon(probe,e)}">
  <div class="pf-jump" role="group" aria-label="Ir a un precio"><button onclick="prProbe(${o.strike})">Strike ${prKn(o.strike,e)}</button>${kp.be.filter(z=>z>lo&&z<hi).map(z=>`<button onclick="prProbe(${z})">Punto muerto ${prKn(z,e)}</button>`).join('')}<button onclick="prProbe(${Math.round(px)})">${lbl}</button></div>
  <div class="tq-leg"><span><i class="hoy"></i>${lbl}: ${prMon(px,e)}</span><span><i class="stk"></i>Strike</span><span><i class="be"></i>Punto muerto</span></div>
  <p class="pr-note">La línea es el resultado el día del vencimiento. Antes, la opción vale además su valor temporal (Lección 6); dibujarlo exige un modelo de valoración que este curso no trata. Mueve el deslizador para ver otros precios.</p></div>`}
function prPfData(){const e=prE(PRS.id),s=PRS.sel;if(!s||s.k==='none')return null;const o=e.cadena[s.k][s.i];
 const n=e.camino.length,px=PRS.fase==='ficha'?e.camino[0][1]:(PRS.fase==='fin'?e.final:e.camino[PRS.dia][1]);
 const lbl=PRS.fase==='ficha'?'Precio hoy':(PRS.fase==='fin'?'Precio al vencimiento':'Cierre de este día');return{e,k:s.k,o,px,lbl}}
function prPfHTML(){const d=prPfData();return d?prPayoff(d.e,d.k,d.o,d.px,d.lbl):''}
function prPfm(mo){PRS.pfm=mo;PRS.probe=null;const el=document.getElementById('prPf');if(el)el.outerHTML=prPfHTML()}
function prProbe(v){PRS.probe=+v;const el=document.getElementById('prPf');if(!el)return;
 const rg=el.querySelector('input[type=range]');if(rg&&+rg.value!==+v)rg.value=v;
 const t=document.createElement('div');t.innerHTML=prPfHTML();const nw=t.firstElementChild;
 el.querySelector('.pfb-svg').replaceWith(nw.querySelector('.pfb-svg'));el.querySelector('.pfb-r').replaceWith(nw.querySelector('.pfb-r'));
 el.querySelector('input[type=range]').setAttribute('aria-valuetext',nw.querySelector('input[type=range]').getAttribute('aria-valuetext'))}

function prObj(e){const x=e.expo,u=prU(e);
 if(x>0)return `No perder más de <b>${prMon(-e.limite,e)}</b> por ${u}, contando lo que pague por protegerse.`;
 if(x<0)return `No pagar más de <b>${prMon(e.limite,e)}</b> por ${u}, contando lo que pague por protegerse.`;

function homePractica(){
 if(!prUnlocked())return `<div class="sec-head"><h1>Práctica</h1></div>
  <p class="sec-hint">Episodios reales del pasado: eliges como en un bróker, avanzas el tiempo y ves qué pasó.</p>
  <p class="gl-lock">${LOCK}<span>Se abre al terminar la Lección ${PR_UNLOCK}: necesitas haber visto cobertura, comprador y vendedor, y cómo funciona el mercado. Llevas ${S.done.filter(x=>x<=PR_UNLOCK).length} de ${PR_UNLOCK}.</span></p>`;
 const pr=S.pr||{};
 const card=e=>{const r=pr[e.id],fin=r&&r.fin!==false;
  const st=r&&!fin?'<span class="pill">En curso · decisión tomada</span>':r?(r.ok?'<span class="pill ok">✓ Hecho · cumpliste el objetivo</span>':'<span class="pill no">✗ Hecho · no cumplías el objetivo</span>'):'<span class="pill">Sin empezar</span>';
  return `<button class="pr-card" onclick="prOpen('${e.id}')"><span class="pr-meta">${e.mercado==='us'?'EE. UU.':'MEFF'} · ${e.subyacente.ticker} · ${prFecha(e.entrada)} → ${prFecha(e.vencimiento)}</span>
   <b>${e.titulo}</b><span class="pr-line">${PR_LINEA[e.id]||''}</span>${st}</button>`};
 const us=PRI.filter(e=>e.mercado==='us'),es=PRI.filter(e=>e.mercado==='es');
 return `<div class="sec-head"><h1>Práctica</h1><span class="sec-count">${Object.keys(pr).filter(k=>prE(k)&&pr[k].fin!==false).length} de ${PRI.length} hechos</span></div>
  <p class="sec-hint">Episodios reales del pasado. Operas como en un bróker con los precios de aquel día, avanzas el tiempo y, al vencimiento, ves si tu decisión cumplía el objetivo. No cuenta para el test ni para el certificado.</p>${prSug()}
  ${es.length?`<div class="pr-list">${es.map(card).join('')}</div>`:''}
  ${us.length?prBanda(us[0])+`<div class="pr-list">${us.map(card).join('')}</div>`:''}
`}

/* ---------- fase 1: el bróker el día de entrada ---------- */
function prCab(e,dia){const [d,S]=e.camino[dia],S0=e.camino[0][1],prev=dia>0?e.camino[dia-1][1]:null;
 const ch=prev==null?'':`<small class="${prCls(S-prev)}">${prSg(S-prev,e)} (${((S-prev)/prev*100).toFixed(2).replace('.',',').replace('-','−')} %) en la sesión</small>`;
 return `<div class="brk-top"><span class="brk-logo" aria-hidden="true">${e.subyacente.ticker}</span>
  <div class="brk-id"><b>${e.subyacente.ticker}</b><span>${e.subyacente.nombre}</span></div>
  <div class="brk-px"><b>${prMon(S,e)}</b>${ch}<span>Cierre del ${prFecha(d,true)}</span></div></div>`}
function prCadena(e){
 const t=PRS.tab,S0=e.camino[0][1],s=PRS.sel,g=PRS.vista==='grafica',tn=t==='call'?'Call':'Put';
 const rows=e.cadena[t].map((o,i)=>({o,i})).sort((a,b)=>a.o.strike-b.o.strike);
 let body;
 if(!g){let html='',linea=false;
  const spot=`<div class="ch-spot" aria-hidden="true"><span>${e.subyacente.ticker} hoy: ${prMon(S0,e)}</span></div>`;
  rows.forEach(({o,i})=>{
   if(!linea&&o.strike>S0){html+=spot;linea=true}
   const on=s&&s.k===t&&s.i===i,tag=mTag(t,o.strike,S0);
   html+=`<div class="ch-row ${tag==='dentro del dinero'?'itm':''} ${on?'on':''}">
    <div class="ch-k"><b>${prK(o.strike,e)}</b><small>${tag}</small></div>
    <div class="ch-bid" title="Vender para abrir: bloqueado en esta práctica"><small>Vender</small><span>${prMon(o.bid,e)}</span>${LOCK}</div>
    <button class="ch-ask" onclick="prSel('${t}',${i})" aria-pressed="${on}" aria-label="Comprar ${tn} de strike ${prK(o.strike,e)} a ${prMon(o.prima,e)}"><small>${on?'Elegida':'Comprar'}</small><span>${prMon(o.prima,e)}</span><small class="ch-tot">× ${e.subyacente.mult} = ${prMon(o.prima*e.subyacente.mult,e)}</small></button></div>`});
  if(!linea)html+=spot;
  body=`<div class="ch-head"><span>Strike</span><span>Demanda (bid)</span><span>Oferta (ask)</span></div>
  <div class="ch-list">${html}</div>
  <p class="pr-note">Precios por ${prU(e)}, en ${e.subyacente.divisa}, del día de entrada (base de datos de opciones de DoltHub). <b>Strike</b>: el precio pactado. <b>Oferta (ask)</b>: lo que pagas por ${prU(e)} si compras; el contrato son ${e.subyacente.mult}. <b>Demanda (bid)</b>: lo que cobrarías al vender. Vender para abrir una posición está bloqueado aquí; para cerrar una opción que ya compraste, la venderías a ese precio.</p>`}
 else{const sel=s&&s.k===t;
  body=`<p class="vw-h">Elige el strike de la ${tn} que comprarías:</p>
  <div class="vw-k" role="group" aria-label="Strikes de las ${tn}">${rows.map(({o,i})=>{const on=sel&&s.i===i;
   return `<button class="${on?'on':''}" aria-pressed="${on}" onclick="prSel('${t}',${i})" aria-label="${tn} de strike ${prK(o.strike,e)}, prima ${prMon(o.prima,e)}"><b>${prKn(o.strike,e)}</b><small>prima ${prMon(o.prima,e)}</small></button>`}).join('')}</div>
  ${sel?prPfHTML()+`<button class="btn ink wide vw-buy" onclick="prVer('prTicket');prFoco('#prTicket .btn')">Ir a la orden de compra · ${prMon(e.cadena[t][s.i].prima*e.subyacente.mult,e)}</button>`
   :`<div class="vw-empty">${ICG}<p>Toca un strike: aquí verás cuánto ganarías o perderías con esa ${tn} comprada según dónde acabe ${e.subyacente.ticker} el día del vencimiento.</p></div>`}`}
 return `<div class="brk" id="prBrk">${prCab(e,0)}
  <div class="brk-exp"><span>Vencimiento</span><b>${prFecha(e.vencimiento,true)}</b><small>dentro de ${prDias(e.entrada,e.vencimiento)} días</small></div>
  <div class="brk-seg" role="tablist" aria-label="Tipo de opción"><button role="tab" aria-selected="${t==='call'}" tabindex="${t==='call'?0:-1}" class="${t==='call'?'on':''}" onclick="prTab('call')" onkeydown="prTabKey(event)">Call<small>derecho a comprar</small></button><button role="tab" aria-selected="${t==='put'}" tabindex="${t==='put'?0:-1}" class="${t==='put'?'on':''}" onclick="prTab('put')" onkeydown="prTabKey(event)">Put<small>derecho a vender</small></button></div>
  ${prVwBar(['Tabla','precios de hoy'],['Gráfica','resultado al vencimiento'])}
  ${body}</div>`}
function prTicket(e){const s=PRS.sel,m=e.subyacente.mult;
 if(!s)return `<button class="pr-none" onclick="prSel('none')">No comprar nada (no operar)</button>
  <p class="pr-note" style="text-align:center">Toca «Comprar» en una fila de la cadena o elige no operar.</p>`;
 if(s.k==='none')return `<div class="tk" id="prTicket"><div class="tk-h"><span>Tu decisión</span><button class="tk-x" onclick="prCancel()" aria-label="Cancelar">×</button></div>
  <b class="tk-t">No operar</b><p class="tk-p">No compras ninguna opción y no abres ninguna posición.</p>
  <button class="btn ink wide" onclick="prOrder()">Confirmar: no operar</button></div>`;
 const o=e.cadena[s.k][s.i],nm=`${s.k==='call'?'Call':'Put'} ${e.subyacente.ticker} ${prKn(o.strike,e)}`;
 if(PRS.paso==='review')return `<div class="tk rv" id="prTicket"><div class="tk-h"><span>Revisa la orden</span></div>
  <p class="tk-p">Vas a comprar <b>1 ${nm}</b> con vencimiento el ${prFecha(e.vencimiento,true)} por <b>${prMon(o.prima*m,e)}</b>.</p>
  <ul class="rv-l"><li>Te da el derecho a ${s.k==='call'?'comprar':'vender'} ${m} ${prUs(e)} a ${prK(o.strike,e)} hasta el vencimiento.</li>
   <li>Pagas la prima hoy y no se devuelve, uses o no el derecho.</li>
   <li>Orden a mercado: compras al precio de oferta de ese momento. Con una orden limitada fijarías el precio máximo que aceptas.</li>
   <li>Lo máximo que puedes perder con esta opción es esa prima: ${prMon(o.prima*m,e)}.</li>${e.expo>0&&s.k==='put'?`<li><b>Con tus ${m} ${prUs(e)}, el peor caso es strike − precio de hoy − prima: ${prK(o.strike,e)} − ${prMon(e.camino[0][1],e)} − ${prMon(o.prima,e)} = ${prSg(o.strike-e.camino[0][1]-o.prima,e)} por ${prU(e)} (${prSg((o.strike-e.camino[0][1]-o.prima)*m,e)} en total).</b></li>`:e.expo>0?`<li><b>Esta Call no protege tus ${m} ${prUs(e)}: si bajan, pierdes la caída entera más la prima.</b></li>`:''}${e.expo<0&&s.k==='call'?`<li><b>Como mucho pagarás strike + prima: ${prK(o.strike,e)} + ${prMon(o.prima,e)} = ${prMon(o.strike+o.prima,e)} por ${prU(e)}. Tu límite: ${prMon(e.limite,e)}.</b></li>`:''}
   <li>Si la ejerces, ${s.k==='call'?`pagas ${prMon(o.strike*m,e)} (${prK(o.strike,e)} × ${m}) y recibes las ${m} ${prUs(e)}`:`vendes ${m} ${prUs(e)} a ${prK(o.strike,e)} y cobras ${prMon(o.strike*m,e)}`}. Ese importe no es la prima. También puedes cerrarla antes, vendiéndola en el mercado.</li></ul>
  <div class="rv-b"><button class="btn ghost" onclick="prPaso('ticket')">Modificar</button><button class="btn ink" onclick="prOrder()">Confirmar la compra simulada</button></div></div>`;
 return `<div class="tk" id="prTicket"><div class="tk-h"><span>Orden de compra</span><button class="tk-x" onclick="prCancel()" aria-label="Cancelar la orden">×</button></div>
  <b class="tk-t">${nm} · vto. ${prFecha(e.vencimiento)}</b>
  ${PRS.vista!=='grafica'?`<button class="linkbtn tk-g" onclick="prVw('grafica');prVer('prBrk')">${ICG}Ver su gráfica: resultado al vencimiento</button>`:''}
  <dl class="tk-dl"><div><dt>Operación</dt><dd>Comprar (abrir posición)</dd></div>
   <div><dt>Cantidad</dt><dd><span class="qty"><button disabled aria-label="Menos">−</button><b>1</b><button disabled aria-label="Más">+</button></span> contrato = ${m} ${prUs(e)}<small>fija en esta práctica</small></dd></div>
   <div><dt>Tipo de orden</dt><dd>A mercado: pagas la oferta</dd></div>
   <div><dt>Prima</dt><dd>${prMon(o.prima,e)} por ${prU(e)}</dd></div>
   <div class="tot"><dt>Total a pagar</dt><dd>${prMon(o.prima*m,e)}</dd></div></dl>
  <button class="btn ink wide" onclick="prPaso('review')">Revisar la orden</button></div>`}
function prPistaTxt(e){const x=e.expo;
 if(x>0)return 'Con una Put comprada, lo peor que te puede pasar por participación se sabe hoy: <b>strike − precio de hoy − prima</b>. Calcúlalo para cada Put y compáralo con lo que puedes perder.';
 if(x<0)return 'Con una Call comprada, lo máximo que pagarás se sabe hoy: <b>strike + prima</b>. Calcúlalo para cada Call y compáralo con lo que puedes pagar.';
 return 'Sin nada que proteger, comprar una opción es apostar por una previsión. Pregúntate qué necesita esta persona, no qué podría ganar.'}
function prFicha(e){
 return `<p class="pr-obj"><span><svg class=ei data-i=target aria-hidden=true><use href=#i-target></use></svg> Objetivo</span>${prObj(e)}</p>
  <div class="case"><span class="tag">LA SITUACIÓN · CASO REAL</span><p>${e.ctx}</p></div>
  ${e.mercado==='us'?`<details class="pr-det"><summary>Reglas de este mercado</summary>${prBanda(e)}</details>`:prBanda(e)}
  ${prCadena(e)}
  ${prTicket(e)}
  ${prCmp(e)}
  <button class="linkbtn" style="margin:16px 0 4px" onclick="prPista()" aria-expanded="${PRS.pista}">${PRS.pista?'Ocultar la pista':'¿Cómo sé si una opción cumple el objetivo?'}</button>
  ${PRS.pista?`<p class="pr-hint">${prPistaTxt(e)}</p>`:''}`}

/* comparar las opciones con lo que se sabía el día de entrada (sin el desenlace) */
function prCmp(e){const x=e.expo,m=e.subyacente.mult,u=prU(e);
 const filas=[...['call','put'].flatMap(t=>(e.cadena[t]||[]).map(o=>({t,o}))),{t:'none',o:null}];
 const col=x>0?`Peor caso con tus ${m} ${prUs(e)}`:x<0?'Como mucho pagarás por '+u:'Lo máximo que puedes perder';
 const val=({t,o})=>{const w=prCalc(e,t,o).worst;if(x<0)return w==null?'sin máximo':prMon(w,e);return `${prSg(w,e)} <small>(${prSg(w*m,e)})</small>`};
 return `<details class="pr-det"><summary>Comparar las opciones antes de decidir</summary><div class="pr-cmp"><table><thead><tr><th>Decisión</th><th>Prima del contrato</th><th>${col}${x===0?'':` <small>por ${u}</small>`}</th></tr></thead><tbody>
  ${filas.map(f=>`<tr><td>${f.o?`${f.t==='call'?'Call':'Put'} ${prKn(f.o.strike,e)}`:'No operar'}</td><td>${f.o?prMon(f.o.prima*m,e):'—'}</td><td>${val(f)}</td></tr>`).join('')}</tbody></table>
  <p>Solo con lo que se sabía el día de entrada: no dice qué pasó después. Compáralo con tu objetivo.</p></div></details>`}

/* ---------- fase 2: la cartera mientras pasa el tiempo ---------- */
function prCartera(e){const s=PRS.sel,o=s.k==='none'?null:e.cadena[s.k][s.i],S0=e.camino[0][1],[,S]=e.camino[PRS.dia],x=e.expo,m=e.subyacente.mult,u=prU(e);
 const intr=o?prIntr(s.k,o.strike,S):0,opt=o?intr-o.prima:0;
 const fila=(a,b,c,d)=>`<div class="ct-r"><span>${a}<small>${b}</small></span><b class="${c}">${d}</b></div>`;
 let rows='';
 if(x>0)rows+=fila(`${m} ${prUs(e)} de ${e.subyacente.ticker}`,`por ${u}, frente a la entrada (${prMon(S0,e)})`,prCls(S-S0),prSg(S-S0,e));
 if(x<0)rows+=fila(`Compra prevista: ${m} ${prUs(e)}`,`el ${prFecha(e.vencimiento)}; hoy costarían ${prMon(S,e)} cada una`,'',prMon(S,e));
 if(o)rows+=fila(`${s.k==='call'?'Call':'Put'} ${prKn(o.strike,e)} · 1 contrato`,`por ${u}: valor intrínseco hoy ${prMon(intr,e)} − prima ${prMon(o.prima,e)}`,prCls(opt),prSg(opt,e));
 else rows+=fila('Sin opciones','no compraste ninguna','', '—');
 let tot;
 if(x>0)tot=fila('Total si venciera hoy',`por ${u}; ${prSg((S-S0+opt)*m,e)} en total`,prCls(S-S0+opt),prSg(S-S0+opt,e));
 else if(x<0)tot=fila('Te costaría si venciera hoy',o?'precio − intrínseco + prima':'el precio de mercado',S-opt>e.limite?'neg':'',prMon(S-opt,e));
 else tot=fila('Resultado si venciera hoy',`por ${u}; ${prSg(opt*m,e)} en total`,prCls(opt),prSg(opt,e));
 return `<div class="ct" id="prCart"><h4>Tu cartera</h4><p class="pr-note" style="margin:-4px 0 8px">Resultado hipotético si todo venciera en esta sesión. Importes por ${u}, salvo donde dice «en total».</p>${rows}<div class="ct-tot">${tot}</div>
  ${o?`<p class="pr-note">«Si venciera hoy» es un supuesto: usa el valor intrínseco de tu opción en esta sesión. No es lo que te pagarían si la vendieras hoy: su cotización suele ser algo mayor por el valor temporal (Lección 6), y esa cotización diaria no está en los datos de esta práctica.</p>`:''}</div>`}
function prTiempo(e){const s=PRS.sel,o=s.k==='none'?null:e.cadena[s.k][s.i],n=e.camino.length,m=e.subyacente.mult;
 const hs=(e.hitos||[]).map((h,j)=>[h,j]).filter(([h])=>{const i=e.camino.findIndex(p=>p[0]===h[0]);return i>=0&&i<=PRS.dia});
 const toast=PRS.toast?`<p class="pr-toast" role="status">${o?`Orden ejecutada: compraste 1 ${s.k==='call'?'Call':'Put'} ${prKn(o.strike,e)} a ${prMon(o.prima,e)} (${prMon(o.prima*m,e)}).`:'Decisión registrada: no operas.'}</p>`:'';
 const g=o&&PRS.vista==='grafica';
 return `${toast}
  <div class="brk">${prCab(e,PRS.dia)}<p class="brk-ses">Sesión ${PRS.dia+1} de ${n} · vence el ${prFecha(e.vencimiento,true)}</p>
  ${prChart(e,PRS.dia,o?o.strike:null)}
  ${hs.length?`<div class="pr-news">${hs.map(([h,j])=>`<p><i>${j+1}</i><span><b>${prFecha(h[0])}.</b> ${h[1]}</span></p>`).join('')}</div>`:''}
  <div class="pr-adv"><button class="btn ghost" onclick="prAdv(1)">+1 día</button><button class="btn ghost" onclick="prAdv(5)">+1 semana</button><button class="btn ink" onclick="prAdv('fin')">Ir al vencimiento</button></div>
  <p class="pr-note" style="text-align:center;margin:8px 0 0">«+1 semana» avanza cinco sesiones de bolsa.</p></div>
  ${o?prVwBar(['Tabla','tu cartera hoy'],['Gráfica','resultado al vencimiento']):''}
  <div class="vw-body">${g?prPfHTML():prCartera(e)}</div>`}

/* ---------- fase 3: vencimiento y veredicto ---------- */
function prVeredicto(e){const s=PRS.sel,o=s.k==='none'?null:e.cadena[s.k][s.i],c=prCalc(e,s.k,o),x=e.expo,u=prU(e),m=e.subyacente.mult,K=o?prKn(o.strike,e):'';
 const all=prTodas(e),buenas=all.filter(r=>r.c.ok).map(r=>prNom(r.k,r.o,e));
 let por;
 if(x>0){if(c.ok)por=`Con la Put ${K} comprada, lo peor que podía pasar era ${prSg(c.worst,e)} por ${u} (strike − precio de hoy − prima), dentro de tu límite de ${prMon(-e.limite,e)}.`;
  else if(s.k==='put')por=`La Put ${K} protegía, pero no lo suficiente: lo peor que podía pasar con ella era ${prSg(c.worst,e)} por ${u}, más que los ${prMon(-e.limite,e)} que puedes perder. Una prima más baja no basta: el límite se comprueba el día de entrada con strike − precio de hoy − prima.`;
  else if(s.k==='call')por=`Una Call comprada no protege ${prUs(e)} que ya tienes: si caen, la Call no compensa nada y además pagas la prima.`;
  else por=`Sin protección, lo que puedes perder solo tiene el límite de que el precio llegue a 0. Tu objetivo exigía limitarlo.`}
 else if(x<0){if(c.ok)por=`Con la Call ${K} comprada, lo máximo que podías pagar era ${prMon(c.worst,e)} (strike + prima), por debajo de tus ${prMon(e.limite,e)}.`;
  else if(s.k==='call')por=`La Call ${K} ponía un máximo de ${prMon(c.worst,e)} (strike + prima): por encima de los ${prMon(e.limite,e)} que puedes pagar.`;
  else if(s.k==='put')por=`Una Put comprada no sirve a quien tendrá que comprar: si el precio sube, no le protege de nada y además paga la prima.`;
  else por=`Sin protección, si el precio sube pagas lo que marque el mercado, sin máximo. Tu objetivo exigía ponerlo.`}
 else por=c.ok?'Sin nada que proteger, no operar nunca es un error: tu dinero no corrió ningún riesgo.':'Sin nada que proteger, comprar una opción es apostar por una previsión.';
 /* decisión frente a resultado: un buen resultado no demuestra una buena decisión */
 let vs;
 if(x>0)vs=c.ok?(c.res<0?`Perdiste ${prMon(-c.res,e)} por ${u}, pero dentro de lo que podías perder: la protección hizo su trabajo.`:`Tu protección cumplió y además el resultado fue positivo.`)
  :(c.res<e.limite?`Y el resultado lo confirma: perdiste ${prMon(-c.res,e)} por ${u}, más que los ${prMon(-e.limite,e)} que podías perder.`:`Esta vez la pérdida quedó dentro de tu límite, pero por suerte: el día de entrada no estaba garantizado.`);
 else if(x<0)vs=c.ok?`Pagaste ${prMon(c.paid,e)} por ${u}, por debajo de tu máximo: la Call fijó tu precio.`
  :(c.paid>e.limite?`Y el resultado lo confirma: pagaste ${prMon(c.paid,e)} por ${u}, más que tus ${prMon(e.limite,e)}.`:`Esta vez pagaste ${prMon(c.paid,e)}, por debajo de tu máximo, pero por suerte: el día de entrada no estaba garantizado.`);
 else vs=c.ok?'No ganaste ni perdiste nada.':(c.res>0?`Ganaste ${prMon(c.res,e)} por ${u}, pero era una apuesta: un buen resultado no demuestra una buena decisión.`:`Y la apuesta salió mal: perdiste ${prMon(-c.res,e)} por ${u}, toda la prima.`);
 const resTxt=x<0?`Pagaste ${prMon(c.paid,e)}`:prSg(c.res,e),resCls=x<0?(c.paid>e.limite?'neg':'pos'):prCls(c.res);
 const resSub=x<0?`por ${u}, prima incluida; ${prMon(c.paid*m,e)} por las ${m} ${prUs(e)}`:`por ${u}; ${prSg(c.res*m,e)} en total`;
 return `<div class="vd ${c.ok?'ok':'no'}" role="status"><span class="vd-ic" aria-hidden="true">${c.ok?'✓':'✗'}</span>
   <div><small>${c.ok?'Buena decisión':'Decisión equivocada'}</small><b>${c.ok?'Cumplía el objetivo':'No cumplía el objetivo'}</b></div></div>
  <div class="vd-grid"><div><small>Elegiste</small><b class="${c.ok?'pos':'neg'}">${prNom(s.k,o,e)}</b></div>
   <div><small>${buenas.length>1?'Cumplían el objetivo':'La correcta'}</small><b class="pos">${prLista(buenas)}</b>${buenas.length>1?'<span>cualquiera de ellas</span>':''}</div>
   <div class="full"><small>Resultado al vencimiento</small><b class="${resCls}">${resTxt}</b><span>${resSub}</span></div></div>
<!--vw-->
  <p class="vd-p"><b>Por qué.</b> ${por}</p>
  <p class="vd-p"><b>Decisión y resultado.</b> ${vs}</p>`}
function prMejor(e){const x=e.expo,all=prTodas(e);
 const best=x<0?all.reduce((a,r)=>r.c.paid<a.c.paid?r:a):all.reduce((a,r)=>r.c.res>a.c.res?r:a);
 const val=x<0?`pagó ${prMon(best.c.paid,e)}`:prSg(best.c.res,e);
 return `<p class="pr-note pr-mejor">Con lo que pasó después, el mejor resultado lo habría dado <b>${prNom(best.k,best.o,e)}</b> (${val} por ${prU(e)})${best.c.ok?', que además cumplía el objetivo':''}. Eso no se sabía el ${prFecha(e.entrada)}: la decisión se juzga con lo que se sabía ese día.</p>`}
function prTabla(e){const s=PRS.sel,x=e.expo,u=prU(e);
 const wH=x>0?'Peor caso<small>sabido el día de entrada</small>':(x<0?'Máximo<small>sabido el día de entrada</small>':'Pérdida máxima<small>sabida el día de entrada</small>');
 const rH=x<0?'Pagó<small>al vencimiento</small>':'Resultado<small>al vencimiento</small>';
 const rows=prTodas(e).map(r=>{const c=r.c,me=s.k===r.k&&(r.k==='none'||s.i===r.i);
  const w=x>0?(r.k==='put'?prSg(c.worst,e):`${prSg(c.worst,e)}<small>si llegara a 0</small>`):(x<0?(c.worst==null?'sin máximo':prMon(c.worst,e)):prSg(c.worst,e));
  const v=x<0?prMon(c.paid,e):prSg(c.res,e);

function pfShade(b,X,Y){
 const call=b.kind==='call',be=call?b.strike+b.prima:b.strike-b.prima,y0=Y(0).toFixed(1);
 if(be<=b.min||be>=b.max||b.strike<=b.min||b.strike>=b.max)return '';
 const f=v=>call?Math.max(v-b.strike,0)-b.prima:Math.max(b.strike-v,0)-b.prima;
 const pt=v=>X(v).toFixed(1)+','+Y(f(v)).toFixed(1),z=v=>X(v).toFixed(1)+','+y0;
 const loss=call?[z(b.min),pt(b.min),pt(b.strike),z(be)]:[z(be),pt(b.strike),pt(b.max),z(b.max)];
 const gain=call?[z(be),pt(b.max),z(b.max)]:[z(b.min),pt(b.min),z(be)];
 return `<g pointer-events="none"><polygon points="${loss.join(' ')}" fill="var(--loss)" opacity=".13"/><polygon points="${gain.join(' ')}" fill="var(--gain)" opacity=".16"/></g>`}
function payoffSVG(b,p,hideBE){
 const W=340,H=216,PL=48,PR=12,PT=16,PB=38;
 const cw=W-PL-PR,ch=H-PT-PB;
 const pnl=v=>b.kind==='call'?Math.max(v-b.strike,0)-b.prima:Math.max(b.strike-v,0)-b.prima;
 const vals=[b.min,b.strike,b.max].map(pnl);
 const stock=v=>v-b.strike;
 let yMax=Math.max(...vals)*1.15,yMin=-b.prima*2.4;
 if(b.compare){yMin=Math.min(yMin,stock(b.min)*1.1);yMax=Math.max(yMax,stock(b.max)*1.05)}
 const X=v=>PL+(v-b.min)/(b.max-b.min)*cw;
 const Y=v=>PT+(yMax-v)/(yMax-yMin)*ch;
 const be=b.kind==='call'?b.strike+b.prima:b.strike-b.prima;
 const pts=[b.min,b.strike,b.max].map(v=>`${X(v).toFixed(1)},${Y(pnl(v)).toFixed(1)}`).join(' ');
 const cy=Y(0);
 const hit=(k,inner)=>`<g class="hit" role="button" tabindex="0" aria-label="${({strike:'Línea del strike',prima:'Línea de la prima',equilibrio:'Línea del punto muerto',cero:'Línea de resultado cero',curva:'Línea del resultado de la opción',accion:'Línea de las acciones compradas',punto:'Punto del precio elegido'})[k]||'Parte del gráfico'}: qué significa" onclick="chartInfo('${k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();chartInfo('${k}')}">${inner}</g>`;
 const ln=(x1,y1,x2,y2,st)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st}/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="16"/>`;
 const sp=`${X(b.min).toFixed(1)},${Y(stock(b.min)).toFixed(1)} ${X(b.max).toFixed(1)},${Y(stock(b.max)).toFixed(1)}`;
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de resultado al vencimiento: ${b.label||''}">

   :`Es el precio al que la Put comprada te deja vender. A su derecha la acción vale más y ejercer daría desventaja: la Put está fuera del dinero. Justo en el strike está en el dinero. A su izquierda ejercer da ventaja: dentro del dinero. Por eso la línea negra se dobla aquí.`],

   :`Strike menos prima: ${eur(b.strike)} − ${eur(b.prima)}. A este precio, lo que ganas al ejercer es exactamente la prima y el resultado es 0 €. A su izquierda, la Put comprada gana en neto. No lo confundas con el strike: entre los dos, la Put está dentro del dinero y aun así pierde.`],

function stNext(){if(view.v!=='story')return;const n=STORY[view.id].slides.length;
 if(ST.k>=n-1){stDone();return}ST.k++;stApply(false)}
function stBack(){if(view.v!=='story'||ST.k<=0)return;ST.k--;stApply(true)}
function stHud(){const sk=DEV||stSeen(view.id);
 return `<div class="hud"><button class="x" onclick="stExit()" aria-label="Salir">×</button><span class="st-hl">Lección ${view.id} · historia</span>${sk?'<button class="st-skip" onclick="stDone()">Saltar la historia</button>':''}</div>`}
const stTxtHTML=(d,s,i)=>`<h2 class="st-h">${s.h}</h2><p class="st-p">${s.t}</p>${i===0&&d.nota?`<p class="st-note">${d.nota}</p>`:''}`;
function renderStory(){const d=STORY[view.id],n=d.slides.length;
 const pp=d.slides.map((_,i)=>`<i class="${i<=ST.k?'on':''}"></i>`).join('');
 return `<div class="beat"><p class="kicker">${d.kicker}</p>
  <div class="trio tq-g st-card"><div class="tq-steps"><span id="stN">Escena ${ST.k+1} de ${n}</span><span class="pp" id="stPP">${pp}</span></div>
  <div class="st-stage">${stSvg()}</div>
  <div class="st-txt" id="stTxt" aria-live="polite"></div>
  <div class="tq-nav"><button class="btn ghost" id="stB" onclick="stBack()" aria-label="Escena anterior">‹</button><button class="btn" id="stF" onclick="stNext()">Siguiente</button></div></div></div>`}
function stAfter(){stApply(false,true);stMinH();
 try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(view.v==='story'){stChipFit();stMinH()}})}catch(e){}}
/* el texto más largo marca la altura, para que los botones no salten de una escena a otra */
function stMinH(){const tx=$('stTxt');if(!tx)return;const d=STORY[view.id];
 const m=document.createElement('div');m.className='st-txt';
 m.style.cssText=`position:absolute;visibility:hidden;left:-9999px;top:0;width:${tx.clientWidth}px`;
 document.body.appendChild(m);let mx=0;
 d.slides.forEach((s,i)=>{m.innerHTML=stTxtHTML(d,s,i);mx=Math.max(mx,m.offsetHeight)});
 m.remove();tx.style.setProperty('--st-mh',mx+'px')}
addEventListener('resize',()=>{if(view.v==='story')stMinH()});
document.addEventListener('keydown',e=>{if(view.v!=='story'||e.altKey||e.ctrlKey||e.metaKey)return;
 const tg=e.target;if(tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))return;
 try{if(window.__guia&&window.__guia.estado())return}catch(x){}
 if(e.key==='ArrowRight'){e.preventDefault();stNext()}else if(e.key==='ArrowLeft'){e.preventDefault();stBack()}});

function stApply(back,init){
 stClear();
 const d=STORY[view.id],n=d.slides.length,k=ST.k,s=d.slides[k],sv=$('stSvg');if(!sv)return;
 const rm=stRM();
 if(!stSeen(view.id)){S.stk=S.stk||{};if(S.stk[view.id]!==k){S.stk[view.id]=k;save()}}
 const tx=$('stTxt');
 if(tx){tx.classList.remove('chg');void tx.offsetWidth;tx.classList.add('chg');
  tx.innerHTML=stTxtHTML(d,s,k)+`<span class="st-sr">Escena ${k+1} de ${n}. ${s.lbl}${s.bub?` Julián dice: «${s.bub.l.join(' ')}».`:''}</span>`}
 const nn=$('stN');if(nn)nn.textContent=`Escena ${k+1} de ${n}`;
 document.querySelectorAll('#stPP i').forEach((p,i)=>p.classList.toggle('on',i<=k));
 const bb=$('stB');if(bb)bb.disabled=k===0;
 const ff=$('stF');if(ff)ff.textContent=k===n-1?'Empezar la lección':'Siguiente';
 /* en la escena de los meses, al volver atrás o sin animaciones se ve ya el final */
 const fin=s.seq&&(rm||back)?s.seq[s.seq.length-1]:null;
 sv.dataset.time=s.time||'day';
 sv.dataset.crop=fin?fin.crop:(s.crop||'bare');
 stChip(fin?fin.mes:s.mes,s.mes2||'',!init&&!rm);
 /* Julián: si cambia de sitio, camina; la postura de la escena llega cuando para */
 const jl=sv.querySelector('.jl');
 jl.dataset.mood=s.mood||'smile';
 let x0=ST.x;
 if(init&&s.from!=null&&!rm)x0=s.from;
 if(x0==null)x0=s.x;
 if(init){jl.classList.add('nt');jl.style.transform=stTr(x0);jl.getBoundingClientRect();jl.classList.remove('nt')}
 const moving=!rm&&Math.abs(x0-s.x)>2;
 jl.classList.toggle('walk',moving);
 jl.dataset.pose=moving?'idle':(s.pose||'idle');
 const go=()=>{jl.style.transform=stTr(s.x)};
 if(init&&moving)requestAnimationFrame(()=>requestAnimationFrame(go));else go();
 ST.x=s.x;
 const arrive=moving?(init?1000:960):240;
 if(moving)stLater(()=>{jl.classList.remove('walk');jl.dataset.pose=s.pose||'idle'},init?1000:950);
 stSign(sv,s,back,rm);
 sv.querySelector('.sacks').classList.toggle('on',!!s.sacks);
 sv.querySelector('.cta').classList.toggle('on',!!s.cuenta);sv.classList.toggle('cta-on',!!s.cuenta);
 sv.querySelector('.shd').classList.toggle('on',!!s.shield);
 stBub(sv,null);stThink(sv,false);
 if(s.bub)stLater(()=>stBub(sv,s),rm?0:arrive);
 if(s.think)stLater(()=>stThink(sv,true,s.x),rm?0:arrive);
 if(s.seq&&!fin)s.seq.forEach((z,i)=>{if(i)stLater(()=>{sv.dataset.crop=z.crop;stChip(z.mes,'',true)},i*900)})}

/* calendario de arriba a la izquierda */
function stChip(m,m2,anim){const sv=$('stSvg');if(!sv)return;const tx=sv.querySelector('.chip-tx');
 const set=()=>{ST.mes=m;ST.mes2=m2;sv.querySelector('.chip-t').textContent=m;sv.querySelector('.chip-s').textContent=m2?'· '+m2:'';stChipFit()};
 if(anim&&(m!==ST.mes||m2!==ST.mes2)){tx.classList.add('fade');stLater(()=>{set();tx.classList.remove('fade')},200)}else set()}
function stChipFit(){const sv=$('stSvg');if(!sv)return;const t=sv.querySelector('.chip-t'),u=sv.querySelector('.chip-s');
 let w1=60,w2=0;try{w1=t.getComputedTextLength()}catch(e){}
 try{w2=ST.mes2?u.getComputedTextLength()+5:0}catch(e){}
 u.setAttribute('x',(30+w1+5).toFixed(1));
 const w=(30+w1+w2+12).toFixed(1);sv.querySelectorAll('.chip-w').forEach(r=>r.setAttribute('width',w))}

/* cartel del precio: valor, línea de los últimos meses y aviso de caída */
function stSetV(sv,v){const t=sv.querySelector('.sg-v');if(t)t.textContent=eur(Math.round(v)*100)}
function stSpark(sv,vals){const p=sv.querySelector('.sg-sp');if(!p)return;
 if(!vals||!vals.length){p.setAttribute('points','');return}
 const N=9,x0=84,x1=118,y=v=>(46-(v-145)/(210-145)*22).toFixed(1);
 p.setAttribute('points',vals.map((v,i)=>`${(x0+(x1-x0)*i/(N-1)).toFixed(1)},${y(v)}`).join(' '))}
function stSign(sv,s,back,rm){const g=sv.querySelector('.sign'),q=s.sign;
 if(!q){g.classList.add('off');return}
 g.classList.remove('off');g.classList.toggle('bd',!!q.bd);
 if(q.bd)sv.querySelector('.sg-bdt').textContent=q.bd;
 g.classList.toggle('loss',q.tone==='loss'&&(rm||back||!q.drop));
 if(q.walk){
  if(rm||back){stSetV(sv,q.v);stSpark(sv,q.walk)}
  else{stSetV(sv,q.walk[0]);stSpark(sv,[q.walk[0]]);
   q.walk.forEach((v,i)=>{if(i)stLater(()=>{stSetV(sv,v);stSpark(sv,q.walk.slice(0,i+1))},i*440)})}}
 else if(q.drop){const base=(STORY[view.id].slides.find(z=>z.sign&&z.sign.walk)||{sign:{walk:[]}}).sign.walk;
  if(rm||back){stSetV(sv,q.v);stSpark(sv,[...base,q.v])}
  else{stSetV(sv,q.from);stSpark(sv,[...base,q.from]);
   stLater(()=>{g.classList.add('loss');stCount(q.from,q.v,1100,v=>{stSetV(sv,v);stSpark(sv,[...base,v])})},380)}}
 else{stSetV(sv,q.v);stSpark(sv,null)}}
function stCount(a,b,ms,cb){const t0=performance.now();
 const f=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);cb(a+(b-a)*e);
  if(p<1&&view.v==='story')ST.raf=requestAnimationFrame(f);else ST.raf=0};
 ST.raf=requestAnimationFrame(f)}

/* bocadillo de diálogo, con la cola apuntando al sombrero de Julián */
function stBub(sv,s){const w=sv.querySelector('.bubw'),g=sv.querySelector('.bub');
 if(!s||!s.bub){g.classList.remove('on');return}
 const L=s.bub.l,t=g.querySelector('.bub-t'),p=g.querySelector('.bub-r');
 t.textContent='';
 L.forEach((l,i)=>{const ts=document.createElementNS('http://www.w3.org/2000/svg','tspan');ts.setAttribute('x','0');ts.setAttribute('dy',i?'15':'0');ts.textContent=l;t.appendChild(ts)});
 let tw=0;try{tw=t.getBBox().width}catch(e){}
 if(!tw)tw=Math.max(...L.map(l=>l.length))*6.6;
 const bw=Math.ceil(tw+22),bh=L.length*15+12,r=9;
 const bx=Math.max(bw/2+6,Math.min(360-bw/2-6,s.x+(s.bub.dx||0))),by=99;
 const lx=-bw/2,rx=bw/2,tip=Math.max(lx+12,Math.min(rx-12,s.x-bx)),tb=Math.max(lx+r+2,Math.min(rx-r-13,tip-4));
 t.setAttribute('y',String(-bh+18.5));
 p.setAttribute('d',`M${lx+r},${-bh} H${rx-r} Q${rx},${-bh} ${rx},${-bh+r} V${-r} Q${rx},0 ${rx-r},0 H${(tb+11).toFixed(1)} L${tip.toFixed(1)},9 L${tb.toFixed(1)},0 H${lx+r} Q${lx},0 ${lx},${-r} V${-bh+r} Q${lx},${-bh} ${lx+r},${-bh} Z`);
 w.setAttribute('transform',`translate(${bx.toFixed(1)},${by})`);
 g.classList.remove('on');void g.getBoundingClientRect();g.classList.add('on')}
function stThink(sv,on,x){const g=sv.querySelector('.thk'),w=sv.querySelector('.thkw');
 if(!on){g.classList.remove('on');return}
 w.setAttribute('transform',`translate(${(x+56).toFixed(1)},72)`);
 g.classList.remove('on');void g.getBoundingClientRect();g.classList.add('on')}

 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t0=AC.currentTime+.01;
  SND[k].forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
   g.gain.setValueAtTime(0,t0+t);g.gain.linearRampToValueAtTime(.11,t0+t+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+t+d);
   o.connect(g);g.connect(AC.destination);o.start(t0+t);o.stop(t0+t+d+.03)})}catch(e){}}

const gkDe=id=>id===6?2:(id-1)%5;   /* la Lección 6 (valor temporal) la acompaña Theta */
function gkEye(x,y,mood){
 if(mood==='zz')return `<path d="M${x-4} ${y} Q${x} ${y+3.5} ${x+4} ${y}" fill="none" stroke="${GK_INK}" stroke-width="2" stroke-linecap="round"/>`;
 return `<g class="gk-eye"><ellipse cx="${x}" cy="${y}" rx="4.6" ry="5.3" fill="#fff" stroke="${GK_INK}" stroke-width="1.6"/><circle cx="${x+.7}" cy="${y+.9}" r="2.5" fill="${GK_INK}"/><circle cx="${x+1.7}" cy="${y-.5}" r=".95" fill="#fff"/></g>`}
function gkFace(x,y,s,mood,noMouth){
 const e=gkEye(x-7.5*s,y,mood)+gkEye(x+7.5*s,y,mood);
 const ck=`<ellipse cx="${x-12*s}" cy="${y+7}" rx="3" ry="2" fill="#FF8A80" opacity=".6"/><ellipse cx="${x+12*s}" cy="${y+7}" rx="3" ry="2" fill="#FF8A80" opacity=".6"/>`;
 let m='';
 if(!noMouth){
  if(mood==='sad')m=`<path d="M${x-5} ${y+12.5} Q${x} ${y+7.5} ${x+5} ${y+12.5}" fill="none" stroke="${GK_INK}" stroke-width="2.2" stroke-linecap="round"/>`;
  else if(mood==='zz')m=`<path d="M${x-3} ${y+10} H${x+3}" stroke="${GK_INK}" stroke-width="2" stroke-linecap="round"/>`;
  else m=`<path d="M${x-6} ${y+7.5} Q${x} ${y+15} ${x+6} ${y+7.5} Z" fill="${GK_INK}"/><path d="M${x-3} ${y+11.4} Q${x} ${y+13.6} ${x+3} ${y+11.4}" fill="#E8665A"/>`}
 return `<g class="gk-face">${ck}${e}${m}</g>`}
function gkB(i,mood){const k=GK[i],st=`stroke="${GK_INK}" stroke-width="3" stroke-linejoin="round"`,cr=`fill="${GK_CR}" stroke="${k.d}" stroke-width="2"`;
 if(i===0)return{b:`<path d="M50 7 L94 90 L6 90 Z" fill="${k.c}" ${st}/><path d="M50 36 L76 82 L24 82 Z" ${cr} stroke-linejoin="round"/>`,f:gkFace(50,61,.8,mood),arms:[[24,62,9,50],[76,62,91,50]],feet:[34,66]};
 if(i===1)return{b:`<path d="M16 10 H84 Q90 10 90 16 V34 Q90 40 84 40 H46 V86 Q46 92 40 92 H22 Q16 92 16 86 Z" fill="${k.c}" ${st}/>`,f:gkFace(66,21,.8,mood),arms:[[16,60,5,49],[46,62,58,52]],feet:[24,39]};
 if(i===2){const sm=mood==='sad'?'M31 58 Q50 46 69 58':(mood==='zz'?'M30 53 H70':'M30 50 Q50 66 70 50');
  return{b:`<ellipse cx="50" cy="50" rx="37" ry="42" fill="${k.c}" ${st}/><ellipse cx="50" cy="50" rx="23" ry="29" ${cr}/><path d="${sm}" fill="none" stroke="${k.c}" stroke-width="7" stroke-linecap="round"/>`,
   f:gkFace(50,37,.75,mood,true),arms:[[14,58,3,47],[86,58,97,47]],feet:[38,62]}}
 if(i===3)return{b:`<path d="M27 44 V92 Q27 99 34 99 H38 Q45 99 45 92 V44 Z" fill="${k.c}" ${st}/><circle cx="58" cy="42" r="31" fill="${k.c}" ${st}/><circle cx="58" cy="42" r="19" ${cr}/>`,
  f:gkFace(58,39,.72,mood),arms:[[27,68,15,59],[88,52,98,42]],feet:[31,42],fy:102};
 return{b:`<path d="M44 25 H86 Q94 25 94 33 Q94 41 86 41 H52 Z" fill="${k.c}" ${st}/><circle cx="44" cy="60" r="31" fill="${k.c}" ${st}/><circle cx="44" cy="60" r="19" ${cr}/>`,
  f:gkFace(44,57,.72,mood),arms:[[14,64,4,53],[74,66,86,58]],feet:[32,56]}}
function gkSvg(i,cls,mood){i=((i%5)+5)%5;const k=GK[i],B=gkB(i,mood||'');
 return `<svg class="gk ${cls||''} ${mood==='zz'?'zz':''}" viewBox="0 0 100 112" aria-hidden="true" focusable="false"><g class="gk-all">
  ${B.feet.map(x=>`<ellipse cx="${x}" cy="${B.fy||95}" rx="7.5" ry="4.3" fill="${k.d}"/>`).join('')}
  ${B.arms.map(([x1,y1,x2,y2],j)=>`<g class="${j?'gk-armR':'gk-armL'}" style="transform-origin:${x1}px ${y1}px"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${k.d}" stroke-width="5" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="4.2" fill="${k.d}"/></g>`).join('')}
  <g class="gk-body">${B.b}</g>${B.f}</g></svg>`}

/* ---------- confeti (canvas, sin librerías) ---------- */
function confeti(n,modo){if(!motionOK())return;
 const c=document.createElement('canvas');c.className='confeti';c.setAttribute('aria-hidden','true');document.body.appendChild(c);
 const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
 const cols=GK.map(g=>g.c).concat(['#F2C14E','#5AC6A6']),lluvia=modo==='lluvia';
 const P=Array.from({length:n},(_,i)=>lluvia?{x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3}
  :{x:W/2+(Math.random()-.5)*60,y:H*.38,vx:(Math.random()-.5)*14,vy:-5-Math.random()*11});
 P.forEach((p,i)=>{p.r=Math.random()*6.28;p.vr=(Math.random()-.5)*.3;p.w=6+Math.random()*6;p.h=4+Math.random()*5;p.c=cols[i%cols.length]});
 const T=lluvia?4200:2600,t0=performance.now();
 (function f(t){const e=t-t0;x.clearRect(0,0,W,H);
  P.forEach(p=>{p.vy+=lluvia?.04:.32;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
   x.save();x.globalAlpha=Math.max(0,Math.min(1,(T-e)/600));x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
  if(e<T)requestAnimationFrame(f);else c.remove()})(t0)}

async function trCodigo(){const o={};Object.keys(S).forEach(k=>{if(k!=='posL'&&k!=='hearts')o[k]=S[k]});

 try{if(window.CompressionStream){by=new Uint8Array(await new Response(new Blob([by]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());z='2'}}catch(e){by=new TextEncoder().encode(j);z='1'}
 return 'OPC'+z+'.'+b64u(by)+'.'+infHash(j)}
async function trLeer(t){t=String(t||'').replace(/\s+/g,'');const m=/^OPC([12])\.([A-Za-z0-9_-]+)\.([0-9a-f]{8})$/.exec(t);if(!m)throw new Error('formato');

 const j=new TextDecoder().decode(by);if(infHash(j)!==m[3])throw new Error('control');
 const o=JSON.parse(j);if(!o||typeof o!=='object'||!Array.isArray(o.done))throw new Error('formato');
 o.done=[...new Set(o.done.map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=15))];o.terms=Array.isArray(o.terms)?o.terms.filter(x=>typeof x==='string').slice(0,400):[];
 o.xp=Math.max(0,Math.min(1e6,+o.xp||0));o.streak=Math.max(0,Math.min(5000,+o.streak||0));o.hearts=5;

 if(o.uni){if(typeof o.uni==='object'&&o.uni.n)o.uni={n:String(o.uni.n).slice(0,80),f:String(o.uni.f||'').slice(0,10)};else delete o.uni}

  x:'Como pagar 5 € para bloquear durante 48 horas el precio de un billete de avión de 100 €: si la tarifa sube, lo compras a 100 €; si baja, no usas el bloqueo y lo compras más barato. Lo máximo que pierdes son los 5 €.'},
 {id:'billete',t:'¿Por qué el bloqueo de un billete es una opción?',l:1,k:['billete','billetes','avion','aerolinea','aerolineas','bloqueo','bloquear','tarifa','fare lock','wizz'],
  d:'Porque tiene las cuatro piezas de una opción: pagas una cantidad que no se devuelve (la prima, 5 €) a cambio del derecho, no la obligación, de comprar a un precio fijado (100 €) hasta una fecha límite (48 horas). Wizz Air vende exactamente este servicio como «bloqueo del precio».'},
 {id:'derecho',t:'Derecho',l:1,k:['derecho','derechos','puedo elegir','elegir','libertad'],
  d:'Lo que tiene quien compra una opción: puede ejercerla o no, según le convenga. Nadie le obliga a nada.',
  x:'Con el bloqueo de tarifa puedes comprar el billete a 100 € durante 48 horas, pero no estás obligado: si baja a 90 €, lo compras a 90 €.'},
 {id:'obligacion',t:'Obligación',l:1,k:['obligacion','obligaciones','obligado','obligada','obliga','obligar','obligarme','acatar','cumplir'],
  d:'Lo que asume quien vende una opción: si el comprador ejerce, tiene que cumplir. A cambio, cobró la prima al principio.',
  x:'La aerolínea cobró tus 5 € por el bloqueo: si decides comprar en el plazo, tiene que venderte el billete a 100 €, aunque ese día cueste 120 €.'},
 {id:'subyacente',t:'Subyacente',l:2,k:['subyacente','activo subyacente','underlying'],
  d:'El activo del contrato: una acción, como Iberdrola o Inditex, o un índice, como el Ibex 35. La opción vale en función del precio de ese activo.'},
 {id:'strike',t:'Strike (precio de ejercicio)',l:2,k:['strike','precio de ejercicio','strike price','precio pactado','precio fijado','precio fijo','precio acordado','precio bloqueado','precio congelado'],
  d:'El precio al que se compra (Call) o se vende (Put) si se ejerce. Está escrito en el contrato y no cambia, se mueva lo que se mueva la acción, salvo que MEFF lo ajuste por una operación extraordinaria de la empresa.',
  x:'En el billete era el precio bloqueado: 100 €. Aunque la tarifa suba a 120 €, puedes comprarlo a 100 € dentro del plazo.'},
 {id:'prima',t:'Prima',l:1,k:['prima','primas','premium','precio de la opcion','cuanto cuesta la opcion','lo que pago','lo que se paga'],
  d:'El precio de la opción. La paga quien compra la opción a quien la vende, al principio, y no se devuelve, se ejerza o no. Para quien compra, es lo máximo que puede perder. Se cotiza por acción: 5 € por acción son 500 € por contrato de 100 acciones.',
  x:'En el billete eran los 5 € del bloqueo: se pagan al principio y no se devuelven aunque no compres.'},
 {id:'recibo',t:'¿Qué recibes a cambio de la prima?',l:3,k:['que recibo','que recibes','a cambio','que me dan','que tengo','que he comprado','por que pago','para que pago'],
  d:'Un derecho, y nada más: el derecho a comprar (Call) o a vender (Put) 100 acciones al strike hasta el vencimiento. No recibes acciones ni dividendos. Si después ejerces una Call comprada, las acciones se pagan aparte, al strike.'},
 {id:'vencimiento',t:'Vencimiento',l:2,k:['vencimiento','vencimientos','fecha limite','ultimo dia','caducidad','expiracion','expiry'],
  d:'El último día en que se puede ejercer. Hasta entonces se puede vender la opción en el mercado y, si es de estilo americano, también ejercerla. Después, el contrato deja de existir. En MEFF, las opciones sobre acciones con vencimiento mensual vencen el tercer viernes del mes; algunas acciones tienen también vencimientos semanales.'},
 {id:'alvenc',t:'¿Qué pasa exactamente al vencimiento?',l:5,k:['que pasa al vencimiento','llega el vencimiento','al vencimiento','me pagan','cobro al vencimiento','cobrar al vencimiento','que pasa el ultimo dia'],
  d:'Depende de dónde esté la opción y de cómo se liquide. Fuera del dinero: vence sin valor y no recibes nada. Dentro del dinero, depende de cómo se liquide. Por entrega (opciones sobre acciones): se ejerce automáticamente, salvo que el titular indique expresamente lo contrario, y eso significa comprar o vender de verdad 100 acciones al strike, no cobrar la diferencia; si no quieres eso, véndela antes del vencimiento. Por diferencias (como las del Ibex 35): cobras en dinero la diferencia, automáticamente.'},
 {id:'ejercer',t:'Ejercer',l:2,k:['ejercer','ejercicio','usar el derecho','usar la opcion','ejercitar'],
  d:'Usar el derecho: comprar (Call) o vender (Put) al strike. Quien compró la opción solo ejerce si le da ventaja frente al mercado; si no, la deja vencer, y la prima ya estaba pagada.'},
 {id:'noejerzo',t:'¿Qué pasa si no ejerzo?',l:5,k:['no ejerzo','si no ejerzo','no ejercer','sin ejercer','no la uso','no hago nada','no uso el derecho'],
  d:'La opción vence y pierdes la prima que ya habías pagado, nada más. Con una excepción: en MEFF, si al vencimiento la opción está dentro del dinero, se ejerce o se liquida automáticamente (en las de acciones con entrega, salvo que indiques expresamente lo contrario).'},
 {id:'asignacion',t:'Asignación',l:5,k:['asignacion','asignar','me asignan','asignado','aviso de ejercicio'],
  d:'El aviso que recibe un vendedor de una opción cuando un comprador la ejerce: la cámara reparte los ejercicios entre quienes tienen vendida esa opción. Desde ese momento tiene que cumplir: vender las acciones al strike si vendió una Call, o comprarlas al strike si vendió una Put.'},
 {id:'call',t:'Call',l:2,k:['call','calls','opcion de compra','opciones de compra','derecho a comprar'],
  d:'Opción de compra: da a quien la compra el derecho a COMPRAR el subyacente al strike. La Call comprada gana en neto si al vencimiento la acción supera el strike más la prima. Quien vende la Call se obliga a vender al strike si el comprador ejerce.',
  x:'Call comprada de strike 100 € y prima 5 €. Si la acción acaba en 110 €, compras a 100 € lo que vale 110 €: +10 € menos 5 € de prima, +5 € por acción.'},
 {id:'put',t:'Put',l:2,k:['put','puts','opcion de venta','opciones de venta','derecho a vender'],
  d:'Opción de venta: da a quien la compra el derecho a VENDER el subyacente al strike. La Put comprada gana en neto si al vencimiento la acción queda por debajo del strike menos la prima; si ya tienes las acciones, te asegura un precio de venta. Quien vende la Put se obliga a comprar al strike si el comprador ejerce.',
  x:'Put comprada de strike 100 € y prima 5 €. Si la acción acaba en 80 €, vendes a 100 € lo que vale 80 €: +20 € menos 5 € de prima, +15 € por acción.'},
 {id:'callput',t:'Call o Put, comprar o vender: cómo no confundirlas',l:2,k:['diferencia entre call y put','call o put','call y put','cual es cual','confundo','no distingo','diferencia call put','comprar o vender','call compra','put vende'],
  d:'Son dos preguntas distintas. Primera: ¿qué derecho da el contrato? Comprar el subyacente: Call. Venderlo: Put. Segunda: ¿de qué lado estás? Si pagas la prima, compras la opción y tienes el derecho; si la cobras, la vendes y tienes la obligación. Por eso «Call» no significa comprar ni «Put» significa vender: quien vende una Put se obliga a COMPRAR.'},
 {id:'itm',t:'Dentro del dinero (ITM)',l:3,k:['dentro del dinero','in the money','itm'],
  d:'Cuando ejercer ahora daría ventaja frente a comprar o vender en el mercado: la opción tiene valor intrínseco. En una Call, la acción está por encima del strike; en una Put, por debajo. No significa ganar en total: falta restar la prima.'},
 {id:'atm',t:'En el dinero (ATM)',l:3,k:['en el dinero','at the money','atm'],
  d:'El precio del subyacente es exactamente igual al strike. Ejercer no da ni ventaja ni desventaja. Es un punto, no una franja: en el mercado se suele llamar «strike ATM» al más cercano al precio, porque rara vez coinciden, pero la definición es la igualdad.'},
 {id:'otm',t:'Fuera del dinero (OTM)',l:3,k:['fuera del dinero','out of the money','otm'],
  d:'Cuando ejercer ahora daría desventaja frente al mercado, así que no se ejerce. En una Call, la acción está por debajo del strike; en una Put, por encima. Antes del vencimiento aún vale algo, su valor temporal; al vencimiento vence sin valor.'},
 {id:'moneyness',t:'Dentro, en y fuera del dinero',l:5,k:['dentro o fuera','dentro fuera','etiquetas','moneyness','in at out'],
  d:'Las tres etiquetas responden a una pregunta: si se ejerciera ahora, ¿daría ventaja frente al mercado? Sí: dentro del dinero. Ni ventaja ni desventaja, porque el precio es igual al strike: en el dinero. Desventaja: fuera del dinero. Para una Call y una Put del mismo strike la respuesta es la contraria, salvo justo en el strike.'},
 {id:'equilibrio',t:'Punto muerto (break-even)',l:3,k:['punto muerto','punto de equilibrio','equilibrio','break even','breakeven','ni gano ni pierdo','ni ganas ni pierdes','empiezo a ganar','empiezas a ganar','recuperar la prima'],
  d:'El precio al que tiene que acabar la acción para que el resultado neto sea cero. En una Call comprada: strike + prima. En una Put comprada: strike − prima. No es el strike: entre el strike y el punto muerto la opción está dentro del dinero y aun así el resultado es negativo.',
  x:'Call comprada de strike 100 € y prima 5 €: a 105 € lo que ganas al ejercer, 5 €, es exactamente la prima pagada.'},
 {id:'pierdosube',t:'¿Por qué pierdo si la acción ha subido?',l:3,k:['pierdo si sube','perder si sube','perder aunque suba','pierdo aunque suba','acerte y perdi','acertar la direccion','ha subido y pierdo','sube y pierdo','si sube por que pierdo','subido y pierdo'],
  d:'Porque la prima ya estaba pagada. Si la acción sube, pero menos que la prima, lo que ganas al ejercer no la cubre. Call comprada de strike 100 € y prima 5 €, acción en 102 €: ganas 2 € al ejercer y el resultado es −3 €. Para ganar, el precio tiene que pasar el punto muerto, 105 €.'},
 {id:'maxperd',t:'¿Cuánto puedo perder como mucho?',l:1,k:['perdida maxima','lo maximo que pierdo','lo maximo que puedo perder','cuanto puedo perder','cuanto pierdo','riesgo maximo','puedo perder mas'],
  d:'Si COMPRAS una opción, la prima: 5 € por acción son 500 € por contrato. Si VENDES una Call sin tener las acciones, la pérdida no tiene límite. Si VENDES una Put, puedes perder hasta el strike menos la prima, si la acción llega a 0 €.'},
 {id:'techo',t:'¿Cuánto puedo ganar como mucho?',l:7,k:['ganancia ilimitada','ganancia maxima','sin techo','cuanto puedo ganar','lo maximo que gano','techo','limite de ganancia','llega a cero','baja a cero','vale cero','valer cero'],
  d:'Con una Call comprada, sin límite, porque el precio de una acción no lo tiene. Con una Put comprada sí hay límite: la acción no puede bajar de 0 €, así que lo máximo es el strike menos la prima; con strike 100 € y prima 5 €, 95 € por acción. Quien vende una opción gana como mucho la prima.'},
 {id:'intrinseco',t:'Valor intrínseco',l:6,k:['valor intrinseco','intrinseco'],
  d:'Lo que daría ejercer ahora mismo. En una Call: precio − strike. En una Put: strike − precio. Si sale negativo, vale 0: nunca es negativo.',
  x:'Acción a 105 € y Call de strike 100 €: valor intrínseco de 5 €. La Put de strike 100 € tendría valor intrínseco 0.'},
 {id:'temporal',t:'Valor temporal',l:6,k:['valor temporal','temporal','valor extrinseco','extrinseco','valor tiempo','time value'],
  d:'La parte de la prima que no es valor intrínseco: prima − valor intrínseco. Es lo que se paga por el tiempo que queda y por la posibilidad de que la acción se mueva a favor antes del vencimiento. Baja con el paso del tiempo y al vencimiento vale 0.',
  x:'Si una Call de strike 100 € cuesta 10 € con la acción a 105 €, su valor intrínseco es 5 € y los otros 5 € son valor temporal.'},
 {id:'partes',t:'Prima = valor intrínseco + valor temporal',l:6,k:['partes de la prima','de que esta hecha la prima','trozos','dos trozos','verde y dorado','verde y dorada'],
  d:'Toda prima se divide en dos partes: lo que daría ejercer ahora (valor intrínseco) y el resto, lo que se paga por el tiempo que queda (valor temporal). Si sabes el precio, el strike y la prima, sabes cuánto es cada parte.'},
 {id:'yunque',t:'Efecto yunque',l:6,k:['efecto yunque','yunque','paso del tiempo','pierde valor con el tiempo','decaimiento','theta','time decay'],
  d:'Nombre que usa el manual de MEFF para el efecto del paso del tiempo sobre quien compra una opción: si todo lo demás sigue igual, su valor temporal baja cada día, aunque la acción no se mueva. En cursos avanzados se mide con la «theta», una de las griegas; aquí no hace falta.'},
 {id:'iman',t:'Efecto imán',l:6,k:['efecto iman','iman'],
  d:'El mismo paso del tiempo visto desde quien vendió la opción: cobró la prima entera al principio, así que cada día que baja el valor temporal su posición mejora.'},
 {id:'volatilidad',t:'Volatilidad',l:6,k:['volatilidad','volatil','se mueve mucho','miedo'],
  d:'Cuánto se mueve el precio de una acción. Cuanto más se mueve, más caras son sus opciones, igual que un seguro de vida cuesta más para un fumador: un movimiento grande antes del vencimiento es más probable. El VIBEX mide cuánta volatilidad espera el mercado en el Ibex 35.'},
 {id:'cara',t:'¿Qué hace cara o barata una prima?',l:6,k:['por que es cara','que hace cara','prima cara','prima barata','de que depende la prima','por que cuesta mas','precio de la prima'],
  d:'Sobre todo tres cosas: cuánto está dentro o fuera del dinero, el tiempo que queda hasta el vencimiento y cuánto se mueve la acción (volatilidad). Más valor intrínseco, más tiempo o más volatilidad: prima más cara. El manual de MEFF añade los tipos de interés y los dividendos, que pesan menos.'},
 {id:'cerrar',t:'Cerrar la posición',l:6,k:['cerrar la posicion','cerrar posicion','cerrar','vender antes','vender mi opcion','salir antes','tengo que esperar','esperar al vencimiento','antes del vencimiento'],
  d:'No tienes que esperar al vencimiento: puedes vender en el mercado la opción que compraste en cualquier momento. Cobras lo que vale ese día, valor intrínseco más valor temporal, y ya no tienes ni derecho ni obligación.'},
 {id:'vender2',t:'«Vender» una opción: dos cosas distintas',l:6,k:['vender una opcion','vendedor de opciones','vender opciones','lanzar','emitir','short','posicion corta','vender sin tener'],
  d:'Vender la opción que compraste es cerrar tu posición: cobras lo que vale y ya no tienes nada. Vender una opción que no tenías es abrir una posición vendedora: cobras la prima y te obligas a cumplir si el comprador ejerce. Lo segundo tiene un riesgo mucho mayor.'},
 {id:'descubierta',t:'Opción vendida descubierta',l:11,k:['descubierta','descubiertas','desnuda','naked','sin tener las acciones','sin las acciones'],
  d:'Vender una opción sin tener cubierta la obligación: una Call sin tener las acciones, o una Put sin tener reservado el dinero para comprar las acciones. En la Call vendida así, la pérdida no tiene límite; en la Put vendida, puede llegar al strike menos la prima. Queda fuera de este curso.'},
 {id:'garantias',t:'Garantías',l:9,k:['garantias','deposito','margen','margin','asfixiar','llamada de margen'],
  d:'Dinero que el mercado, a través de su cámara de compensación, exige como depósito a quien tiene obligaciones mientras el contrato está vivo. Si el precio va en contra, hay que aportar más. En un futuro, a las dos partes; en opciones, solo a quien vende: quien compra paga la prima y ya no debe nada más.'},
 {id:'cobertura',t:'Cobertura',l:1,k:['cobertura','cubrir','cubrirse','cubrirme','proteger','protegerse','protegerme','proteccion','seguro','asegurar','hedge','hedging'],
  d:'Tomar una posición cuyo resultado compense el de otra que ya tienes o que tendrás. Con opciones: pagar una prima a cambio de protección frente a un movimiento de precio. Tienes acciones y compras una Put: si la acción cae, lo que gana la Put compensa lo que pierden tus acciones.'},
 {id:'especulacion',t:'Especulación',l:9,k:['especulacion','especular','apostar','apuesta','ganar dinero rapido'],
  d:'Comprar una opción sin tener nada que proteger, para beneficiarse de un movimiento de precio. Se arriesga la prima entera: si el movimiento no supera la prima, se pierde dinero, y si no llega a producirse, se pierde el 100 % de lo pagado.'},
 {id:'apalanca',t:'Apalancamiento',l:1,k:['apalancamiento','apalancar','apalancarte','apalancado','apalancarse','hacerse rico','rico'],
  d:'Con poco dinero, la prima, tu resultado depende de un activo que vale mucho más: con 500 € de prima, de 100 acciones que valen 10.000 €. Los porcentajes sobre lo pagado se multiplican, para bien y para mal. Si la acción sube un 10 %, de 100 € a 110 €, una Call comprada de strike 100 € y prima 5 € gana un 100 %: 5 € netos sobre 5 € pagados. Si la acción acaba en 100 € o menos, pierde el 100 %.'},
 {id:'protectora',t:'Put protectora',l:4,k:['put protectora','protective put','proteger acciones','proteger mis acciones'],
  d:'Comprar una Put sobre acciones que ya tienes. Te asegura un precio de venta, el strike, hasta el vencimiento. Resultado mínimo por acción: strike − precio de compra − prima. Tiene sentido si quieres conservar las acciones; si crees que el negocio ha empeorado de forma duradera, venderlas es más directo.'},
 {id:'suelo',t:'Cómo se calcula el resultado mínimo con una Put protectora',l:4,k:['suelo','resultado minimo','perdida maxima con put','calcular el minimo','por que no baja'],
  d:'Strike − precio al que compraste las acciones − prima. En la Lección 4: 100 − 100 − 5 = −5 € por acción. En la Lección 14: 20,00 − 19,90 − 1,20 = −1,10 € por acción, −110 € por contrato de 100 acciones.'},
 {id:'nocubierta',t:'La caída que la Put no cubre',l:10,k:['franquicia','parte no cubierta','hueco','no cubierta','strike mas bajo','strike por debajo'],
  d:'Si compras una Put con el strike por debajo del precio actual, la caída hasta el strike no está cubierta: esa pérdida la asumes tú. Con el Ibex en 20.000 puntos, una cartera de 20.000 € que lo replica y una Put sobre el Mini IBEX de strike 19.000 (1 € por punto), la caída de 20.000 a 19.000, 1.000 €, es tuya; por debajo de 19.000, la Put compensa cada punto.'},
 {id:'payoff',t:'Cómo se lee un gráfico de resultado',l:7,k:['payoff','grafico','grafica','graficos','graficas','la linea','lineas','dibujo','diagrama','eje','ejes','leer el grafico','como se lee'],
  d:'Mira primero el título: dice qué posición es (por ejemplo, «Call comprada»), con qué strike y qué prima. Abajo, en horizontal, están los precios a los que podría acabar la acción al vencimiento. A la izquierda, lo que gana o pierde esa posición por acción. Elige un precio abajo, sube hasta la línea y mira a la izquierda.'},
 {id:'accion',t:'Qué es una acción',l:1,k:['que es una accion','una accion','accion','acciones','que son las acciones','titulo','titulos','participacion en la empresa'],
   d:'Una acción es una pequeña parte de una empresa. Se compra y se vende en bolsa, y su precio (su cotización) cambia cada día. Quien tiene acciones gana si suben y pierde si bajan. En este curso, las acciones son el activo sobre el que se contratan muchas opciones: el contrato habitual en MEFF es de 100 acciones.'},
 {id:'contrato',t:'Un contrato son 100 acciones',l:1,k:['100 acciones','cien acciones','contrato','contratos','tamano del contrato','cuantas acciones','por contrato','por accion','multiplicar por 100','por cien'],
  d:'En MEFF, cada contrato de opción sobre acciones corresponde a 100 acciones. Las primas se cotizan por acción: una prima de 5 € son 500 € por contrato. Por eso en el curso ves las cifras por acción y, al lado, por contrato.'},
 {id:'entrega',t:'Liquidación por entrega',l:5,k:['entrega','entrega fisica','me dan las acciones','recibir acciones','recibo las acciones','liquidacion','liquida','se liquida'],
  d:'Al ejercer se compran o se venden de verdad las acciones al strike; no se cobra la diferencia. Con una Call comprada de strike 100 €, ejercer un contrato significa pagar 10.000 € y recibir 100 acciones.'},
 {id:'diferencias',t:'Liquidación por diferencias',l:5,k:['por diferencias','en efectivo','liquidacion en efectivo','cash settlement'],
  d:'Al vencimiento no hay acciones de por medio: solo se paga o se cobra en dinero la diferencia entre el strike y el precio de liquidación. Así se liquidan las opciones sobre el Ibex 35 de MEFF y, desde marzo de 2025, opciones de estilo europeo sobre un grupo creciente de grandes acciones españolas: en octubre de 2025 eran once.'},
 {id:'automatico',t:'Ejercicio automático',l:5,k:['automatico','automaticamente','ejercicio automatico'],
  d:'Al vencimiento, en MEFF las opciones que están dentro del dinero se ejercen automáticamente. En las de acciones con entrega, el titular puede indicar expresamente lo contrario; las que se liquidan por diferencias (como las del Ibex 35) se pagan en dinero sin más. No depende de que el ejercicio cubra la prima: basta con estar dentro del dinero.'},
 {id:'estilo',t:'Opción europea y americana',l:12,k:['europea','americana','estilo europeo','estilo americano','europeas','americanas','estilo'],
  d:'Europea: solo se puede ejercer el día del vencimiento. Americana: cualquier día hasta el vencimiento. El nombre no tiene nada que ver con el país, y las dos se pueden vender en el mercado antes del vencimiento. En MEFF hay opciones sobre acciones de los dos estilos.'},
 {id:'bruja',t:'Cuádruple hora bruja',l:2,k:['hora bruja','cuadruple hora bruja','triple hora bruja','tercer viernes'],
  d:'El tercer viernes de marzo, junio, septiembre y diciembre, cuando vencen a la vez futuros y opciones sobre el Ibex 35 y futuros y opciones sobre acciones: cuatro tipos de contrato. El volumen negociado ese día es mucho mayor que en una sesión normal.'},
 {id:'broker',t:'Bróker (intermediario)',l:12,k:['broker','broquer','intermediario','intermediarios','miembro del mercado','donde compro','como compro','abrir cuenta','app de bolsa','banco'],
  d:'La entidad autorizada que envía tu orden a MEFF. Un particular no puede operar directamente en el mercado: siempre pasa por un intermediario que sea miembro o que opere a través de uno.'},
 {id:'bidask',t:'Demanda y oferta (bid y ask)',l:12,k:['bid','ask','oferta','demanda','horquilla','dos precios','precio de compra y venta'],
  d:'Cada opción tiene dos precios en el mercado: el más alto que está dispuesto a pagar un comprador (precio de demanda, bid) y el más bajo que pide un vendedor (precio de oferta, ask). Si compras ya, pagas la oferta; si vendes ya, cobras la demanda. La diferencia suele ser mayor en opciones poco negociadas.'},
 {id:'futuro',t:'Futuro',l:12,k:['futuro','futuros','contrato de futuros'],
  d:'Un contrato en el que comprador y vendedor se obligan los dos, uno a comprar y otro a vender, a un precio y en una fecha fijados. Como nadie tiene derecho a echarse atrás, no hay prima.'},
 {id:'swap',t:'Swap (en coberturas de combustible)',l:10,k:['swap','swaps','permuta'],
  d:'Contrato entre dos partes que fija un precio para una fecha futura. Si el mercado acaba por encima del precio fijado, una paga la diferencia a la otra; si acaba por debajo, al revés. Como un futuro, obliga a las dos partes y no tiene prima. Las aerolíneas lo usan para fijar el precio del combustible.'},
 {id:'miniibex',t:'Mini IBEX',l:10,k:['mini ibex','futuro mini ibex','mini'],
  d:'Futuro de MEFF sobre el Ibex 35 en el que cada punto vale 1 €. Las opciones sobre el Mini IBEX son de estilo europeo y se liquidan por diferencias: son las que usa la Lección 10 para proteger una cartera.'},
 {id:'multiplicador',t:'Multiplicador',l:10,k:['multiplicador','euro por punto','por punto','puntos'],
