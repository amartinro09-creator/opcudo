<!doctype html>
<html lang="es">
<head>

<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1220" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPCUDO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="OPCUDO · Entiende el riesgo antes de asumirlo">
<meta property="og:description" content="OPCUDO: entiende el riesgo antes de asumirlo. Curso introductorio y gratuito de opciones financieras, en español y con el mercado español de referencia: quince lecciones cortas, ejercicios y casos reales.">
<link rel="canonical" href="https://opcudo.es/">
<meta property="og:url" content="https://opcudo.es/">
<meta property="og:type" content="website">

<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#F4F6F9;--surface:#FFF;--soft:#EFE9D9;
  --ink:#1B2A22;--ink-soft:#5A6A5C;--line:#DCD3BF;
  --gain:#0E6B54;--gain-soft:#E2EFE8;--gain-dark:#0A5342;
  --loss:#9A3324;--loss-soft:#F7E6E1;
  --gold:#8A6214;--gold-soft:#F5E9CD;--gold-dark:#634510;--on-accent:#FFFFFF;
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0D1220;--surface:#182620;--soft:#1F2E26;
  --ink:#ECE6D6;--ink-soft:#9DAC9F;--line:#2C3C33;
  --gain:#3FAF90;--gain-soft:#19312A;--gain-dark:#5AC6A6;
  --loss:#E08A6E;--loss-soft:#33201B;--gold:#D8AE5F;--gold-soft:#2E2718;--gold-dark:#A27F3A;--on-accent:#0D1220;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D1220;--surface:#182620;--soft:#1F2E26;
  --ink:#ECE6D6;--ink-soft:#9DAC9F;--line:#2C3C33;
  --gain:#3FAF90;--gain-soft:#19312A;--gain-dark:#5AC6A6;
  --loss:#E08A6E;--loss-soft:#33201B;--gold:#D8AE5F;--gold-soft:#2E2718;--gold-dark:#A27F3A;--on-accent:#0D1220;
}
*{box-sizing:border-box}
body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.shell{max-width:620px;margin:0 auto;padding:16px 18px 150px}

.hud{display:flex;align-items:center;gap:12px;padding:14px 18px;max-width:620px;margin:0 auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.hud .x{background:none;border:none;font-size:22px;color:var(--ink-soft);padding:0;line-height:1}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:5px;border-radius:99px;background:var(--soft);transition:background .3s}
.dots i.on{background:var(--gain)}
.hearts{font-size:14px;letter-spacing:1px;white-space:nowrap}
.heart-dim{opacity:.22}

.home-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.home-head h1{font-family:var(--serif);font-size:26px;font-weight:560;line-height:1.12;margin:0}
.home-metrics{display:flex;gap:14px;font-size:13.5px;white-space:nowrap;padding-top:4px}
.home-metrics b{font-weight:700}
.ring{width:100%;margin:20px 0 28px;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gain));transition:width .5s}
.mod{margin-bottom:24px}
.mod-head{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.mod-head .num{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--gold)}
.mod-head h2{font-size:15.5px;font-weight:600;margin:0;flex:1}
.mod-head .cnt{font-size:12.5px;color:var(--ink-soft)}
.nodes{display:flex;gap:9px;flex-wrap:wrap}
.node{width:62px;height:62px;border-radius:19px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-soft);transition:transform .12s;position:relative;padding:0}
.node .n{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1}
.node .k{font-size:8.5px}
.node.open{border-color:var(--gain);color:var(--gain);box-shadow:0 3px 0 var(--gain-soft)}
.node.open:hover{transform:translateY(-2px)}
.node.done{background:var(--gain);border-color:var(--gain);color:#fff;box-shadow:0 3px 0 var(--gain-dark)}
.node.locked{opacity:.38;cursor:not-allowed}
.node.next::after{content:'';position:absolute;inset:-6px;border-radius:25px;border:2px solid var(--gain);opacity:.32;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.32}50%{transform:scale(1.06);opacity:.1}}
.legal{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-soft);line-height:1.55}

.beat{animation:slideIn .32s cubic-bezier(.2,.8,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-size:11.5px;font-weight:700;color:var(--gold);margin:0 0 10px}
.big-q{font-family:var(--serif);font-size:25px;font-weight:560;line-height:1.24;margin:0 0 8px}
.sub{font-size:14.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 22px;max-width:46ch}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;padding:16px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:inherit;transition:.12s}
.choice:hover:not(:disabled){border-color:var(--gain)}
.choice.sel{border-color:var(--gain);background:var(--gain-soft)}
.choice b{display:block;font-size:15px;font-weight:600;margin-bottom:3px}
.choice span{font-size:13px;color:var(--ink-soft);line-height:1.5}
.choice .ic{font-size:22px;line-height:1}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:430px){.pair{grid-template-columns:1fr}}
.flip{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:18px 16px;min-height:170px;text-align:left;color:inherit;display:flex;flex-direction:column;transition:border-color .15s}
.flip:hover{border-color:var(--gold)}
.flip .role{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:9px}
.flip .word{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.1;margin-bottom:8px}
.flip .hint{font-size:12.5px;color:var(--ink-soft);margin-top:auto}
.flip .txt{font-size:13.5px;line-height:1.55;animation:slideIn .25s}
.flip.a{border-color:var(--gain)}.flip.a .word{color:var(--gain)}
.flip.b{border-color:var(--loss)}.flip.b .word{color:var(--loss)}

.pfttl{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);text-align:center;text-wrap:balance}
.pfkpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 10px;text-align:center}
.pfkpi div{background:var(--soft);border-radius:10px;padding:7px 4px 8px}
.pfkpi span{display:flex;align-items:center;justify-content:center;min-height:2.5em;line-height:1.2;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.pfkpi b{display:block;margin-top:3px;font-size:15px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
.pfkpi b.neg{color:var(--loss)}.pfkpi b.pos{color:var(--gain)}
.pfkpi i{display:block;margin-top:3px;font-style:normal;font-size:10px;line-height:1.25;color:var(--ink-soft)}
.dec{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px 18px}
.dec-price{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-bottom:3px}
.dec-price b{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1;transition:color .2s}
.dec-price i{font-size:13.5px;color:var(--ink-soft);font-style:normal}
.dec-strike{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:20px}
.zoneband{position:relative;height:13px;border-radius:99px;overflow:hidden;display:flex;margin-bottom:3px}
.zoneband span{display:block;height:100%}
.zl{background:var(--loss);opacity:.5}.zm{background:var(--gold);opacity:.55}.zg{background:var(--gain);opacity:.75}
.ticks{position:relative;height:30px;margin-bottom:2px}
.tick{position:absolute;transform:translateX(-50%);text-align:center;font-size:10px;color:var(--ink-soft);line-height:1.25}
.tick i{display:block;width:2px;height:8px;background:var(--line);margin:0 auto 3px}
.tick b{display:block;font-weight:700;font-size:10.5px}
input[type=range]{width:100%;accent-color:var(--gain)}
.dec input[type=range]{margin:2px 0 16px}
.vbox{border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.55}
.vbox b.h{display:block;font-weight:700;margin-bottom:3px}
.vb-yes{background:var(--gain-soft)}.vb-yes b.h{color:var(--gain)}
.vb-mid{background:var(--gold-soft)}.vb-mid b.h{color:var(--gold)}
.vb-no{background:var(--loss-soft)}.vb-no b.h{color:var(--loss)}

.zones{display:flex;flex-direction:column;gap:9px}
.zn{display:flex;gap:13px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;padding:14px 15px;color:inherit;transition:.15s}
.zn:hover,.zn.on{border-color:var(--gold)}
.zn .swatch{width:10px;border-radius:99px;flex-shrink:0}
.zn .rng{font-family:var(--serif);font-size:15px;font-weight:700;width:104px;flex-shrink:0;line-height:1.2}
.zn .lbl{flex:1;font-size:13.5px;line-height:1.45}
.zn p{font-size:13px;line-height:1.55;color:var(--ink-soft);margin:10px 0 0}

.tl-track{display:flex;margin-bottom:18px;position:relative}
.tl-track::before{content:'';position:absolute;left:8px;right:8px;top:11px;height:2px;background:var(--line)}
.tl-node{flex:1;background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;color:var(--ink-soft)}
.tl-node .dot{width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--line);transition:all .18s}
.tl-node .yr{font-size:10.5px;font-weight:600;white-space:nowrap}
.tl-node.on .dot{background:var(--gold);border-color:var(--gold);transform:scale(1.18)}
.tl-node.on .yr{color:var(--gold)}
.tl-node.seen .dot{border-color:var(--gold)}
.tl-panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;min-height:150px}
.tl-panel h4{font-family:var(--serif);font-size:18px;font-weight:700;margin:0 0 8px}
.tl-panel p{font-size:14px;line-height:1.6;margin:0}
.tl-panel .mark{display:inline-block;font-size:11px;font-weight:700;color:var(--gold);margin-bottom:7px}

.stack{display:flex;flex-direction:column;gap:9px}
.sc{text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;padding:15px 16px;color:inherit;transition:border-color .15s}
.sc:hover,.sc.open{border-color:var(--gold)}
.sc .row{display:flex;align-items:center;gap:11px}
.sc .ic{font-size:20px}
.sc b{font-size:14.5px;font-weight:600;flex:1}
.sc .chev{color:var(--ink-soft);font-size:15px}
.sc p{font-size:13.5px;line-height:1.58;margin:11px 0 0;color:var(--ink-soft);animation:slideIn .22s}

.case{background:var(--gold-soft);border-radius:17px;padding:19px;border-left:3px solid var(--gold)}
.case .tag{font-size:11.5px;font-weight:700;color:var(--gold);display:block;margin-bottom:8px}
.case p{margin:0;font-size:14.5px;line-height:1.62}
.case .src{display:block;margin-top:11px;font-size:11.5px;color:var(--ink-soft)}

.scene{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px 16px 18px}
.stage{position:relative;height:232px}
.s-el{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.3,1)}
.s-el.on{opacity:1;transform:none}
.actor{position:absolute;top:8px;width:84px;text-align:center}
.actor .av{width:54px;height:54px;border-radius:17px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:25px;margin:0 auto 6px;border:2px solid var(--line)}
.actor .nm{font-size:10.5px;font-weight:700;color:var(--ink-soft)}
.actor.you{left:2px}.actor.seller{right:2px}
.mover{position:absolute;transition:transform 1s cubic-bezier(.3,.9,.3,1)}
.coin{top:22px;left:74px;background:var(--gold);color:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.coin.go{transform:translateX(calc(100% + 78px))}
.paper{top:88px;right:74px;background:var(--gain);color:#fff;border-radius:11px;padding:9px 13px;font-size:12px;font-weight:600;line-height:1.35;white-space:nowrap;text-align:left}
.paper.go{transform:translateX(calc(-100% - 78px))}
.paper small{display:block;font-weight:400;opacity:.85;font-size:10.5px;margin-top:2px}
.clockrow{position:absolute;left:0;right:0;top:152px;display:flex;align-items:center;gap:9px;justify-content:center;color:var(--ink-soft);font-size:12px}
.clockrow .dash{flex:1;max-width:60px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
.pricetag{position:absolute;left:50%;transform:translateX(-50%) translateY(10px);top:192px;text-align:center}
.pricetag.on{transform:translateX(-50%)}
.pricetag b{font-family:var(--serif);font-size:29px;font-weight:700;display:block;line-height:1}
.pricetag span{font-size:11px;color:var(--ink-soft)}
.caption{background:var(--soft);border-radius:13px;padding:13px 15px;font-size:14px;line-height:1.55;min-height:62px;margin-top:6px}
.caption b{color:var(--gold)}
.stepper{display:flex;align-items:center;gap:10px;margin-top:13px}
.stepper .pips{flex:1;display:flex;gap:5px}
.stepper .pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.stepper .pips i.on{background:var(--gold)}
.mini{background:var(--gold);color:#fff;border:none;border-bottom:3px solid var(--gold-dark);border-radius:11px;padding:10px 18px;font-size:13.5px;font-weight:700}
.mini:disabled{background:var(--soft);color:var(--ink-soft);border-bottom-color:var(--line)}

.branch{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.br{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;padding:15px 12px;color:inherit;text-align:center;transition:.15s}
.br .ar{font-size:23px;display:block;margin-bottom:5px}
.br b{display:block;font-family:var(--serif);font-size:19px;font-weight:700}
.br span{font-size:11.5px;color:var(--ink-soft)}
.br.up:hover,.br.up.sel{border-color:var(--gain)}.br.up.sel b{color:var(--gain)}
.br.dn:hover,.br.dn.sel{border-color:var(--loss)}.br.dn.sel b{color:var(--loss)}
.calc{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:17px;animation:slideIn .3s}
.calc h4{font-size:12.5px;font-weight:700;margin:0 0 13px;color:var(--ink-soft)}
.crow{display:flex;align-items:center;gap:11px;margin-bottom:9px;font-size:13.5px}
.crow .lbl{flex:1}
.crow .amt{font-family:var(--serif);font-weight:700;font-size:16px;white-space:nowrap}
.cbar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden;width:88px;flex-shrink:0}
.cbar i{display:block;height:100%;border-radius:99px;width:0;animation:grow .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes grow{to{width:var(--w)}}
.crow.tot{border-top:2px solid var(--line);padding-top:11px;margin-top:11px;margin-bottom:0}
.crow.tot .amt{font-size:21px}
.pos{color:var(--gain)}.neg{color:var(--loss)}

.anat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:13px}
.anat .doc{border:2px dashed var(--line);border-radius:14px;padding:16px;background:var(--bg)}
.anat .ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;margin-bottom:7px;transition:.18s;border:2px solid transparent;width:100%;text-align:left;background:none;color:inherit;font-size:13.5px}
.anat .ln:last-child{margin-bottom:0}
.anat .ln .k{color:var(--ink-soft)}
.anat .ln .v{font-family:var(--serif);font-weight:700;font-size:16px}
.anat .ln:hover{background:var(--soft)}
.anat .ln.on{border-color:var(--gold);background:var(--gold-soft)}
.anat .ttl{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:11px}
.anat-x{background:var(--surface);border:2px solid var(--line);border-radius:15px;padding:16px;min-height:96px}
.anat-x h4{font-family:var(--serif);font-size:18px;margin:0 0 7px;font-weight:700;color:var(--gold)}
.anat-x p{font-size:13.5px;line-height:1.6;margin:0}

.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.cmo{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--ink-soft);padding:0;transition:.15s}
.cmo b{font-size:13px;font-weight:700}
.cmo.hot{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.cmo.sel{background:var(--gold);color:#fff;border-color:var(--gold)}
.cal-x{background:var(--surface);border:2px solid var(--line);border-radius:15px;padding:16px;min-height:110px}
.cal-x h4{font-family:var(--serif);font-size:17px;margin:0 0 8px;font-weight:700}
.cal-x p{font-size:13.5px;line-height:1.6;margin:0}

.floor{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px 18px}
.fchart{display:block;width:100%;height:auto;margin:0 0 6px}

/* moneyness */
.mline{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px 18px 16px}
.mbar{position:relative;height:12px;border-radius:99px;background:var(--soft);margin:0 0 4px}
.mstrike{position:absolute;top:-5px;width:3px;height:22px;background:var(--gold);border-radius:2px;transform:translateX(-50%)}
.mdot{position:absolute;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);transform:translateX(-50%);transition:left .12s}
.mlabels{position:relative;height:26px;font-size:10.5px;color:var(--ink-soft)}
.mlabels span{position:absolute;transform:translateX(-50%);text-align:center}
.mcards{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.mc{border:2px solid var(--line);border-radius:15px;padding:14px 12px;text-align:center;background:var(--bg);transition:.2s}
.mc .ttl{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
.mc .st{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.1;margin-bottom:5px}
.mc .ex{font-size:11.5px;color:var(--ink-soft);line-height:1.4}
.mc.itm{border-color:var(--gain);background:var(--gain-soft)}.mc.itm .st{color:var(--gain)}
.mc.otm{border-color:var(--loss);background:var(--loss-soft)}.mc.otm .st{color:var(--loss)}
.mc.atm{border-color:var(--gold);background:var(--gold-soft)}.mc.atm .st{color:var(--gold)}

/* valor temporal */
.tv{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px 18px}
.tvbar{display:flex;height:46px;border-radius:12px;overflow:hidden;margin-bottom:9px;background:var(--soft)}
.tvbar span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transition:width .2s ease;overflow:hidden;white-space:nowrap}
.tvi{background:var(--gain)}.tvt{background:var(--gold)}
.tvkey{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft);margin-bottom:18px;flex-wrap:wrap}
.tvkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tvkey i.tvlost{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.tvtot{text-align:center;font-family:var(--serif);font-size:30px;font-weight:700;margin-bottom:2px}
.tvsub{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:18px}
.tvdays{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:10px}
.tvdays b{color:var(--ink);font-size:15px}

/* payoff */
.pf{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 14px 16px}
.pf svg{display:block;width:100%;height:auto}
.pfread{display:flex;align-items:baseline;justify-content:center;gap:9px;margin:4px 0 2px}
.pfread b{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1}
.pfread i{font-size:12.5px;color:var(--ink-soft);font-style:normal}
.pfprice{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.pfmsg{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;background:var(--soft);margin-top:14px}
.pfchal{background:var(--gold-soft);border:2px solid var(--gold);border-radius:14px;padding:15px;margin-top:14px}
.pfchal p{margin:0 0 12px;font-size:13.5px;line-height:1.55;font-weight:600}
@media(max-width:700px){.pfchal .btn.wide{display:block;width:calc(100% - 24px)}}
.crow.tot .amt{white-space:normal;text-align:right}
.pfchal .rtq{font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.4}
.pfchal .rtq small{display:block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold);margin-bottom:4px}
.rtfb{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.58;margin:0 0 12px;animation:slideIn .25s}
.rtfb>b{display:block;margin-bottom:5px}
.rtfb p{margin:0 0 8px}.rtfb p:last-child{margin:0}
.rtfb p b{font-weight:700}
.rtfb.ok{background:var(--gain-soft)}.rtfb.ok>b{color:var(--gain)}
.rtfb.no{background:var(--loss-soft)}.rtfb.no>b{color:var(--loss)}
.c3ef{text-align:center;font-size:13px;color:var(--ink-soft);margin:4px 0 0;line-height:1.5;font-variant-numeric:tabular-nums}
.c3ef b{color:var(--ink);font-size:14px}
.c3ef small{font-size:11px}

/* sandbox */
.sbdata{background:var(--surface);border:2px solid var(--line);border-radius:15px;padding:6px 15px;margin-bottom:14px}
.sbrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;font-size:13px;border-bottom:1px solid var(--line)}
.sbrow:last-child{border-bottom:none}
.sbrow span{color:var(--ink-soft)}
.sbrow b{font-family:var(--serif);font-size:14px;text-align:right}
.sbbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
@media(max-width:420px){.sbb{padding:12px 4px}.sbb span{font-size:12px;text-align:center}}
.sbb{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;padding:16px 8px;font-size:22px;color:inherit;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.15s}
.sbb span{font-size:12.5px;font-weight:600}
.sbb.call:hover{border-color:var(--gain);color:var(--gain)}
.sbb.put:hover{border-color:var(--loss);color:var(--loss)}
.sbb.none:hover{border-color:var(--gold);color:var(--gold)}
.sbwarn{font-size:11px;color:var(--ink-soft);text-align:center;margin:14px 0 0;line-height:1.5}
.sbwarn.sblife{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:12px}
.sbreveal{background:var(--ink);color:var(--bg);border-radius:15px;padding:16px;text-align:center;margin-bottom:12px;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.sbreveal span{display:block;font-size:11.5px;opacity:.75;margin-bottom:4px}
.sbreveal b{font-family:var(--serif);font-size:30px;font-weight:700}
.sbresults{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:420px){.sbresults{grid-template-columns:1fr}}
.sbres{border:2px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center;background:var(--surface)}
.sbres .ttl{font-size:10.5px;color:var(--ink-soft);margin-bottom:6px;line-height:1.3;font-weight:600}
.sbres .st{font-family:var(--serif);font-size:19px;font-weight:700}
.sbres.up .st{color:var(--gain)}.sbres.dn .st{color:var(--loss)}
.sbres.mine{border-color:var(--ink);border-width:3px}
.sbbasis{font-size:12px;font-weight:600;color:var(--ink-soft);text-align:center;margin:0 0 8px;line-height:1.45;text-wrap:balance}
.sbsold{margin-top:14px;border:2px dashed var(--line);border-radius:16px;padding:13px 12px 12px;background:var(--soft)}
.sbsoldh{margin-bottom:10px}
.sbsoldh b{display:block;font-size:12.5px;font-weight:700;margin-bottom:2px}
.sbsoldh span{display:block;font-size:12px;color:var(--ink-soft);line-height:1.45}
.sbsoldh span b{display:inline;font-size:12px;color:var(--ink);margin:0}
.sbresults.two{grid-template-columns:1fr 1fr}
.sbsold .sbres{background:var(--surface)}
.sbsoldn{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:10px 0 0}
.inf{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;margin:4px 0 24px}
.inf h3{font-size:14px;font-weight:700;margin:0 0 6px}
.inf p{font-size:12.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 10px}
.inf label{font-size:12.5px;font-weight:600}
.inf .namein{margin:6px 0 12px}
.infbtns{display:flex;flex-wrap:wrap;gap:9px}
.infbtns .btn{padding:11px 16px;font-size:14px}
.infmsg{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;min-height:1em}
.linkbtn{background:none;border:none;padding:0;color:var(--gold);font:600 12.5px var(--sans);text-decoration:underline;text-underline-offset:3px}
.pdrop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:16px;padding:22px 16px;background:var(--surface);cursor:pointer;margin-bottom:18px}
.pdrop.over,.pdrop:hover{border-color:var(--gold)}
.pdrop input{position:absolute;opacity:0;width:1px;height:1px}
.pdrop:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.pdrop b{font-size:15px}.pdrop span{font-size:12.5px;color:var(--ink-soft)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pstats div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.pstats b{display:block;font-family:var(--serif);font-size:24px}.pstats span{font-size:11px;color:var(--ink-soft)}
.pwrap{overflow-x:auto;margin-bottom:14px;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
.ptab{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.ptab th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.ptab td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ptab tr:last-child td{border-bottom:none}
.ptab small{color:var(--ink-soft)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--gain-soft);color:var(--gain)}.pill.no{background:var(--loss-soft);color:var(--loss)}
.muted{color:var(--ink-soft)}
.sbsrc{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:10px 0 0}

/* cadena */
.cflow{display:flex;align-items:center;gap:5px;margin-bottom:14px}
.carrow{color:var(--ink-soft);font-size:13px;flex-shrink:0}
.cstep{flex:1;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-soft);transition:.15s}
.cstep .ci{font-size:20px}
.cstep .cn{font-size:10.5px;font-weight:700}
.cstep:hover,.cstep.seen{border-color:var(--gold)}
.cstep.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}

/* glosario */
.gloss{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.gloss h3{font-size:13px;font-weight:700;margin:0 0 3px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gloss h3 em{font-style:normal;font-weight:400;color:var(--ink-soft);font-size:12px}
.gloss .hint{font-size:12px;color:var(--ink-soft);margin:0 0 13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;color:inherit;transition:.15s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#fff}
.chipdef{background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:14px;margin-top:11px;font-size:13.5px;line-height:1.6;animation:slideIn .22s}
.chipdef b{font-family:var(--serif);display:block;margin-bottom:5px;font-size:15px}
.newterms{background:var(--gold-soft);border-radius:13px;padding:13px 15px;margin:0 auto 20px;max-width:34ch;font-size:13px;line-height:1.55}
.newterms b{color:var(--gold)}

.branch3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.hit{cursor:pointer}
.hit:hover line:first-child,.hit:hover polyline:first-child{filter:drop-shadow(0 0 3px var(--gold))}
.chint{font-size:12px;color:var(--ink-soft);text-align:center;margin:6px 0 8px}
.cinfo{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:12px;animation:slideIn .2s}
.cinfo b{display:block;margin-bottom:4px}
.tvaxis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin:6px 0 2px}
.sbrow small{font-weight:400;font-size:11px;color:var(--ink-soft);font-family:var(--sans)}
.sbres .pc{font-size:10.5px;color:var(--ink-soft);margin-top:3px}
/* cuadro de las cuatro posiciones */
.g2{display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;margin-bottom:14px}
.g2.buy{grid-template-rows:auto auto}
.g2 .gh{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:center;letter-spacing:.06em;padding-bottom:2px}
.g2 .gr{font-size:10.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.08em}
.g2c{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:11px 10px;text-align:left;color:inherit;min-height:88px;display:flex;flex-direction:column;gap:5px;transition:.15s}
.g2c b{font-size:13.5px}
.g2c small{font-size:11.5px;color:var(--ink-soft);line-height:1.35}
.g2c svg{width:64px;height:30px;display:block}
.g2c:hover:not(:disabled){border-color:var(--gold)}
.g2c.hit{border-color:var(--gold);background:var(--gold-soft)}
.g2c.seen{border-color:var(--gold)}
.g2c.ok{border-color:var(--gain);background:var(--gain-soft)}
.g2c.no{border-color:var(--loss);background:var(--loss-soft);animation:shake .4s}
.g2c:disabled{cursor:default}
.g2d{background:var(--surface);border:2px solid var(--line);border-radius:15px;padding:15px 16px;min-height:120px}
.g2d h4{font-family:var(--serif);font-size:18px;margin:0 0 10px}
.g2d .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.g2d .kv:last-child{border-bottom:none}
.g2d .kv span{color:var(--ink-soft)}
.g2d .kv b{text-align:right}
.gqs{background:var(--ink);color:var(--bg);border-radius:15px;padding:16px 17px;font-family:var(--serif);font-size:17px;line-height:1.4;margin-bottom:14px}
.gqs small{display:block;font-family:var(--sans);font-size:11px;opacity:.7;margin-bottom:6px;letter-spacing:.05em}
.gqfb{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin-bottom:12px;animation:slideIn .25s}
.gqfb.ok{background:var(--gain-soft)}.gqfb.no{background:var(--loss-soft)}
.gqfb b{display:block;margin-bottom:2px}
/* tarjetas */
.fc{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;min-height:200px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;color:inherit;transition:background .2s,border-color .2s}
.fc .ft{font-family:var(--serif);font-size:30px;font-weight:700}
.fc .fb{font-size:15.5px;line-height:1.6;max-width:36ch}
.fc .fh{font-size:12px;color:var(--ink-soft);margin-top:14px}
.fc.back{border-color:var(--gold);background:var(--gold-soft)}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fcleft{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px}
/* certificado */
.cert{border:3px double var(--gold);border-radius:18px;padding:26px 22px;text-align:center;background:var(--surface);margin-top:6px}
.cert .ck{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.cert h3{font-family:var(--serif);font-size:23px;margin:10px 0 4px}
.cert .cn{font-family:var(--serif);font-size:27px;font-weight:700;margin:16px auto;border-bottom:1px solid var(--line);padding-bottom:10px;min-height:40px;max-width:24ch}
.cert p{font-size:13px;line-height:1.6;color:var(--ink-soft);margin:6px 0}
.namein{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:15px;background:var(--surface);color:var(--ink);margin:8px 0 14px;font-family:inherit}
.score{font-family:var(--serif);font-size:44px;font-weight:700;text-align:center;margin:6px 0}
@media print{body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;left:0;top:0;width:100%}}
.branch3 .br{padding:14px 6px}
.branch3 .br b{font-size:17px}
.hud .nav{background:none;border:none;font-size:23px;line-height:1;color:var(--ink-soft);padding:0 3px;flex-shrink:0}
.hud .nav:disabled{opacity:.22;cursor:default}
.chip.abr{font-family:var(--serif);letter-spacing:.01em}
.q{font-family:var(--serif);font-size:21px;font-weight:560;line-height:1.26;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 15px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;font-size:14.5px;color:inherit;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--gain)}
.opt .key{width:25px;height:25px;flex-shrink:0;border-radius:7px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.opt.right{border-color:var(--gain);background:var(--gain-soft)}
.opt.right .key{background:var(--gain);border-color:var(--gain);color:#fff}
.opt.wrong{border-color:var(--loss);background:var(--loss-soft);animation:shake .4s}
.opt.wrong .key{background:var(--loss);border-color:var(--loss);color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:15px 18px calc(15px + env(safe-area-inset-bottom));z-index:30;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.foot.up{transform:translateY(0)}
.foot{max-height:62vh;overflow-y:auto}
.foot.ok{background:var(--gain-soft);border-top-color:var(--gain)}
.foot.no{background:var(--loss-soft);border-top-color:var(--loss)}
.foot-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.verdict{flex:1;min-width:200px}
.verdict>b{display:block;font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:3px}
.verdict span b{font-weight:700}
.foot.ok .verdict>b{color:var(--gain)}.foot.no .verdict>b{color:var(--loss)}
.verdict span{font-size:13.5px;line-height:1.5}
.btn{background:var(--gain);color:#fff;border:none;border-bottom:4px solid var(--gain-dark);border-radius:13px;padding:13px 28px;font-size:15px;font-weight:700}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.wide{width:100%}
.btn.gold{background:var(--gold);border-bottom-color:var(--gold-dark)}
.btn.ghost{background:none;color:var(--ink-soft);border:2px solid var(--line);border-bottom-width:4px}
.btn:not(.ghost),.mini,.coin,.paper,.tvbar span,.opt.right .key,.opt.wrong .key,.chip.on{color:var(--on-accent)}

.done-wrap{text-align:center;padding:44px 0 0}
.done-wrap .big{font-size:54px;line-height:1;margin-bottom:16px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.done-wrap h2{font-family:var(--serif);font-size:27px;font-weight:560;margin:0 0 10px}
.done-wrap p{color:var(--ink-soft);font-size:15px;margin:0 auto 28px;max-width:40ch;line-height:1.6}
.tally{display:flex;gap:11px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
.tally div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 20px;min-width:92px}
.tally b{display:block;font-family:var(--serif);font-size:23px;font-weight:700;color:var(--gain)}
.tally span{font-size:12px;color:var(--ink-soft)}

/* ===== guía «No lo entiendo»: explicaciones preparadas, sin IA generativa ===== */
[hidden]{display:none!important}
:root{--tip-bg:#1B2A22;--tip-ink:#F4F6F9;--tip-acc:#E2B65E;--tip-line:rgba(245,241,230,.3);--shade:rgba(15,24,20,.58)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tip-bg:#ECE6D6;--tip-ink:#14201A;--tip-acc:#7A5410;--tip-line:rgba(20,32,26,.28);--shade:rgba(0,0,0,.64)}}
:root[data-theme="dark"]{--tip-bg:#ECE6D6;--tip-ink:#14201A;--tip-acc:#7A5410;--tip-line:rgba(20,32,26,.28);--shade:rgba(0,0,0,.64)}
.gBtn{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border:none;border-radius:99px;padding:7px 15px 7px 7px;box-shadow:0 4px 16px rgba(0,0,0,.22);font:600 13.5px var(--sans);transition:bottom .28s cubic-bezier(.2,.9,.3,1),transform .12s}
.gBtn:active{transform:scale(.96)}
.gBtn .gq{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font:700 17px var(--serif)}
@media(max-width:350px){.gBtn .gl{display:none}.gBtn{padding:7px}}
.gBtn.gMini{padding:7px;right:6px}.gBtn.gMini .gl{display:none}
#gLay{position:fixed;inset:0;z-index:70;pointer-events:none}
#gLay .gBlk,#gLay .gDim,#gLay .gTip,#gLay .gMk{pointer-events:auto}
.gBlk{position:fixed;left:0;top:0;width:0;height:0;background:transparent}
.gDim{position:fixed;inset:0;background:var(--shade)}
.gHole{position:fixed;border:3px solid var(--gold);border-radius:12px;box-shadow:0 0 0 200vmax var(--shade);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
.gMk{position:fixed;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;border:2px solid var(--surface);font:700 11.5px/1 var(--sans);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.gMk.on{background:var(--tip-bg);color:var(--tip-ink);border-color:var(--gold);transform:scale(1.18)}
.gTip{position:fixed;background:var(--tip-bg);color:var(--tip-ink);border-radius:15px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.32);font-size:14px;line-height:1.55;z-index:2}
.gTip::before{content:'';position:absolute;left:var(--ax,50%);transform:translateX(-50%);border:9px solid transparent}
.gTip.below::before{top:-18px;border-bottom-color:var(--tip-bg)}
.gTip.above::before{bottom:-18px;border-top-color:var(--tip-bg)}
.gTip.mid::before{display:none}
.gTip .gC{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--tip-acc);margin-bottom:3px;text-transform:uppercase}
.gTip .gT{display:block;font-family:var(--serif);font-size:16.5px;font-weight:700;line-height:1.3;margin:0 28px 6px 0;text-wrap:balance}
.gTip .gTxt{display:block}
.gTip .gAq{display:block;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--tip-acc)}
.gTip .gTx{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--tip-ink);opacity:.75;font-size:22px;line-height:1;padding:4px 6px}
.gNav{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px;flex-wrap:wrap}
.gB1{background:var(--tip-acc);color:var(--tip-bg);border:none;border-radius:10px;padding:9px 15px;font:700 13.5px var(--sans)}
.gB2{background:transparent;color:var(--tip-ink);border:1.5px solid var(--tip-line);border-radius:10px;padding:8px 12px;font:600 13px var(--sans)}
.gNav .gB2.gFirst{margin-right:auto}
.gTip button:focus-visible,.gMk:focus-visible,.gBtn:focus-visible{outline:2px solid var(--tip-acc);outline-offset:2px}
.gShade{position:fixed;inset:0;z-index:79;background:var(--shade)}
.gSheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:84vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.9,.3,1),visibility 0s .26s}
.gSheet.up{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.9,.3,1)}
.gIn{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.gHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gEy{margin:0 0 2px;font-size:11.5px;font-weight:700;color:var(--gold);letter-spacing:.04em}
.gTi{margin:0;font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.2;text-wrap:balance}
.gX{background:none;border:none;font-size:28px;line-height:1;color:var(--ink-soft);padding:0 4px}
.gSub{margin:4px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.gChips{display:flex;flex-wrap:wrap;gap:7px}
.gChips .chip{text-align:left;line-height:1.35}
.gForm{display:flex;flex-direction:column;gap:6px;margin:0}
.gRow{display:flex;gap:8px}
.gRow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font:15px var(--sans);background:var(--bg);color:var(--ink)}
.gRow input:focus{outline:2px solid var(--gold);outline-offset:1px}
.gRow .btn{padding:11px 16px;font-size:14px}
.gIn .btn.wide{font-size:14.5px}
.gCard{background:var(--gold-soft);border-radius:14px;padding:14px 15px;font-size:14px;line-height:1.6;animation:slideIn .22s}
.gCard b{display:block;font-family:var(--serif);font-size:16px;margin-bottom:4px}
.gCard p{margin:0}
.gCard .btn{margin-top:10px;padding:10px 14px;font-size:13.5px}
.gMeta{font-size:12px;color:var(--ink-soft);margin:8px 0 0!important}
.gNote{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:2px 0 0}
.gPre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px;max-height:160px;overflow:auto}

/* ===== Portada por secciones (v29): ruta de lecciones por unidades y barra de secciones abajo ===== */
.home-head .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.home-head h1{text-wrap:balance}
.prog{display:flex;align-items:center;gap:12px;margin:18px 0 26px}
.prog .ring{margin:0;flex:1}
.prog span{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.unit{margin-bottom:34px}
.unit-band{display:flex;align-items:center;gap:14px;border-radius:18px;padding:15px 16px;background:var(--gain);color:var(--on-accent);box-shadow:0 4px 0 var(--gain-dark)}
.unit.u-locked .unit-band{background:var(--soft);color:var(--ink-soft);box-shadow:0 4px 0 var(--line)}
.unit.u-done .unit-band{background:var(--gold);box-shadow:0 4px 0 var(--gold-dark)}
.ub-txt{flex:1;min-width:0}
.ub-k{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:3px}
.unit-band h2{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.unit-band p{font-size:12.5px;line-height:1.45;margin:0;opacity:.92}
.ub-n{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1;opacity:.55;flex:none}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:24px}
.prow{display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--k) * min(78px,19vw)));width:150px;max-width:100%}
.pnode{position:relative;width:68px;height:68px;border-radius:50%;border:none;padding:0;display:flex;align-items:center;justify-content:center;font:700 24px var(--serif);background:var(--soft);color:var(--ink-soft);box-shadow:0 5px 0 var(--line);transition:transform .12s,box-shadow .12s}
.pnode svg{width:24px;height:24px}
.pnode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.pnode.next{background:var(--gain);color:var(--on-accent);box-shadow:0 5px 0 var(--gain-dark)}
.pnode.next:active{box-shadow:0 1px 0 var(--gain-dark)}
.pnode.open{background:var(--surface);color:var(--gain);box-shadow:0 5px 0 var(--gain-soft);outline:2px solid var(--gain);outline-offset:-2px}
.pnode.done{background:var(--gold);color:var(--on-accent);box-shadow:0 5px 0 var(--gold-dark)}
.pnode.done:active{box-shadow:0 1px 0 var(--gold-dark)}
.pnode.next::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--gain);opacity:.3;animation:pulse 2s ease-in-out infinite}
.pnode.sel{transform:translateY(2px)}
.plabel{font-size:12.5px;font-weight:600;line-height:1.3;text-align:center;margin:12px 0 10px;max-width:16ch;text-wrap:balance}
.prow.locked .plabel{color:var(--ink-soft);font-weight:500}
.ptag{position:relative;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gain);background:var(--surface);border:2px solid var(--gain);border-radius:10px;padding:4px 10px;margin-bottom:12px;animation:bob 2.4s ease-in-out infinite}
.ptag::after{content:'';position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--gain);border-bottom:2px solid var(--gain);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pop{position:relative;width:100%;background:var(--surface);border:2px solid var(--gain);border-radius:18px;padding:16px 16px 14px;margin:6px 0 14px;animation:slideIn .22s;text-align:left}
.pop::before{content:'';position:absolute;top:-9px;left:calc(50% + var(--k) * min(78px,19vw) - 8px);width:14px;height:14px;background:var(--surface);border-left:2px solid var(--gain);border-top:2px solid var(--gain);transform:rotate(45deg)}
.pop.locked,.pop.locked::before{border-color:var(--line)}
.pop.done,.pop.done::before{border-color:var(--gold)}
.pop-k{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;font-variant-numeric:tabular-nums}
.pop h3{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2;margin:0 0 10px;text-wrap:balance}
.pop-l{font-size:12.5px;font-weight:700;margin:0 0 6px}
.pop ul{margin:0 0 14px;padding:0 0 0 18px;display:flex;flex-direction:column;gap:5px}
.pop li{font-size:13.5px;line-height:1.5}
.pop li::marker{color:var(--gain)}
.pop.done li::marker{color:var(--gold)}
.pop-note{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5}
.pop .btn{width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 1px 5px;color:var(--ink-soft);font:600 11px var(--sans);min-width:0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gain);background:var(--gain-soft);border-color:var(--gain-soft)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h1{font-family:var(--serif);font-size:26px;font-weight:560;margin:0;line-height:1.15}
.sec-count{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sec-hint{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:6px 0 16px;max-width:52ch}
.search{width:100%;font:500 15px var(--sans);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 22px}
.search:focus{outline:none;border-color:var(--gold)}
.gl-unit{margin-bottom:26px}
.gl-unit>h2{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
.gl-les{margin-bottom:14px}
.gl-les>h3{font-size:13.5px;font-weight:700;margin:0 0 8px}
.terms{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.term-item+.term-item{border-top:1px solid var(--line)}
.term{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:none;color:inherit;text-align:left;padding:13px 15px;font:600 14.5px var(--sans)}
.term svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--ink-soft);stroke-width:2;transition:transform .2s}
.term[aria-expanded="true"] svg{transform:rotate(180deg)}
.term-def{font-size:13.5px;line-height:1.6;color:var(--ink-soft);padding:0 15px 14px;margin:0}
.gl-lock{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft);background:var(--soft);border-radius:14px;padding:11px 14px}
.gl-lock svg,.pnode .lk{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.noresults{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px}
.ab-list{margin:0;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.ab-row{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:13px 15px}
.ab-row+.ab-row{border-top:1px solid var(--line)}
.ab-row dt{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold)}
.ab-row dd{margin:0;font-size:13.5px;line-height:1.55;min-width:0}
@media(max-width:380px){.ab-row{grid-template-columns:1fr;gap:3px}}
.me-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 22px}
.me-stats div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.me-stats b{display:block;font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.me-stats span{font-size:11.5px;color:var(--ink-soft)}
.me-units{display:flex;flex-direction:column;gap:10px;margin:0 0 24px}
.me-u{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.me-u b{font-size:13.5px;font-weight:600;min-width:0}
.me-u span{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.me-u .ring{grid-column:1/-1;margin:0;height:6px}
.me-h{font-size:14px;font-weight:700;margin:0 0 10px}
.me-cert{background:var(--gold-soft);border-radius:16px;padding:14px 16px;margin:0 0 24px;font-size:13.5px;line-height:1.55}
.me-cert b{display:block;font-family:var(--serif);font-size:16px;margin-bottom:3px}
.me-cert .btn{margin-top:10px}

/* ===== Lección 1 · tres casos en visual (v30) ===== */
.trio-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.trio-tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:9px 4px 8px;color:inherit;font:600 12.5px var(--sans)}
.trio-tab .ic{font-size:22px;line-height:1.1}
.trio-tab.on{border-color:var(--gain);background:var(--gain-soft);color:var(--gain-dark)}
.trio-tab .ok{position:absolute;top:5px;right:7px;font-size:11px;color:var(--gain)}
.trio{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 14px 14px}
.tq-teme{font-size:14px;line-height:1.5;margin:0 0 12px;font-weight:500}
.tq-deal{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 6px}
.tq-deal div{background:var(--soft);border-radius:12px;padding:9px 6px 8px;text-align:center;min-width:0}
.tq-deal small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.tq-deal b{display:block;font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.tq-deal span{display:block;font-size:11px;line-height:1.3;color:var(--ink-soft)}
.tq-deal .pr b{color:var(--gold)}
.tq-deal .dr{background:var(--gain-soft)}.tq-deal .dr b{color:var(--gain)}
.tq-arrows{display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;color:var(--ink-soft);text-align:center;margin:0 0 14px}
.tq-sl{margin:4px 0 2px}
.tq-sl label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.tq-sl label b{font-family:var(--serif);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.tq-sl input{margin:6px 0 8px}
.tq-pre{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tq-pre button{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:6px 11px;font:600 12px var(--sans);color:inherit}
.tq-pre button.on{border-color:var(--gold);background:var(--gold-soft)}
.tq-chart{display:block;width:100%;height:auto}
.tq-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:11.5px;color:var(--ink-soft);margin:2px 0 12px}
.tq-leg i{display:inline-block;width:20px;height:0;border-top:2px dashed var(--gain);vertical-align:middle;margin-right:6px}
.tq-leg i.hoy{border-top:2px dotted var(--gold)}
.tq-eq{display:flex;flex-direction:column;gap:7px;margin:0 0 12px}
.tq-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:2px solid var(--line);border-radius:13px;padding:9px 11px}
.tq-row.on{border-color:var(--gain)}
.tq-row small{grid-column:1/-1;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.tq-row.on small{color:var(--gain)}
.tq-f{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12.5px;line-height:1.35;min-width:0}
.tq-f i{font-style:normal;background:var(--soft);border-radius:8px;padding:4px 7px}
.tq-f i.pr{background:var(--gold-soft)}
.tq-f em{font-style:normal;font-weight:700;color:var(--ink-soft)}
.tq-row>b{font-family:var(--serif);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tq-sum{background:var(--gain-soft);border-radius:13px;padding:11px 13px;font-size:13.5px;line-height:1.5;margin:0}
.tq-sum b{color:var(--gain)}
.tq-nota{font-size:12px;line-height:1.5;color:var(--ink-soft);margin:10px 0 0}

/* ===== Lección 1 · construcción paso a paso (v31) ===== */
.tq-g{padding:14px 14px 14px}
.tq-steps{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tq-steps .pp{flex:1;display:flex;gap:4px}
.tq-steps .pp i{flex:1;height:4px;border-radius:99px;background:var(--soft)}
.tq-steps .pp i.on{background:var(--gold)}
.tq-cap{font-size:14.5px;line-height:1.55;margin:0 0 12px;min-height:6.2em}
.tq-cap b{color:var(--ink)}
.tq-nav{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:12px}
.tq-nav .btn{padding:12px 18px}
.tq-nav .btn:disabled{opacity:.4}
.tq-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 8px}
.tq-strip div{background:var(--soft);border-radius:10px;padding:6px 4px;text-align:center}
.tq-strip small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.tq-strip b{font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums}
.tq-strip .pr b{color:var(--gold)}.tq-strip .dr{background:var(--gain-soft)}.tq-strip .dr b{color:var(--gain)}
.tq-new{animation:tqIn .45s ease-out}
@keyframes tqIn{from{opacity:0}to{opacity:1}}
.tq-mv{transition:transform .65s cubic-bezier(.3,.8,.3,1)}
.tq-late{animation:tqIn .3s .6s both}
.tq-prima{display:flex;flex-direction:column;gap:12px;padding:6px 0 4px}
.tq-tl{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tq-tl::before{content:'';position:absolute;left:22%;right:22%;top:21px;height:6px;border-radius:99px;background:var(--gain-soft)}
.tq-tl .nd{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.tq-tl .nd small{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.tq-tl .coin{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:700 13px var(--sans);box-shadow:0 3px 0 var(--gold-dark)}
.tq-tl .dot{width:36px;height:36px;border-radius:50%;background:var(--surface);border:3px solid var(--gain);display:flex;align-items:center;justify-content:center;color:var(--gain);font-weight:700}
.tq-tl .nd span{font-size:12.5px;line-height:1.4}
.tq-band{text-align:center;font-size:12px;font-weight:600;color:var(--gain-dark);background:var(--gain-soft);border-radius:10px;padding:7px 10px}
.tq-out{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tq-out div{border:2px solid var(--line);border-radius:12px;padding:9px 10px;font-size:12.5px;line-height:1.4;text-align:center}
.tq-out b{display:block;font-size:13px;margin-bottom:2px}
.tq-out em{font-style:normal;color:var(--gold);font-weight:700}
.tq-cambia{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin:0 0 12px}

/* ===== Práctica con datos reales (v33: bróker, cartera y veredicto) ===== */
.pr .pos{color:var(--gain)}.pr .neg{color:var(--loss)}

.pr-list{display:flex;flex-direction:column;gap:10px;margin:0 0 6px}

.pill{background:var(--soft);color:var(--ink-soft)}

.brk-px span{font-size:10.5px;color:var(--ink-soft)}

.brk-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 10px}

.brk-seg button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ch-ask .ch-tot{display:block;font-size:9.5px;font-weight:600;opacity:.78;margin-top:1px;white-space:nowrap}
.ch-head,.ch-row{display:grid;grid-template-columns:1.05fr .95fr 1.2fr;gap:8px;align-items:center}
.ch-head{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);padding:0 8px 6px}

.ch-list{display:flex;flex-direction:column;gap:2px}
.ch-row{padding:7px 8px;border-radius:12px}
.ch-row.itm{background:var(--soft)}
.ch-row.on{box-shadow:inset 0 0 0 2px var(--ink)}
.ch-k b{display:block;font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums}

.ch-bid{position:relative;display:flex;flex-direction:column;align-items:center;color:var(--ink-soft);opacity:.9;cursor:not-allowed;font-variant-numeric:tabular-nums}
.ch-bid small{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ch-bid span{font-size:13.5px;font-weight:600}

.ch-ask{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface);border:2px solid var(--ink);border-bottom-width:4px;border-radius:12px;padding:6px 6px 5px;color:var(--ink);font-variant-numeric:tabular-nums;transition:transform .1s}

.ch-row.on .ch-ask{background:var(--ink);color:var(--bg)}
.ch-spot{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:11px;font-weight:700;color:var(--gold)}
.ch-spot::before,.ch-spot::after{content:'';flex:1;border-top:2px dashed var(--gold);opacity:.7}
.ch-spot span{background:var(--gold-soft);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}
.pr-note{font-size:11.5px;line-height:1.5;color:var(--ink-soft);margin:8px 0 0}
.pr-none{width:100%;margin:2px 0 0;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:13px;padding:12px;font:600 14px var(--sans);color:inherit}
.pr-none:hover{border-color:var(--ink-soft)}
.tk{background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:14px;margin:0;animation:slideIn .22s}
.tk-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px}
.tk-h span{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.tk-x{background:none;border:none;font-size:22px;line-height:1;color:var(--ink-soft);padding:0 4px}
.tk-t{display:block;font-size:15.5px;margin:0 0 8px}
.tk-p{font-size:13.5px;line-height:1.55;margin:0 0 10px}
.tk-dl{margin:0 0 12px}
.tk-dl>div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.tk-dl dt{font-size:12px;color:var(--ink-soft)}
.tk-dl dd{margin:0;text-align:right;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.tk-dl dd small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-soft)}
.tk-dl .tot{border-bottom:none}
.tk-dl .tot dt{font-weight:700;color:var(--ink);font-size:13px}
.tk-dl .tot dd{font-family:var(--serif);font-size:21px}
.qty{display:inline-flex;align-items:center;gap:6px;margin-right:4px}
.qty button{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--soft);color:var(--ink-soft);font:700 14px/1 var(--sans);padding:0;opacity:.6}
.rv-l{margin:0 0 12px;padding:0 0 0 18px;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.5}
.rv-b{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.rv-b .btn{padding:12px 10px;font-size:14px}
.pr-hint{background:var(--gold-soft);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.55;margin:4px 0 0}
.pr-toast{background:var(--soft);border-left:4px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;margin:4px 0 12px}
.pr-toast::before{content:'✓ ';font-weight:800}
.pr-chart{display:block;width:100%;height:auto;margin:0 0 4px}
.tq-leg i.stk{border-top:2px dashed var(--ink-soft)}
.tq-leg i.be{width:9px;height:9px;border:1.5px solid var(--ink);border-radius:50%;background:var(--surface)}
.pfb{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;margin:14px 0}
.pfb-h b{display:block;font-family:var(--serif);font-size:17px}
.pfb-h span{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px}
.pf-tog{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin:10px 0 0}
.pf-tog button{border:none;background:none;border-radius:9px;padding:9px 6px;min-height:40px;font:600 12.5px var(--sans);color:var(--ink-soft)}
.pf-tog button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pfb-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 6px;text-align:center}
@media(max-width:420px){.pfb-k{grid-template-columns:1fr 1fr}}
.pfb-k div{background:var(--soft);border-radius:10px;padding:7px 4px}
.pfb-k span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.pfb-k b{display:block;margin-top:3px;font-size:14px;font-variant-numeric:tabular-nums}
.pfb-k b.neg{color:var(--loss)}.pfb-k b.pos{color:var(--gain)}
.pfb-svg{display:block;width:100%;height:auto;margin:4px 0}
.pfb-r{text-align:center;font-size:13px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.pfb-r b.pos{color:var(--gain)}.pfb-r b.neg{color:var(--loss)}
.pfb input[type=range]{margin:2px 0 8px}
.pr-news{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px}
.pr-news p{display:flex;gap:9px;align-items:flex-start;margin:0;font-size:12.5px;line-height:1.45}
.pr-news i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--on-accent);font:700 10px/18px var(--sans);text-align:center;font-style:normal}
.ct{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px}
.ct h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px}
.ct-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.ct-r span{font-size:13px;min-width:0}
.ct-r small{display:block;font-size:11px;color:var(--ink-soft);line-height:1.4}
.ct-r b{font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ct-tot .ct-r{border-bottom:none;padding-top:9px}
.ct-tot .ct-r span{font-weight:700}
.ct-tot .ct-r b{font-size:21px}
.pr-adv{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.pr-adv.two{grid-template-columns:1fr 1.4fr;margin-top:18px}
.pr-adv .btn{padding:12px 8px;font-size:14px}
.vd{display:flex;align-items:center;gap:13px;border:2px solid var(--line);border-radius:18px;padding:15px 16px;margin:4px 0 10px}
.vd.ok{background:var(--gain-soft);border-color:var(--gain)}
.vd.no{background:var(--loss-soft);border-color:var(--loss)}
.vd-ic{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 24px var(--sans);color:var(--on-accent)}
.vd.ok .vd-ic{background:var(--gain)}.vd.no .vd-ic{background:var(--loss)}
.vd small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.vd.ok small{color:var(--gain)}.vd.no small{color:var(--loss)}
.vd b{font-family:var(--serif);font-size:21px;line-height:1.2}
.vd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.vd-grid>div{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.vd-grid .full{grid-column:1/-1}
.vd-grid small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}
.vd-grid b{display:block;font-family:var(--serif);font-size:17px;line-height:1.25;font-variant-numeric:tabular-nums}
.vd-grid span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.vd-p{font-size:13.5px;line-height:1.58;margin:0 0 8px}
.pr-mejor{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:12.5px;margin:10px 0 16px}
.pr-mejor b{color:var(--ink)}
.pr-h{font-size:14px;font-weight:700;margin:18px 0 8px}
.pr-tab{font-size:12.5px}.pr-tab th,.pr-tab td{padding:8px 7px}.pr-tab th small{display:block;font-weight:500;text-transform:none}
.pr-tab td small{display:block;font-size:10.5px;color:var(--ink-soft)}.pr-tab .pr-ok{text-align:center}
.pr-tab tr.okr td:first-child{box-shadow:inset 4px 0 0 var(--gain)}
.pr-tab tr.me td{background:var(--gold-soft)}
.pr-tab td.pos,.pr-tab td.neg{font-weight:700}
.pr-after{font-size:13.5px;line-height:1.6;margin:12px 0 0}
.pr-src{margin-top:14px;font-size:11.5px;line-height:1.5;color:var(--ink-soft)}
.pr-src b{display:block;color:var(--ink);font-size:12px;margin-bottom:4px}
.pr-src p{margin:0 0 4px}

/* ===== v33: lectura por partes, zonas del gráfico y barra plegable ===== */
.case p{margin:0}
.case p+p{margin-top:10px}
.case p.cnew{animation:tqIn .4s ease-out}
.crb{margin-top:12px;display:flex;justify-content:center;align-items:baseline;gap:8px}
.crb small{font-size:12px;font-weight:600;color:var(--ink-soft)}
.pfz{display:flex;flex-direction:column;gap:5px;background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.pfz p{margin:0 0 2px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.pfz span{font-size:12.5px;line-height:1.4;color:var(--ink-soft)}
.pfz span.on{color:var(--ink);font-weight:600}
.fbt{display:flex;align-items:center;gap:12px;margin-left:auto}
.fmin{background:none;border:none;color:var(--ink-soft);font:600 12.5px var(--sans);text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.fmt{display:none;font-style:normal;font-size:13px;color:var(--ink-soft)}
.foot.min .verdict>span{display:none}
.foot.min .fmt{display:block}
.foot.min .verdict>b{margin-bottom:0}

.st-card .tq-steps{margin-bottom:12px}
.st-stage{position:relative;border-radius:14px;overflow:hidden;background:var(--st-sky);margin:0 0 14px;box-shadow:inset 0 0 0 1px var(--line)}
.st-stage svg{display:block;width:100%;height:auto}
.st-txt{min-height:var(--st-mh,0px)}
.st-txt.chg{animation:stIn .3s ease-out}
@keyframes stIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.st-h{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.22;margin:0 0 7px;text-wrap:balance}
.st-p{font-size:15px;line-height:1.62;margin:0;max-width:52ch}
.st-note{font-size:12px;color:var(--ink-soft);margin:9px 0 0}
.st-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.st-card .tq-nav{margin-top:16px}
.hud .st-skip{flex:none;background:none;border:2px solid var(--line);border-radius:99px;padding:6px 13px;min-height:36px;font:600 12.5px var(--sans);color:var(--ink-soft)}
.hud .st-skip:hover{border-color:var(--gold);color:var(--ink)}
.hud .st-hl{flex:1;font-size:12.5px;font-weight:600;color:var(--ink-soft);text-align:center}

/* escenario (SVG): cielo, paisaje y momento del día */
.st-svg text{font-family:var(--sans)}
.st-svg .sk{transition:opacity .9s ease}
.st-svg .sk-day{fill:var(--st-sky)}
.st-svg .sk-dawn{fill:var(--st-dawn);opacity:0}
.st-svg .sk-night{fill:var(--st-night);opacity:0}
.st-svg[data-time="dawn"] .sk-dawn,.st-svg[data-time="night"] .sk-night{opacity:1}
.st-svg .sun{transition:transform 1s cubic-bezier(.3,.7,.3,1),opacity .7s}
.st-svg .sun-h{fill:var(--st-sun);opacity:.22}
.st-svg .sun-c{fill:var(--st-sun)}
.st-svg[data-time="dawn"] .sun{transform:translateY(46px)}
.st-svg[data-time="night"] .sun{opacity:0;transform:translateY(60px)}
.st-svg.cta-on .sun{opacity:0}
.st-svg .moon{fill:var(--st-moon);opacity:0;transition:opacity .9s}
.st-svg .stars{fill:var(--st-star);opacity:0;transition:opacity .9s}
.st-svg[data-time="night"] .moon,.st-svg[data-time="night"] .stars{opacity:1}

/* =====================================================================
   v37 · 9-nov-2026 · versión para sacar de Claude
   Señal única de «se puede tocar», práctica con Tabla/Gráfica, bienvenida,
   prueba inicial, mascotas griegas, celebraciones, logros y ajustes.
   ===================================================================== */
:root{--tap-bg:var(--gold-soft);--tap-fg:var(--gold-dark);--tap-ring:rgba(138,98,20,.38)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tap-fg:var(--gold);--tap-ring:rgba(216,174,95,.4)}}
:root[data-theme="dark"]{--tap-fg:var(--gold);--tap-ring:rgba(216,174,95,.4)}
@media (prefers-reduced-motion:reduce){*{animation-delay:0s!important;animation-iteration-count:1!important}}
:root[data-mov="off"] *{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
body[data-v="welcome"] #gBtn,body[data-v="pre"] #gBtn{display:none!important}
#app.vin{animation:vIn .2s ease-out}
@keyframes vIn{from{opacity:0}to{opacity:1}}

/* ---------- 1. Todo lo que abre más información lleva el mismo distintivo ---------- */
.anat .ln::after,.br::after,.zn::after,.flip::after,.g2c[onclick^="g2Pick"]::after,.cstep::after,.pr-card::after{
 content:'+';display:grid;place-items:center;width:24px;height:24px;border-radius:50%;flex:none;
 background:var(--tap-bg);color:var(--tap-fg);font:800 16px/1 var(--sans);
 box-shadow:0 0 0 1.5px var(--tap-ring);pointer-events:none;animation:tapPing 2.8s ease-out infinite}
@keyframes tapPing{0%{box-shadow:0 0 0 1.5px var(--tap-ring),0 0 0 0 var(--tap-ring)}70%{box-shadow:0 0 0 1.5px var(--tap-ring),0 0 0 7px transparent}100%{box-shadow:0 0 0 1.5px var(--tap-ring),0 0 0 0 transparent}}
.anat .ln.on::after,.br.sel::after,.zn.on::after,.flip.a::after,.flip.b::after,.g2c.hit::after,.g2c.seen::after,.cstep.on::after,.cstep.seen::after{
 content:'✓';background:var(--gold);color:var(--on-accent);font-size:13px;animation:none}
.anat .ln{cursor:pointer;border-color:var(--line)!important;border-style:dashed!important}
.anat .ln.on{border-style:solid!important;border-color:var(--gold)!important}
.anat .ln .v{margin-left:auto;text-align:right}
.br,.zn,.flip,.g2c,.cstep,.pr-card{position:relative}
.br::after,.flip::after,.g2c[onclick^="g2Pick"]::after{position:absolute;top:8px;right:8px}
.zn{padding-right:46px}.zn::after{position:absolute;top:13px;right:12px}
.cstep::after{position:absolute;top:-7px;right:-7px;width:20px;height:20px;font-size:14px}
.cstep.on::after,.cstep.seen::after{font-size:11px}
.pr-card{padding-right:50px}
.pr-card::after{content:'›';position:absolute;right:13px;top:50%;margin-top:-12px;font-size:20px;animation:none}
.sc .chev{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tap-bg);color:var(--tap-fg);font:800 16px/1 var(--sans);box-shadow:0 0 0 1.5px var(--tap-ring);flex:none}
.sc.open .chev{background:var(--gold);color:var(--on-accent)}
.tl-node .dot{display:grid;place-items:center}
.tl-node:not(.seen):not(.on) .dot{border-color:var(--gold);background:var(--tap-bg);animation:tapPing 2.8s ease-out infinite}
.tl-node:not(.seen):not(.on) .dot::after{content:'+';font:800 13px/1 var(--sans);color:var(--tap-fg)}
.tl-node .yr{text-decoration:underline dotted;text-underline-offset:3px}
.cmo.hot:not(.sel){animation:tapPing 2.8s ease-out infinite;box-shadow:0 0 0 1.5px var(--tap-ring)}
.fc .fh::before{content:'↻ ';font-weight:800;color:var(--tap-fg)}
.fc:not(.back) .fh{color:var(--tap-fg);font-weight:600}
.flip .hint{color:var(--tap-fg);font-weight:600}
.term svg{background:var(--tap-bg);border-radius:50%;padding:3px;width:22px!important;height:22px!important;stroke:var(--tap-fg)!important}
@media (hover:hover){
 .anat .ln:hover,.br:hover,.zn:hover,.flip:hover,.g2c[onclick^="g2Pick"]:hover,.cstep:hover,.pr-card:hover,.sc:hover,.choice:hover:not(:disabled),.opt:hover:not(:disabled){transform:translateY(-1px)}
}

/* frases «Toca…»: una mano que toca */

@keyframes tapHand{0%,60%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(2px) scale(.92)}}

@keyframes gkBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}

@keyframes gkHop{0%,100%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-16%) scale(.95,1.06)}65%{transform:translateY(0) scale(1.07,.93)}}

@keyframes gkSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

.gcheer{position:fixed;left:max(12px,calc(50% - 300px));width:70px;height:78px;z-index:31;pointer-events:none;animation:gcIn 1.9s cubic-bezier(.2,1.2,.4,1) forwards}
.gcheer .gk{width:100%;height:100%}
@keyframes gcIn{0%{transform:translateY(80px) scale(.4) rotate(-12deg);opacity:0}16%{transform:translateY(0) scale(1.1) rotate(4deg);opacity:1}26%{transform:translateY(0) scale(1) rotate(0)}84%{transform:translateY(0);opacity:1}100%{transform:translateY(70px) scale(.6);opacity:0}}
.gcheer i{position:absolute;width:12px;height:12px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk .9s ease-out both}
.gcheer i:nth-of-type(1){left:-10px;top:4px;animation-delay:.25s}
.gcheer i:nth-of-type(2){right:-12px;top:-4px;animation-delay:.38s;background:var(--gain)}
.gcheer i:nth-of-type(3){right:-16px;top:34px;animation-delay:.5s}
.gcheer i:nth-of-type(4){left:-14px;top:40px;animation-delay:.62s;background:var(--gain)}
@keyframes spk{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.3) rotate(45deg)}100%{transform:scale(0) rotate(90deg)}}
.gpeek{position:fixed;left:max(10px,calc(50% - 300px));width:62px;height:70px;z-index:29;pointer-events:none;animation:gpk 2.7s ease-in-out forwards}
.gpeek .gk{width:100%;height:100%}
@keyframes gpk{0%{transform:translateY(95px)}22%,74%{transform:translateY(0)}100%{transform:translateY(95px)}}
.confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* portada: la mascota de cada unidad se asoma */
.unit-band{position:relative;overflow:hidden}
.ub-gk{flex:none;width:52px;height:58px;align-self:flex-end;margin:0 -2px -18px 0;animation:ubPeek 9s ease-in-out infinite;animation-delay:var(--pd,0s)}
.ub-gk .gk{width:100%;height:100%}
@keyframes ubPeek{0%,100%{transform:translateY(0)}8%{transform:translateY(-8px) rotate(-4deg)}14%{transform:translateY(0)}55%,72%{transform:translateY(64px)}80%{transform:translateY(-6px)}86%{transform:translateY(0)}}
.unit.u-locked .ub-gk{animation:none;filter:grayscale(1);opacity:.5}
.home-metrics{gap:8px}

/* ---------- 4. Bienvenida y prueba inicial ---------- */
.wl{min-height:calc(100vh - 32px);min-height:calc(100dvh - 32px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px 0 34px}

.wl-stage .gk .gk-all{transform-box:fill-box;transform-origin:50% 100%;animation:gkIdle 2.4s ease-in-out infinite;animation-delay:calc(var(--d) + .9s)}
@keyframes wlDrop{0%{transform:translateY(-150px) scale(.6);opacity:0}60%{transform:translateY(6px) scale(1.07,.9);opacity:1}100%{transform:none;opacity:1}}
@keyframes gkIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.wl .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;animation:wlUp .5s ease-out .55s both}
.wl h1{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.08;margin:0 auto 12px;max-width:16ch;animation:wlUp .55s ease-out .65s both}

/* ---------- 5. Celebración final ---------- */
.cele{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(15,24,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:vIn .25s ease-out}

/* ---------- 6. Tú: punto de partida, logros y ajustes ---------- */
.me-pre{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:13px 15px;margin:0 0 18px;font-size:13.5px;color:var(--ink-soft)}
