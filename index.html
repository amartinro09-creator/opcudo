 dudas:[['¿Por qué 100 € y 5 €?','Porque con 100 € cada euro es un 1 %, y 5 € de prima son un 5 %: las cuentas se hacen de cabeza. Cuando entiendas el mecanismo, verás casos con cifras reales, como el de la Lección 14.']]},
'3-6':{t:'quiz',pista:'Ejercer una Call es comprar a 100 €. ¿Comprarías a 100 € algo que en el mercado vale 90 €?',
 ex:['Ejercer sería comprar a 100 € lo que vale 90 €: perderías 10 € más por acción. Con una Call comprada nadie te obliga a ejercer.',null,'Una Call da derecho a comprar, no a vender. Vender a 100 € sería el derecho de una Put.','Es el día del vencimiento: después, la Call deja de existir.']},
'3-7':{t:'quiz',pista:'Lo que ganas al ejercer, 102 − 100, menos la prima que pagaste.',
 ex:['+2 € es lo que ganas al ejercer. Te falta restar los 5 € de prima.',null,'Has sumado la prima en vez de restarla. La prima es un pago: siempre resta.','−5 € sería si no ejercieras. A 102 € la Call está dentro del dinero: ejerces, ganas 2 € y recuperas parte de la prima.']},
'3-8':{t:'quiz',pista:'Compara el precio de la acción con el strike: ¿son iguales?',
 ex:['Dentro del dinero exige que ejercer dé ventaja: la acción por encima de 100 €. Comprar a 100 € lo que vale 100 € no da ventaja.',null,'Fuera del dinero sería con la acción por debajo de 100 €, donde ejercer daría desventaja.','El punto muerto de esta Call comprada es 105 €, el strike más la prima. A 100 € el resultado es −5 €, no cero.']},
/* ---- Lección 4 ---- */
'4-0':{t:'choice',idea:'Comprar una Put tiene sentido si quieres conservar las acciones y limitar la pérdida durante un plazo concreto. Si crees que el negocio ha empeorado de forma duradera, vender es más directo.',
 items:['No pagas nada, pero asumes toda la caída: si la acción cae a 80 €, pierdes 20 € por acción, 2.000 € en total.','Eliminas el riesgo de caída, pero dejas de ser accionista: si los resultados son buenos y la acción sube, no lo aprovechas.','Pagas una prima fija y, si la acción cae, puedes vender al precio fijado. Si sube, no usas el derecho y aprovechas la subida, menos la prima.'],
 otra:'Las tres son decisiones válidas. La pregunta que decide es si quieres seguir teniendo las acciones: si sí, la Put comprada limita la caída sin tener que venderlas hoy; si no, venderlas es más barato que pagar primas.',
 dudas:['protectora',['¿Cómo sé si la caída será temporal o duradera?','No se sabe de antemano, y la Put comprada te protege sin obligarte a adivinar. Lo que sí puedes decidir es si quieres conservar las acciones. Si ya has decidido que no, venderlas es lo directo.'],
  ['Si quiero conservar las acciones, ¿para qué quiero el derecho a venderlas?','Porque ese derecho vale más cuanto más cae la acción. Si la caída es pasajera y la acción se recupera antes del vencimiento, no lo usas y sigues con tus acciones. Si no se recupera, puedes venderlas al strike o, si prefieres quedártelas, vender en el mercado la Put que compraste y cobrar lo que vale. Esto último lo verás en la Lección 6.']]},
'4-1':{t:'scene',idea:'Comprar una Put es pagar una prima por el derecho a vender al strike hasta el vencimiento.',
 otra:'Frente a la Call comprada solo cambia el derecho: vender en lugar de comprar. La prima se paga igual, no se devuelve igual y el vencimiento funciona igual.',
 dudas:['put','recibo']},
'4-2':{t:'branch',idea:'La Put comprada, sola, gana en neto cuando la acción acaba por debajo de 95 €. Con tus acciones detrás, compensa la caída: tu total no baja de −5 € por acción.',
 otra:'Separa las dos cuentas. La Put comprada: +15 € si la acción cae a 80 €, −5 € si sube a 110 €. Tus acciones: −20 € a 80 €, +10 € a 110 €. Súmalas: −5 € en la caída, +5 € en la subida.',
 dudas:['protectora','suelo']},
'4-3':{t:'anatomy',idea:'Una Put comprada sobre tus acciones funciona como un seguro: la prima es la cuota, el strike es el precio al que puedes vender y el vencimiento es la duración de la póliza.',
 otra:'Donde la comparación con el seguro no llega: la cuota de un seguro la fija la aseguradora, y la prima de una Put la fija el mercado y cambia cada día. La lógica sí es la misma: pagas una cantidad fija para que un suceso concreto no te cueste más de lo que has fijado.',
 dudas:['protectora','suelo']},
'4-4':{t:'putfloor',idea:'Sin la Put, pierdes 1 € por cada euro que cae la acción. Con la Put comprada, tu resultado nunca baja de −5 € por acción.',
 otra:'Pon el precio en 80 €. Barra izquierda, acciones sin cobertura: −20 €. Barra derecha, acciones más Put comprada: −20 € de las acciones, +20 € de la Put al ejercer y −5 € de prima: −5 €.',
 dudas:['suelo',['¿Una orden de stop-loss no hace lo mismo?','No del todo. Un stop-loss vende tus acciones cuando el precio cae hasta un nivel, pero si la acción abre de golpe muy por debajo, se vende al precio que haya, más bajo. Y si después se recupera, ya no las tienes. La Put comprada fija el precio de venta pase lo que pase hasta el vencimiento, a cambio de la prima.']]},
'4-5':{t:'case',idea:'BME difundió entre septiembre de 2018 y noviembre de 2025 un índice que aplicaba esta protección a todo el Ibex 35: futuros sobre el índice más una Put comprada cada mes con strike un 2 % por debajo del índice.',
 dudas:['protectora',['¿Por qué un 2 % por debajo?','Porque una Put con el strike por debajo del precio actual cuesta menos prima, a cambio de no cubrir los primeros movimientos: la caída hasta ese 98 % la asume la cartera. Lo verás con números en la Lección 10.']]},
'4-6':{t:'pair',idea:'La Call comprada da derecho a comprar al strike; la Put comprada, a vender. Quien vende una Call se obliga a vender; quien vende una Put, a comprar.',dudas:['callput','vendeput']},
'4-7':{t:'gridquiz',idea:'Con opciones compradas: si necesitas un precio máximo de compra, compras una Call; si necesitas un precio mínimo de venta, compras una Put. Apostar por una previsión sin nada que proteger es otra cosa (Lección 9).',dudas:['callput']},
'4-8':{t:'quiz',pista:'¿Qué derecho te conviene tener si el precio baja: comprar o vender a un precio fijado?',
 ex:['La Call comprada gana si la acción sube por encima del strike más la prima: justo lo contrario.',null,'No tienes la acción: no puedes venderla. Y la pregunta pide arriesgar solo la prima.','Comprar acciones te hace ganar si suben, no si bajan.']},
'4-9':{t:'quiz',pista:'Suma dos cosas: lo que pierden las acciones y lo que gana la Put comprada al ejercer, menos su prima.',
 ex:['40 € es lo que pierden las acciones solas. La Put comprada gana 40 € al ejercer y los compensa.',null,'Perderías 100 € solo si la acción valiera 0 € y no tuvieras la Put.','La prima de 5 € no se recupera: es lo que costó la protección.']},
/* ---- Lección 5 ---- */
'5-0':{t:'money',idea:'Las etiquetas describen el contrato: si se ejerciera ahora, ¿daría ventaja frente al mercado? Para una Call y una Put del mismo strike la respuesta es la contraria, salvo en el strike, donde las dos están en el dinero.',
 otra:'Pon la acción en 110 €. La Call de strike 100 € da derecho a comprar a 100 € lo que vale 110 €: ventaja, dentro del dinero. La Put de strike 100 € da derecho a vender a 100 € lo que vale 110 €: desventaja, fuera del dinero. Ahora ponla exactamente en 100 €: las dos están en el dinero.',
 dudas:['moneyness','atm']},
'5-1':{t:'stack',idea:'Dentro del dinero: ejercer da ventaja. En el dinero: precio exactamente igual al strike. Fuera del dinero: ejercer da desventaja.',dudas:['itm','atm','otm']},
'5-2':{t:'zones',idea:'El día del vencimiento, dentro del dinero se ejerce (en MEFF, automáticamente); en el dinero, ejercer no cambia nada; fuera del dinero, la opción vence sin valor.',dudas:['automatico','noejerzo','asignacion']},
'5-3':{t:'stack',idea:'Al vencimiento no «te pagan» automáticamente: si el contrato se liquida por entrega, ejercer es comprar o vender de verdad las acciones. Si no quieres eso, cierra la posición antes.',
 otra:'Con una Call comprada de strike 100 € dentro del dinero y liquidación por entrega, el día del vencimiento pagas 10.000 € y recibes 100 acciones. Si no quieres comprarlas o no tienes ese dinero, vende en el mercado la Call que compraste, antes del vencimiento: cobras su valor y no compras nada.',
 dudas:['alvenc','entrega','diferencias','cerrar','vender2']},
'5-4':{t:'case',idea:'Cuando una empresa paga un dividendo extraordinario, MEFF ajusta los strikes para que los contratos sigan valiendo lo mismo. En Inditex, en octubre de 2024, los multiplicó por 0,99064196.',dudas:['ajuste']},
'5-5':{t:'quiz',pista:'Una Put da derecho a vender a 100 €. ¿Da ventaja vender a 100 € algo que vale 90 €?',
 ex:[null,'Eso pasaría con una Call: su derecho es comprar, y comprar a 100 € lo que vale 90 € da desventaja. La Put es al revés.','En el dinero exige que el precio sea exactamente 100 €.','Se puede saber: basta con comparar el precio, 90 €, con el strike, 100 €.']},
'5-6':{t:'quiz',pista:'Una Call da derecho a comprar a 100 €. ¿Da ventaja comprar a 100 € algo que vale 95 €?',
 ex:['Dentro del dinero sería con la acción por encima de 100 €.',null,'En el dinero exige que el precio sea exactamente 100 €. A 95 € no lo es.','El punto muerto de una Call comprada es el strike más la prima, por encima de 100 €. A 95 € la Call está fuera del dinero.']},
'5-7':{t:'quiz',pista:'Es la definición de una de las tres etiquetas.',
 ex:['Dentro del dinero exige que ejercer dé ventaja. Con el precio igual al strike, no la da.','Fuera del dinero exige que ejercer dé desventaja. Con el precio igual al strike, tampoco.',null,'El vencimiento es una fecha: no depende del precio.']},
/* ---- Lección 6 ---- */
'6-0':{t:'timevalue',idea:'La prima tiene dos partes. El valor intrínseco depende solo del precio y del strike. El valor temporal baja con el paso del tiempo y al vencimiento vale 0.',
 otra:'El primer día, con 180 días por delante, la Call cuesta 10 €: 5 € de valor intrínseco (105 − 100) y 5 € de valor temporal. Si la acción sigue en 105 € hasta el final, el día del vencimiento solo quedan los 5 € de valor intrínseco. Quien la compró por 10 € pierde 5 € sin que la acción se haya movido.',
 dudas:['partes','yunque']},
'6-1':{t:'pair',idea:'Prima = valor intrínseco + valor temporal. El valor intrínseco nunca es negativo; el valor temporal llega a cero al vencimiento.',
 otra:'Con la acción a 105 €, la Call de strike 100 € tiene 5 € de valor intrínseco, y la Put de strike 100 € tiene 0, porque ejercerla daría desventaja. Si esa Put cotiza a 2 €, esos 2 € son todo valor temporal.',
 dudas:['intrinseco','temporal']},
'6-2':{t:'stack',idea:'Tres factores pesan más en la prima: cuánto está dentro o fuera del dinero la opción, cuánto tiempo queda y cuánto se mueve la acción.',
 otra:'Como en un seguro: una póliza cuesta más si el riesgo es mayor o si dura más tiempo. Una opción, igual: más cara cuanto más valor intrínseco tiene, cuanto más tiempo queda y cuanto más se mueve la acción.',
 dudas:['cara','volatilidad']},
'6-3':{t:'pair',idea:'Vender la opción que compraste es cerrar tu posición. Vender una opción que no tenías es abrir una posición vendedora, con una obligación y otro riesgo.',dudas:['vender2','cerrar']},
'6-4':{t:'resale',idea:'No tienes que esperar al vencimiento: puedes vender la opción que compraste por lo que valga ese día, valor intrínseco más el valor temporal que le quede.',
 otra:'Con la acción a 110 € a los 30 días, tu Call comprada vale 11 €: 10 € de valor intrínseco y 1 € de valor temporal. Si la vendes, cobras 11 € por una opción que te costó 5 €: +6 € por acción. Si esperas y la acción sigue en 110 €, al vencimiento solo quedan los 10 € de valor intrínseco: +5 €.',
 dudas:['cerrar','partes']},
'6-5':{t:'stack',idea:'El paso del tiempo baja el valor temporal: perjudica a quien compró la opción y favorece a quien la vendió.',dudas:['yunque','iman']},
'6-6':{t:'case',idea:'El VIBEX mide cuánta volatilidad esperan los inversores en el Ibex 35 según lo que pagan por sus opciones. Cuando sube, las opciones sobre el Ibex cotizan con más valor temporal.',dudas:['volatilidad']},
'6-7':{t:'quiz',pista:'Si ejercer da desventaja, ¿estás obligado a ejercer?',
 ex:['Si el precio va en contra, simplemente no ejerces: el valor intrínseco se queda en 0.',null,'En las Puts pasa igual: si vender al strike da desventaja, no se ejerce y el valor intrínseco es 0.','Nunca es negativo, ni antes del vencimiento ni ese día.']},
'6-8':{t:'quiz',pista:'¿Qué le pasa al valor temporal cuando pasa el tiempo? ¿Quién lo pagó y quién lo cobró?',
 ex:['El comprador pagó valor temporal y ese valor ha bajado: le ha perjudicado.',null,'El valor temporal ha bajado aunque el precio no se moviera: eso favorece a uno y perjudica al otro.','Lo que pierde uno lo gana el otro: no les afecta por igual.']},
'6-9':{t:'quiz',pista:'Las opciones de MEFF se negocian en el mercado todos los días hasta el vencimiento.',
 ex:['No tienes que esperar: puedes vender la Call en el mercado cualquier día antes del vencimiento.',null,'Ejercer nunca es obligatorio para quien compró la opción: es un derecho.','Puedes venderla hoy mismo: 8 € − 5 € = +3 € por acción, 300 € por contrato.']},
/* ---- Lección 7 ---- */
'7-0':{t:'payoff',idea:'El gráfico de resultado de la Call comprada: plano en −5 € por debajo del strike, se dobla en 100 € y cruza el cero en el punto muerto, 105 €. Cuanto más sube la acción, más gana: no hay límite.',
 otra:'Léelo como una tabla. A 90 €: −5 €. A 100 €: −5 €. A 102 €: −3 €. A 105 €: 0 €. A 110 €: +5 €. A 120 €: +15 €. La línea une todos esos puntos.',
 dudas:['payoff','equilibrio','techo']},
'7-1':{t:'zones',idea:'Tres rasgos de la Call comprada: pérdida máxima igual a la prima, ganancia sin límite y punto muerto en el strike más la prima.',dudas:['maxperd','techo']},
'7-2':{t:'payoff',idea:'Un mismo gráfico responde a muchas preguntas: dónde está en el dinero (100 €), dónde está dentro del dinero y aun así pierde (entre 100 € y 105 €), dónde está el punto muerto (105 €), dónde gana una cantidad concreta y cuándo pierde menos que la acción.',
 otra:'Método para cualquier reto: elige un precio con el deslizador, calcula lo que da ejercer (precio − 100 €, si es positivo), réstale la prima de 5 € y compáralo con lo que pide el reto. Si el reto habla de la acción, compara con la línea gris: precio − 100 €.',
 dudas:['equilibrio','itm','atm','pierdosube',['¿Por qué está oculto el resultado?','Porque si el número te dice la respuesta, no lees el gráfico. Aquí tienes que deducirlo: ejercer da precio menos strike, y a eso se le resta la prima. Después de comprobar, el número vuelve a aparecer.'],['¿Qué pasa si fallo?','Pierdes una vida solo en el primer intento de cada reto. Te explico qué pasa en el precio que elegiste y te doy una pista; si vuelves a fallar, te enseño la respuesta.']]},
'7-3':{t:'quiz',pista:'Mira el tramo plano de la línea: ¿a qué altura está?',
 ex:['Solo pagarías el precio de la acción si ejercieras, y no ejerces si te da desventaja.',null,'Ilimitada es la pérdida de quien VENDE una Call sin tener las acciones. Quien la compra pierde como mucho la prima.','El strike es el precio al que compras si ejerces, no una pérdida.']},
'7-4':{t:'quiz',pista:'¿Tiene límite la línea hacia la derecha? ¿Tiene un máximo el precio de una acción?',
 ex:['El strike es el precio al que compras si ejerces, no un límite de ganancia.','No hay límite ligado a la prima: cuanto más sube la acción por encima de 105 €, más gana la Call comprada.',null,'Con la acción a 120 €, la Call comprada gana 15 € por acción sobre 5 € de prima: un +300 %. No hay límite del 100 %.']},
/* ---- Lección 8 ---- */
'8-0':{t:'payoff',idea:'El gráfico de la Put comprada es el reflejo del de la Call comprada: plano en −5 € por encima del strike y subiendo hacia la izquierda, cuanto más baja el precio.',
 otra:'Léelo como una tabla. A 110 €: −5 €. A 100 €: −5 €. A 98 €: −3 €. A 95 €: 0 €. A 90 €: +5 €. A 80 €: +15 €. A 0 €: +95 €, el máximo.',
 dudas:['payoff','equilibrio']},
'8-1':{t:'zones',idea:'La Call comprada y la Put comprada pierden como mucho la prima. La ganancia de la Call comprada no tiene límite; la de la Put comprada llega como mucho al strike menos la prima.',dudas:['techo','maxperd']},
'8-2':{t:'payoff',idea:'La Put comprada es el reflejo de la Call comprada: dentro del dinero con pérdida entre 95 € y 100 €, punto muerto en 95 €, fuera del dinero por encima de 100 € y, justo en 100 €, en el dinero.',
 otra:'Método para cualquier reto: elige un precio con el deslizador, calcula lo que da ejercer (100 € − precio, si es positivo), réstale la prima de 5 € y compáralo con lo que pide el reto.',
 dudas:['equilibrio','itm','otm','atm',['¿Por qué está oculto el resultado?','Porque si el número te dice la respuesta, no lees el gráfico. Aquí tienes que deducirlo: ejercer da strike menos precio, y a eso se le resta la prima. Después de comprobar, el número vuelve a aparecer.']]},
'8-3':{t:'case',idea:'La línea de la Put comprada fue la base del índice IBEX 35® Protective Put (2018–2025): sumada a una posición que replica el Ibex, deja el resultado con un mínimo.',dudas:['protectora']},
'8-4':{t:'quiz',pista:'¿Cuánto puede bajar como mucho el precio de una acción?',
 ex:['La acción no puede valer menos de 0 €, así que la ganancia de la Put comprada tiene límite: 100 € − 5 € = 95 € por acción. Varios manuales dicen «ilimitada»: es un error.',null,'La prima es la pérdida máxima de quien compra, no su ganancia máxima.','Para eso la acción tendría que valer menos de 0 €, y no puede.']},
'8-5':{t:'quiz',pista:'Fíjate en el tramo plano de las dos líneas.',
 ex:['Solo la Call comprada tiene ganancia ilimitada. La de la Put comprada tiene límite: strike menos prima.',null,'La Call comprada sube hacia la derecha; la Put comprada, hacia la izquierda.','Cortan el cero en el punto muerto, no en el strike. En el strike, las dos pierden la prima entera.']},
/* ---- Lección 9 ---- */
'9-0':{t:'twouse',idea:'El mismo contrato puede ser especulación o cobertura. Lo que lo decide no está en la opción, sino en si quien la compra tiene algo que proteger: un activo que ya tiene o una compra o venta que tendrá que hacer.',
 otra:'La Put comprada de strike 100 € y prima 5 € da los mismos números en los dos casos: +15 € si la acción cae a 80 €, −5 € si sube a 110 €. Para quien no tiene acciones, ese es su resultado. Para quien tiene 100 acciones compradas a 100 €, hay que sumarle lo que ganan o pierden sus acciones, y el total queda en −5 € o +5 €.',
 dudas:['especulacion','cobertura']},
'9-1':{t:'sandbox',idea:'Adivinar cómo reaccionará el mercado a unos resultados no tiene respuesta correcta. Aquí la Call comprada ganó, pero un buen resultado no demuestra una buena decisión: si la acción no se hubiera movido, habría perdido el 100 % de la prima.',dudas:['especulacion','apalanca']},
'9-2':{t:'case',idea:'Lamothe resume los dos usos. Cobertura: se transfiere el riesgo de pérdida y se mantiene la posibilidad de beneficio. Especulación: la pérdida se limita a la prima, que puede perderse entera.',dudas:['cobertura','especulacion']},
'9-3':{t:'quiz',pista:'¿Tienes algo que proteger?',
 ex:['Especular sería comprar la Put sin tener las acciones, para ganar con la caída.',null,'Estás comprando una opción: pagas la prima. Vender sería cobrarla y asumir una obligación.','La Put comprada sobre acciones que ya tienes reduce tu riesgo; no lo multiplica.']},
'9-4':{t:'quiz',pista:'Compara 10.000 € con 500 €.',
 ex:['Con las acciones pones 10.000 €. Con la Call comprada, 500 €.',null,'No es lo mismo: 500 € frente a 10.000 €. Con 500 € dependes de 100 acciones: los porcentajes se multiplican, y puedes perder el 100 % de lo pagado.','La prima la fija el mercado, no el bróker. El bróker cobra una comisión aparte.']},
'9-5':{t:'sandbox',idea:'Quien tiene acciones que necesitará vender compra una Put para no perder más de lo que puede permitirse. Si al final la acción sube, el seguro no se usa y cuesta la prima: eso no es un error.',dudas:['cobertura','protectora']},
/* ---- Lección 10 ---- */
'10-0':{t:'hedge',idea:'Con una Put comprada sobre el Mini IBEX, una cartera que replica el Ibex 35 no pierde más que la prima, 600 €, caiga lo que caiga el índice.',
 otra:'Pon el Ibex en 18.000 puntos. La cartera pierde 2.000 € (1 € por punto). La Put comprada de strike 20.000 gana 2.000 € al ejercer y costó 600 € de prima. Total: −600 €. En 16.000 puntos: −4.000 € + 4.000 € − 600 € = −600 €, lo mismo.',
 dudas:['miniibex','multiplicador',['¿Y si mi cartera no se parece al Ibex?','Entonces la Put Mini IBEX solo te protege de forma aproximada: si tus acciones caen más que el Ibex, la Put no compensa la diferencia. La protección es exacta solo si la cartera replica el índice.']]},
'10-1':{t:'stack',idea:'Con una Put comprada, el resultado mínimo de la cartera es (strike − valor inicial) − prima. Un strike más bajo cuesta menos prima, pero deja sin cubrir la caída hasta el strike.',
 otra:'Put de strike 20.000: mínimo −600 €. Put de strike 19.000: cuesta la mitad, 300 €, pero la caída de 20.000 a 19.000, 1.000 €, la asumes tú. Mínimo: −1.000 € − 300 € = −1.300 €.',
 dudas:['nocubierta']},
'10-2':{t:'case',idea:'Un ejemplo del manual de MEFF, recalculado: la cartera pierde 600 € y la Put comprada aporta +200 € − 63 € = +137 €. Total: −463 €, no −493 € como dice el manual.',
 dudas:[['¿De verdad el manual de MEFF tiene un error?','En ese ejemplo, sí: da −493 € y la cuenta correcta es −463 €. Compruébalo: 8.300 − 8.900 = −600 €; 8.500 − 8.300 − 63 = +137 €; −600 + 137 = −463 €.']]},
'10-3':{t:'quiz',pista:'¿Qué pasa con la cartera por debajo del strike cuando tienes la Put comprada?',
 ex:['Si el índice sube, la cartera gana igual, menos la prima: la ganancia no tiene límite.',null,'Las comisiones las cobra el intermediario por cada operación; comprar una Put no las limita: es una operación más.','La volatilidad del índice no depende de lo que tú compres.']},
'10-4':{t:'quiz',pista:'La prima se paga al principio. ¿Se devuelve si no se usa la protección?',
 ex:['La prima nunca se devuelve: pagaba la protección durante el plazo, se use o no.',null,'La prima se paga entera al principio y no depende de lo que pase después.','No existe esa comisión: la Put simplemente vence sin valor.']},
'10-5':{t:'quiz',pista:'Tres partes: lo que pierde la cartera, lo que gana la Put al ejercer (19.000 − 16.000) y la prima.',
 ex:['−4.000 € es lo que pierde la cartera sin la Put. La Put comprada gana 3.000 € al ejercer y compensa una parte.',null,'−300 € es solo la prima. Con strike 19.000, además, la caída de 20.000 a 19.000, 1.000 €, no está cubierta.','+1.700 € no sale de ninguna cuenta correcta: la cartera pierde 4.000 €, la Put comprada gana 3.000 € al ejercer y cuesta 300 € de prima. Total: −1.300 €.']},
'9-8':{t:'pair',idea:'Compra la opción que gana justo cuando tú pierdes: quien comprará y teme una subida compra una Call; quien venderá y teme una bajada compra una Put.',
 otra:'Pregúntate qué precio te hace daño. A la harinera le hace daño que el trigo suba; al agricultor, que baje. Cada uno compra el derecho que le paga en su mal escenario: comprar al strike (Call) o vender al strike (Put).',
 dudas:['cobertura',['¿Y si compran la opción contraria?','Ya no se protegen: apuestan dos veces en la misma dirección. La harinera con una Put comprada ganaría más si el trigo baja, cuando ya le va bien, y si sube perdería con el trigo y además la prima.']]},
'9-9':{t:'stack',idea:'Tres formas de afrontar un precio que no controlas: no cubrirse (todo el riesgo y toda la oportunidad), fijarlo con un futuro o un swap (sin prima, pero obligado) o comprar una opción (con prima, pero libre si el precio va a favor).',
 otra:'Piensa en la gasolina de un viaje. No cubrirse es pagar lo que marque el surtidor ese día. Fijar el precio es pactar hoy un precio y pagarlo aunque luego baje. Comprar una opción es pagar algo hoy por un precio máximo, y si luego está más barata, pagar lo que marque el surtidor.',
 dudas:['futuro','swap','garantias']},
'10-7':{t:'cob3',idea:'Ninguna decisión gana en todos los precios. No cubrirse gana si el queroseno baja; el futuro, si sube. La Call comprada nunca es la mejor, pero es la única que pone un máximo, 840 €, sin renunciar a las bajadas.',
 otra:'Tabla rápida. A 650 €: sin cubrirse paga 650 €, con el futuro 800 € y con la Call comprada 690 €. A 800 €: 800 €, 800 € y 840 €. A 950 €: 950 €, 800 € y 840 €.',
 dudas:[['¿Por qué no compra una Put?','Porque la Put comprada gana cuando el precio baja, y cuando el queroseno baja la aerolínea ya sale ganando: paga menos. Si sube, que es lo que teme, la Put no le da nada.']]},
'10-8':{t:'case',idea:'IAG tenía coberturas para un combustible que en 2020 ya no necesitaba, y registró una pérdida de 1.781 millones de euros por ellas. Desde 2021 usa más Calls compradas: con ellas, lo máximo que se pierde es la prima.',
 dudas:['swap',['¿Qué es estar sobrecubierto?','Tener coberturas por más cantidad de la que al final necesitas. A IAG le pasó en 2020: tenía coberturas para mucho más combustible del que iba a gastar, porque los aviones estaban en tierra. Con el queroseno hundido, esas coberturas perdían valor, y la pérdida era suya aunque no fuera a comprar ese combustible.'],['¿Le pasó solo a IAG?','No. Ryanair, que según su informe anual se cubre «generalmente» con swaps o con Calls compradas, incluyó en los resultados que publicó el 18 de mayo de 2020 una pérdida extraordinaria de 353 millones de euros, después de impuestos, por coberturas de combustible que ya no iba a necesitar: la pandemia había dejado sus aviones en tierra.'],['¿Entonces los swaps son malos?','No. Fijan el precio sin pagar prima y protegen igual de bien si el combustible sube. Su problema es la obligación: si el precio cae o ya no necesitas el combustible, pagas igual. Por eso IAG decidió en 2021 usar más Calls compradas.']]},
'10-10':{t:'cob3',idea:'Lo mismo que la aerolínea, al revés. No cubrirse gana si el trigo sube; el futuro, si baja. La Put comprada nunca es la mejor, pero es la única que asegura un mínimo, 190 €, sin renunciar a las subidas.',
 otra:'Tabla rápida. A 160 €: sin cubrirse cobra 160 €, con el futuro 200 € y con la Put comprada 190 €. A 200 €: 200 €, 200 € y 190 €. A 240 €: 240 €, 200 € y 230 €.',
 dudas:[['¿Por qué no compra una Call?','Porque la Call comprada gana cuando el precio sube, y cuando el trigo sube el agricultor ya gana: cobra más. Si baja, que es lo que teme, la Call no le da nada.']]},
'10-11':{t:'case',idea:'El precio del trigo en España subió un 71 % en menos de un año y bajó un 28 % en los diez meses siguientes. Es el riesgo de quien vende trigo si baja, y el de quien lo compra si sube.',
 dudas:[['¿Qué se negocia en Euronext?','Futuros y opciones sobre trigo molturable, el que se muele para hacer harina. Cada futuro es de 50 toneladas, y sus opciones son de estilo americano: se pueden ejercer cualquier día hasta el vencimiento.'],['¿Por qué Euronext y no un mercado español?','Porque en Euronext se forma el precio de referencia del trigo en Europa, y allí pueden cubrirse también productores y compradores españoles. MEFF negocia derivados financieros: sobre el Ibex 35 y sobre acciones.'],'futuro','estilo']},
'10-12':{t:'case',idea:'En 2022, con el trigo muy volátil, se negociaron muchas más opciones sobre trigo en Euronext, un 68 % más. A quien había vendido futuros, las garantías le exigían cada vez más dinero; con una opción comprada, la pérdida se limita a la prima.',
 dudas:['garantias',['¿Por qué asfixian las garantías si el trigo vale más?','Porque el dinero de las garantías hay que ponerlo ya, y el trigo solo se cobra cuando se vende. Si el precio sube mucho, quien vendió futuros puede quedarse sin dinero disponible aunque, sumando su trigo, no esté perdiendo.'],'futuro']},
/* ---- Lección 11 ---- */
'11-0':{t:'twocurves',idea:'La Call comprada y la Call vendida son el mismo contrato visto desde los dos lados: lo que gana uno lo pierde el otro. La Call comprada pierde como mucho la prima; la Call vendida gana como mucho la prima y, sin acciones, puede perder sin límite.',
 otra:'Con la acción a 120 €: la Call comprada gana 20 € al ejercer menos 5 € de prima, +15 €; quien vendió la Call cobró 5 € y entrega a 100 € lo que vale 120 €, −15 €. Suman cero. Con la acción a 130 €: +25 € y −25 €. Cuanto más sube, más pierde quien vendió la Call sin tener las acciones.',
 dudas:['asimetria','descubierta']},
'11-1':{t:'pair',idea:'Quien compra una opción conoce su pérdida máxima: la prima. Quien la vende conoce su ganancia máxima: también la prima. Por eso las garantías solo se exigen al vendedor.',dudas:['asimetria','garantias']},
'11-2':{t:'grid2x2',idea:'Las cuatro posiciones: arriba, las compradas, con la pérdida limitada a la prima; abajo, las vendidas, con la ganancia limitada a la prima.',dudas:['cuatro','vendeput']},
'11-3':{t:'gridquiz',idea:'Dos preguntas bastan: ¿pagas o cobras la prima? ¿El derecho de quien paga es comprar o vender?',dudas:['cuatro']},
'11-4':{t:'sandbox',idea:'Acertar la dirección no basta: si la acción sube menos que la prima, la Call comprada pierde dinero. Aquí, no operar dio 0 €, mejor que acertar la dirección. Y quien vendió esa Call ganó 2 €: lo que pierde uno lo gana el otro.',dudas:['pierdosube','equilibrio']},
'11-5':{t:'case',idea:'Vender opciones sin tener cubierta la obligación queda fuera del curso: en la Call vendida así la pérdida no tiene límite, y en la Put vendida puede llegar al strike menos la prima.',dudas:['descubierta','garantias']},
'11-6':{t:'case',idea:'Antes de operar con un derivado, el intermediario tiene que entregarte el KID. El de Eurex para vender Puts sobre divisas le asigna el riesgo máximo: 7 sobre 7.',
 dudas:[['¿Qué es el indicador de riesgo del KID?','Una escala del 1 al 7 que resume el riesgo del producto. Vender Puts sobre divisas tiene un 7, el máximo, porque quien vende puede perder mucho más que la prima que cobra.'],
  ['¿El KID siempre es exacto?','Es un documento regulado, pero también simplifica. El de Eurex llama «ilimitada» a la pérdida de quien vende la Put, aunque su propia fórmula la limita al strike menos la prima. Por eso conviene entender el mecanismo, y no solo leer el documento.']]},
'11-7':{t:'quiz',pista:'¿Quién tiene que entregar acciones si la otra parte ejerce?',
 ex:['Quien compra una Call pierde como mucho la prima.',null,'Solo el vendedor: quien compra pierde como mucho la prima.','Quien vende la Call sin tener las acciones sí puede perder sin límite: si la acción sube, tiene que comprarlas cada vez más caras para entregarlas al strike.']},
'11-8':{t:'quiz',pista:'Quien compra una opción solo tiene derechos.',
 ex:[null,'El precio del subyacente no es lo que arriesga: si ejerce una Call, paga el strike y recibe las acciones a cambio. Lo más que puede perder es la prima.','Ilimitada puede ser la pérdida de quien VENDE una Call sin tener las acciones, no la de quien compra.','El strike es el precio de compra o de venta al ejercer, no una pérdida.']},
/* ---- Lección 12 ---- */
'12-0':{t:'chain',idea:'Tu orden va de ti al bróker y del bróker a MEFF, y la cámara, BME Clearing, garantiza que el contrato se cumple. Cada opción tiene dos precios: el de demanda y el de oferta.',dudas:['broker','bidask']},
'12-1':{t:'pair',idea:'En una opción solo se obliga el vendedor, y por eso hay prima. En un futuro se obligan los dos, y no hay prima.',dudas:['futuro']},
'12-2':{t:'pair',idea:'El estilo solo dice cuándo se puede ejercer: el europeo, solo el día del vencimiento; el americano, cualquier día hasta el vencimiento.',
 otra:'Todo lo demás funciona igual en los dos estilos: la prima, el strike, el derecho de quien compra y la obligación de quien vende. Y las dos se pueden vender en el mercado antes del vencimiento.',
 dudas:['estilo','asignacion']},
'12-3':{t:'timeline',idea:'De José de la Vega, en 1688, al MEFF de hoy dentro del grupo SIX: más de tres siglos de opciones.',dudas:['delavega']},
'12-4':{t:'case',idea:'La CNMV supervisa MEFF y a los intermediarios. Antes de operar con un derivado, el intermediario debe entregarte el KID.',dudas:['ab-kid','ab-cnmv']},
'12-5':{t:'quiz',pista:'Mira el segundo eslabón de la cadena.',
 ex:['MEFF no abre cuentas a particulares: solo acepta órdenes de sus miembros.',null,'El número de contratos no cambia la regla: siempre a través de un intermediario.','Para futuros y para opciones es igual: siempre a través de un intermediario.']},
'12-6':{t:'quiz',pista:'Es el mismo organismo que supervisa las bolsas españolas.',
 ex:['El Banco de España supervisa a los bancos, no los mercados de valores y derivados.',null,'El Ministerio regula, pero la supervisión de los mercados corresponde a la CNMV.','SIX es el grupo propietario de BME desde 2020, no el supervisor. MEFF sigue supervisado por la CNMV.']},
'12-7':{t:'quiz',pista:'El estilo solo dice cuándo se puede ejercer.',
 ex:['Cualquier día hasta el vencimiento es el estilo americano.',null,'El nombre no tiene que ver con el país.','Se puede ejercer, pero solo el día del vencimiento. Antes, se puede vender en el mercado.']},
/* ---- Lección 13 ---- */
'13-0':{t:'cards',idea:'Explicar un término en voz alta antes de ver la respuesta es lo que hace que se quede.'},
'13-1':{t:'gridquiz',idea:'Las cuatro posiciones, otra vez: quien compra paga la prima y tiene el derecho; quien vende cobra la prima y tiene la obligación.',dudas:['cuatro']},
'13-2':{t:'stack',idea:'Cuatro cuentas: la pérdida máxima de quien compra (la prima), el punto muerto (strike ± prima), las partes de la prima y el resultado mínimo con una Put protectora.',dudas:['suelo','equilibrio']},
'13-3':{t:'quiz',pista:'¿Cuál de las tres puede perder sin límite? ¿Cuál no arriesga nada?',
 ex:['Comprar una Call arriesga como mucho la prima; venderla sin tener las acciones, sin límite.',null,'No operar no arriesga nada: es la de menos riesgo, no la de más.','Una pierde sin límite, otra como mucho la prima y otra nada.']},
'13-4':{t:'quiz',pista:'En la Put comprada ganas cuando el precio baja. ¿La prima se suma o se resta al strike?',
 ex:['105 € es el punto muerto de una Call comprada con esos números: strike más prima.','100 € es el strike: ahí la Put comprada pierde la prima entera, −5 €.',null,'5 € es la prima, no un precio de la acción.']},
'13-5':{t:'quiz',pista:'El valor temporal es lo que se paga por el tiempo que queda. ¿Cuánto tiempo queda el día del vencimiento?',
 ex:['El valor temporal baja con el paso del tiempo: el último día ya no queda nada.','No hay ninguna regla de la mitad: el valor temporal llega a cero.',null,'El strike influye en el valor intrínseco. El valor temporal, al vencimiento, es cero siempre.']},
/* ---- Lección 14 ---- */
'14-0':{t:'choice',idea:'La Put protectora sirve cuando quieres conservar las acciones y limitar la pérdida durante un periodo concreto.',
 items:['Eliminas el riesgo, pero dejas de ser accionista y renuncias a la subida. Es lo más directo si crees que el negocio ha empeorado de forma duradera.','Si caen, pierdes; si suben, ganas. Asumes el riesgo completo.','Pagas una prima fija y te aseguras un precio mínimo de venta hasta el vencimiento.'],
 dudas:['protectora']},
'14-1':{t:'gridquiz',idea:'Para limitar la pérdida de unas acciones que ya tienes, compras una Put: es la Put protectora.',dudas:['protectora']},
'14-2':{t:'anatomy',idea:'Tu Put protectora: derecho a vender a 20,00 € pagando 1,20 € por acción. Resultado mínimo: 20,00 − 19,90 − 1,20 = −1,10 € por acción.',dudas:['suelo']},
'14-3':{t:'hedge',idea:'Por mucho que caiga la acción, tu pérdida se queda en 1,10 € por acción, 110 € en total.',dudas:['suelo']},
'14-4':{t:'branch',idea:'Suba o baje la acción, sabías desde el primer día cuánto podías perder como mucho: 110 €.',
 otra:'Si la acción sube a 24 €, la Put comprada no se ejerce y pierdes la prima, 120 €, pero tus acciones ganan 410 €: +290 €. Si baja a 16 €, tus acciones pierden 390 € y la Put comprada gana 400 € al ejercer, menos 120 € de prima, +280 €: total, −110 €.',
 dudas:['protectora']},
'14-5':{t:'case',idea:'El manual de MEFF da −120 € como pérdida máxima de este ejemplo, pero su propia tabla da −110 € en la fila de 20,00 €, y la cuenta correcta es −110 €.',
 dudas:[['¿Por qué −110 € y no −120 €?','Porque el strike, 20,00 €, está 10 céntimos por encima de lo que pagaste por las acciones, 19,90 €. Esos 10 céntimos por acción, 10 € en total, juegan a tu favor: −120 € + 10 € = −110 €.']]},
'14-6':{t:'quiz',pista:'La Put comprada se negocia en el mercado hasta el vencimiento.',
 ex:['No tienes que esperar: puedes vender la Put en el mercado.',null,'Ejercer sería vender a 20 € acciones que valen 22 €: perderías 2 € por acción.','La prima no se devuelve nunca.']},
'14-7':{t:'anatomy',idea:'MEFF multiplicó todos los strikes de Inditex por 0,99064196 y dividió el número de acciones por contrato por el mismo ratio, redondeando a acciones enteras, para que el dividendo extraordinario no cambiara el valor de los contratos.',dudas:['ajuste']},
'14-8':{t:'quiz',pista:'¿Qué le pasa al precio de la acción el día en que empieza a cotizar sin el dividendo? ¿Lo cobra quien tiene opciones?',
 ex:['El ajuste no premia a nadie: busca que ni compradores ni vendedores ganen o pierdan por el dividendo.',null,'El ajuste no cobra nada: solo cambia los strikes y el número de acciones por contrato.','Lo decide MEFF según sus reglas, no la empresa.']},
'14-9':{t:'quiz',pista:'Suma: lo que pierden las acciones, lo que gana la Put al ejercer (20,00 − 14,00) y la prima. Todo por 100 acciones.',
 ex:['−590 € es lo que pierden las acciones sin la Put. La Put comprada gana 600 € al ejercer.','−120 € es la cifra que da el manual de MEFF, pero olvida que el strike, 20,00 €, está 10 céntimos por encima de tu precio de compra. El resultado mínimo es −110 €.',null,'+470 € no sale de ninguna cuenta correcta: −590 € de las acciones, +600 € de la Put al ejercer y −120 € de prima dan −110 €.']},
/* ---- Lección 15 ---- */
'15-0':{t:'case',idea:'Quince preguntas de todo el curso. Con 11 aciertos consigues el certificado, y puedes repetir el test las veces que quieras.',dudas:['certificado']},
'15-1':{t:'quiz',ex:['La obligación la asume quien vende la opción.',null,'Las acciones solo se reciben si se ejerce una Call con liquidación por entrega, pagándolas al strike.','No hay ningún préstamo: la prima se paga y no se devuelve.']},
'15-2':{t:'quiz',ex:['Esa es la obligación de quien vende una Call.',null,'La prima no se devuelve: es de quien vendió desde el primer día.','Quien vende una opción siempre asume una obligación.']},
'15-3':{t:'quiz',ex:['95 € es el punto muerto de una Put comprada con esos números.','100 € es el strike: ahí la Call comprada pierde la prima entera.',null,'5 € es la prima, no un precio de la acción.']},
'15-4':{t:'quiz',ex:[null,'100 € es el strike: ahí la Put comprada pierde la prima entera.','105 € es el punto muerto de una Call comprada con esos números.','5 € es la prima, no un precio de la acción.']},
'15-5':{t:'quiz',ex:[null,'En el dinero exige que el precio sea exactamente 100 €.','Fuera del dinero sería con la acción por debajo de 100 €.','El vencimiento es una fecha: no depende del precio.']},
'15-6':{t:'quiz',ex:['12 € es la prima entera. El valor temporal es la prima menos el valor intrínseco.','10 € es el valor intrínseco: 110 − 100.',null,'Solo sería 0 el día del vencimiento, o si la prima fuera igual al valor intrínseco.']},
'15-7':{t:'quiz',ex:['Puedes venderla en el mercado cualquier día antes del vencimiento.',null,'Ejercer es un derecho, nunca una obligación para quien compró la opción.','La prima no se devuelve.']},
'15-8':{t:'quiz',ex:['−20 € es lo que pierden las acciones solas.',null,'+15 € es lo que gana la Put comprada sola. Te faltan los −20 € de las acciones.','La prima de 5 € no se recupera.']},
'15-9':{t:'quiz',ex:['300 € es solo la prima. Falta la caída no cubierta, de 20.000 a 19.000.','1.000 € es solo la caída no cubierta. Falta la prima.',null,'Con la Put comprada, la pérdida de la cartera tiene un máximo.']},
'15-10':{t:'quiz',ex:['Quien compra una Call pierde como mucho la prima.','Quien compra una Put pierde como mucho la prima.',null,'Quien vende una Call sin tener las acciones sí puede perder sin límite.']},
'15-11':{t:'quiz',ex:['El paso del tiempo no suma valor temporal: lo resta.','Aunque el precio no cambie, el tiempo sí pasa.',null,'No hay ninguna regla que lo duplique.']},
'15-12':{t:'quiz',ex:['En MEFF, un contrato de opción sobre acciones corresponde a 100 acciones.','En MEFF, un contrato de opción sobre acciones corresponde a 100 acciones.',null,'En MEFF, un contrato de opción sobre acciones corresponde a 100 acciones.']},
'15-13':{t:'quiz',ex:['Eso es el estilo americano.',null,'El nombre no tiene que ver con el país.','Se puede ejercer, pero solo el día del vencimiento.']},
'15-14':{t:'quiz',ex:[null,'En una opción solo se obliga el vendedor; en un futuro, los dos.','En un futuro no hay prima, porque nadie tiene derecho a elegir.','La diferencia es la obligación: en un futuro, de las dos partes.']},
'15-15':{t:'quiz',ex:['No tiene relación con los derivados.',null,'Una factura no explica el producto ni sus riesgos.','Es obligatorio en la Unión Europea desde 2018.']},
'15-16':{t:'cert',dudas:['certificado']}
};

/* ================= GUÍA «NO LO ENTIENDO» · MOTOR =================
   Botón fijo abajo → menú con dudas frecuentes y buscador → recorrido
   por la pantalla: oscurece todo menos el elemento del que se habla,
   lo numera y lo explica con una flecha. */
(function(){
'use strict';
const E=v=>eur(v);
const SG=v=>(v>0?'+':'')+eur(v);
const strip=s=>String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,'\u00a0').replace(/[ \t\r\n]+/g,' ').trim();
const cap1=s=>{s=String(s);return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase()};
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const $g=id=>document.getElementById(id);
const miles=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const reduce=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- conceptos: los del contenido + las siglas de ABREV ---------- */
const CI=GC.slice();
ABREV.forEach(a=>{const n=nrm(a.s);if(['itm','atm','otm'].includes(n))return;
 CI.push({id:'ab-'+n.replace(/ /g,''),t:a.s,k:[n,...(GSIN[a.s]||[])],d:a.d})});
CI.forEach(c=>{c.kk=c.k.map(nrm)});
/* términos del glosario que no estén ya cubiertos */
Object.keys(GLOSARIO).forEach(l=>GLOSARIO[l].forEach(g=>{const n=nrm(g.t);
 if(CI.some(c=>c.kk.some(k=>k===n||(k.length>4&&(' '+n+' ').includes(' '+k+' ')))))return;
 CI.push({id:'gl-'+n.replace(/ /g,''),t:g.t,k:[n],kk:[n],d:g.d,l:+l})}));
const CBY={};CI.forEach(c=>{CBY[c.id]=c});

/* ---------- pasos: {id, s: selector, i: índice, t: título, x: texto, c: conceptos} ---------- */
function P(id,s,i,t,x,c){return{id,s,i:i||0,t,x,c:(c||[]).slice()}}
const hit=k=>`[onclick="chartInfo('${k}')"]`;
const CELL={cb:'Pagas la prima y tienes el derecho a comprar al strike. Ganas en neto si la acción acaba por encima del strike más la prima. Pierdes como mucho la prima. Su línea: plana en −prima a la izquierda del strike y subiendo a su derecha.',
 pb:'Pagas la prima y tienes el derecho a vender al strike. Ganas en neto si la acción acaba por debajo del strike menos la prima. Pierdes como mucho la prima y ganas como mucho el strike menos la prima. Su línea: subiendo hacia la izquierda del strike y plana en −prima a su derecha.',
 cs:'Cobras la prima y te obligas a vender al strike si el comprador ejerce. Ganas como mucho la prima, si la acción acaba en el strike o por debajo. Si no tienes las acciones, la pérdida no tiene límite. Su línea: plana en +prima a la izquierda del strike y bajando a su derecha.',
 ps:'Cobras la prima y te obligas a COMPRAR al strike si el comprador ejerce. Ganas como mucho la prima, si la acción acaba en el strike o por encima. Pierdes como mucho el strike menos la prima, si la acción llega a 0 €. Su línea: bajando hacia la izquierda del strike y plana en +prima a su derecha.'};
const TAG=[[/^Caso real/i,'Pasó de verdad y se puede comprobar en la fuente que aparece al final.'],[/^Ilustrativo/i,'Los números están puestos para explicar el mecanismo: no es un hecho histórico.'],

 const tras=ev=>{if(!G||!G.modo||G.modo==='menu')return;const t=ev.target;if(t&&t.closest&&t.closest('#gLay,#gSheet'))return;setTimeout(refrescar,0)};
 document.addEventListener('input',tras);document.addEventListener('click',tras);
 addEventListener('resize',()=>{if(G&&G.modo==='menu')return;posBoton()});}
function posBoton(){const b=$g('gBtn');if(!b)return;b.classList.toggle('gMini',view.v==='beats'||view.v==='done'||view.v==='story'||view.v==='prac');const f=$g('foot'),up=f&&f.classList.contains('up'),tb=$g('tabbar');
 b.style.bottom=up?(f.offsetHeight+12)+'px':(tb?(tb.offsetHeight+12)+'px':'calc(16px + env(safe-area-inset-bottom, 0px))')}
function verBoton(){const b=$g('gBtn');if(!b)return;b.hidden=!!G;posBoton()}

function abrirMenu(prev){
 cerrarCapa();
 G={key:clave(),data:build(),i:0,modo:'menu',ult:(prev&&prev.ult)||null};
 verBoton();pintarMenu();
 $g('gShade').hidden=false;const sh=$g('gSheet');sh.classList.add('up');
 setTimeout(()=>{const b=sh.querySelector('.btn')||sh.querySelector('button');if(b)b.focus({preventScroll:true})},60)}
function pintarMenu(){
 const d=G.data,sh=$g('gSheet');sh.textContent='';
 const n=d.pasos.length;
 const donde=view.v==='beats'?`Lección ${view.id} · pantalla ${bi+1} de ${beatsOf(view.id).length}`:view.v==='story'?`Lección ${view.id} · historia de introducción`:(view.v==='home'?'Portada':view.v==='prac'?'Práctica':'Lección terminada');
 sh.append(h('div',{class:'gIn'},
  h('div',{class:'gHead'},h('div',null,h('p',{class:'gEy',text:donde}),h('h3',{class:'gTi',text:'¿Qué no entiendes?'})),
   h('button',{class:'gX',type:'button','aria-label':'Cerrar la guía',on:{click:cerrarTodo}},'×')),
  n?h('button',{class:'btn wide',type:'button',on:{click:()=>tour(0)}},`Explícame la pantalla paso a paso (${n})`):null,
  d.otra?h('button',{class:'btn ghost wide',type:'button',on:{click:()=>uno({t:'Dicho de otra forma',x:d.otra})}},'Dímelo de otra forma'):null,
  d.dudas.length?h('p',{class:'gSub',text:'Dudas frecuentes aquí'}):null,
  d.dudas.length?h('div',{class:'gChips'},d.dudas.map(z=>h('button',{class:'chip',type:'button',on:{click:()=>responderDuda(z)}},z.q))):null,
  h('form',{class:'gForm',on:{submit:ev=>{ev.preventDefault();preguntar($g('gQ').value)}}},
   h('label',{for:'gQ',class:'gSub'},'O escríbela con tus palabras'),
   h('div',{class:'gRow'},h('input',{id:'gQ',name:'gQ',type:'text',maxlength:'140',autocomplete:'off',placeholder:'Por ejemplo: ¿qué es la prima?'}),
    h('button',{class:'btn',type:'submit'},'Buscar'))),
  h('div',{id:'gAns','aria-live':'polite'}),
  h('p',{class:'gNote',text:'Respuestas preparadas y revisadas para cada pantalla de este curso. No es un chat: no inventa nada y no necesita ninguna cuenta.'})));
 if(G.ult)mostrarRespuesta(G.ult)}
function mostrarRespuesta(r){
 G.ult=r;const box=$g('gAns');if(!box)return;box.textContent='';
 const card=h('div',{class:'gCard'},h('b',{text:r.t}),h('p',{text:r.x}),
  r.l&&view.v==='beats'&&r.l!==view.id?h('p',{class:'gMeta',text:`Se explica en la Lección ${r.l}.`}):null,
  r.fuera?h('p',{class:'gMeta',text:'Queda fuera de este curso de iniciación.'}):null,
  r.pi!=null?h('button',{class:'btn gold',type:'button',on:{click:()=>tour(r.pi)}},'Señálamelo en la pantalla'):null,
  r.tour?h('button',{class:'btn',type:'button',on:{click:()=>tour(0)}},'Empezar el recorrido'):null);
 box.append(card);
 if(r.alts&&r.alts.length)box.append(h('p',{class:'gSub',text:'¿Buscabas otra cosa?'}),h('div',{class:'gChips'},r.alts.map(a=>h('button',{class:'chip',type:'button',on:{click:()=>abrirEntrada(a)}},a.q))));
 if(box.scrollIntoView)box.scrollIntoView({block:'nearest'})}
function pasoDe(cid){return G.data.pasos.findIndex(p=>p.s&&p.c.includes(cid))}
function responderConcepto(c,alts){
 const i=pasoDe(c.id);
 if(i>=0){const p=G.data.pasos[i];uno({t:c.t,x:c.d,s:p.s,i:p.i,fb:p.fb,aqui:'En esta pantalla: '+p.t});return}
 mostrarRespuesta({t:c.t,x:c.d,l:c.l,fuera:c.fuera,alts})}
function responderDuda(z){if(z.cid){responderConcepto(CBY[z.cid]);return}mostrarRespuesta({t:z.q,x:z.a})}
function abrirEntrada(x,alts){
 if(x.kind==='c')responderConcepto(x.c,alts);
 else if(x.kind==='p')tour(x.i);
 else mostrarRespuesta({t:x.z.q,x:x.z.a,alts})}
function preguntar(q){
 q=String(q||'').trim();if(!q)return;
 const r=buscar(q,G.data);
 if(r.gen){mostrarRespuesta({t:'Vamos paso a paso',x:'Te enseño la pantalla elemento por elemento, con flechas. Cuando algo concreto no te encaje, vuelve aquí y escríbelo.',tour:true});return}
 if(r.nada){guardar(q);mostrarRespuesta({t:'Todavía no tengo esa respuesta',x:'He guardado tu duda en este dispositivo para que se pueda mejorar la guía. Mientras tanto, prueba con el recorrido de la pantalla o con otras palabras: «prima», «strike», «vencimiento», «¿por qué pierdo?».',tour:G.data.pasos.length>0,
  alts:G.data.dudas.slice(0,3).map(z=>z.cid?{kind:'c',c:CBY[z.cid],q:z.q}:{kind:'d',z,q:z.q})});return}
 const [p,...rest]=r.top;abrirEntrada(p,rest)}

function tour(i){G.modo='tour';G.i=Math.max(0,Math.min(i,G.data.pasos.length-1));cerrarHoja();mostrar(true)}
function uno(r){G.modo='uno';G.uno=r;cerrarHoja();mostrar(true)}
function ir(k){if(!G||G.modo!=='tour')return;const n=G.data.pasos.length;if(k<0||k>=n)return;G.i=k;mostrar(true)}
function actual(){return G.modo==='tour'?G.data.pasos[G.i]:G.uno}
function hudAlto(){const h1=document.querySelector('.hud');return h1?h1.getBoundingClientRect().height:0}
function mostrar(scroll){
 if(!G)return;const lay=$g('gLay');lay.hidden=false;verBoton();
 const p=actual();if(!p){cerrarTodo();return}
 const el=res(p);
 if(el&&scroll){const r=el.getBoundingClientRect(),top=hudAlto()+10;
  if(r.top<top||r.bottom>innerHeight-24)el.scrollIntoView({block:r.height>innerHeight*.6?'start':'center',behavior:reduce()?'auto':'smooth'})}
 pintarTip(p);pintarMarcas();bucle()}
function pintarTip(p){
 const tip=$g('gTip');tip.textContent='';
 const tr=G.modo==='tour',n=G.data.pasos.length;
 tip.append(h('button',{class:'gTx',type:'button','aria-label':'Cerrar la guía',on:{click:cerrarTodo}},'×'));
 if(tr)tip.append(h('span',{class:'gC',text:`Paso ${G.i+1} de ${n}`}));
 tip.append(h('span',{class:'gT',text:p.t}),h('span',{class:'gTxt',text:p.x}));
 if(p.aqui)tip.append(h('span',{class:'gAq',text:p.aqui}));
 const nav=h('div',{class:'gNav'});
 nav.append(h('button',{class:'gB2 gFirst',type:'button',on:{click:()=>abrirMenu(G)}},tr?'Otra duda':'Volver a la guía'));
 if(tr&&G.i>0)nav.append(h('button',{class:'gB2',type:'button','aria-label':'Paso anterior',on:{click:()=>ir(G.i-1)}},'‹'));
 nav.append(tr&&G.i<n-1?h('button',{class:'gB1',type:'button',on:{click:()=>ir(G.i+1)}},'Siguiente ›'):h('button',{class:'gB1',type:'button',on:{click:cerrarTodo}},'Entendido'));
 tip.append(nav);
 setTimeout(()=>{const b=tip.querySelector('.gB1');if(b&&G&&G.modo!=='menu')b.focus({preventScroll:true})},30)}
function pintarMarcas(){const m=$g('gMarks');m.textContent='';if(G.modo!=='tour')return;
 G.data.pasos.forEach((p,k)=>{if(!p.s)return;const b=h('button',{class:'gMk',type:'button','aria-label':`Paso ${k+1}: ${p.t}`,on:{click:()=>ir(k)}},String(k+1));b.dataset.k=k;m.append(b)})}
function ancla(el){
 const r=el.getBoundingClientRect();
 try{const g=el.tagName&&el.tagName.toLowerCase()==='g'?el.querySelector('polyline'):(el.tagName&&el.tagName.toLowerCase()==='polyline'?el:null);
  if(g&&g.getTotalLength&&g.getScreenCTM){const L=g.getTotalLength(),pt=g.getPointAtLength(L*0.8),m=g.getScreenCTM();return{x:pt.x*m.a+pt.y*m.c+m.e,y:pt.x*m.b+pt.y*m.d+m.f,c:1}}}catch(e){}
 if(r.height<12&&r.width>100)return{x:r.right-12,y:r.top+r.height/2,c:1};
 return{x:r.left,y:r.top,c:0}}
function set(e,o){Object.keys(o).forEach(k=>{e.style[k]=Math.round(o[k])+'px'})}
function colocar(){
 if(!G||!G.modo||G.modo==='menu')return;
 const p=actual(),el=res(p),tip=$g('gTip'),hole=$g('gHole'),dim=$g('gDim'),W=innerWidth,H=innerHeight;
 const blk=document.querySelectorAll('#gLay .gBlk');
 const tw=Math.min(340,W-24);tip.style.width=tw+'px';
 const th=tip.offsetHeight;
 if(el){
  const r=caja(el);hole.hidden=false;dim.hidden=true;
  set(hole,{left:r.l,top:r.t,width:r.w,height:r.h});
  set(blk[0],{left:0,top:0,width:W,height:Math.max(0,r.t)});
  set(blk[1],{left:0,top:r.t+r.h,width:W,height:Math.max(0,H-r.t-r.h)});
  set(blk[2],{left:0,top:r.t,width:Math.max(0,r.l),height:r.h});
  set(blk[3],{left:r.l+r.w,top:r.t,width:Math.max(0,W-r.l-r.w),height:r.h});
  const bajo=H-(r.t+r.h),alto=r.t;let top,cl;
  if(bajo>=th+20){top=r.t+r.h+12;cl='below'}else if(alto>=th+20){top=r.t-12-th;cl='above'}else{top=Math.max(8,H-th-10);cl='mid'}
  let left=r.l+r.w/2-tw/2;left=Math.max(12,Math.min(left,W-tw-12));
  set(tip,{left,top});tip.className='gTip '+cl;
  tip.style.setProperty('--ax',Math.round(Math.max(20,Math.min(tw-20,r.l+r.w/2-left)))+'px');
 }else{
  hole.hidden=true;dim.hidden=false;blk.forEach(b=>set(b,{width:0,height:0}));
  set(tip,{left:(W-tw)/2,top:Math.max(12,(H-th)/2)});tip.className='gTip mid'}
 const used=[];
 document.querySelectorAll('#gMarks .gMk').forEach(mk=>{const k=+mk.dataset.k,e2=res(G.data.pasos[k]);
  if(!e2){mk.hidden=true;return}
  const r=e2.getBoundingClientRect();if(r.bottom<0||r.top>H||r.right<0||r.left>W){mk.hidden=true;return}
  const a=ancla(e2);let x=Math.max(4,Math.min(a.x-(a.c?12:10),W-28)),y=Math.max(4,Math.min(a.y-(a.c?12:10),H-28));
  for(let t=0;t<8&&used.some(u=>Math.abs(u[0]-x)<24&&Math.abs(u[1]-y)<24);t++)x=x+24>W-28?4:x+24;
  used.push([x,y]);mk.hidden=false;mk.style.left=x+'px';mk.style.top=y+'px';mk.classList.toggle('on',k===G.i)})}
function bucle(){if(!G||G.raf)return;const f=()=>{if(!G||!G.modo||G.modo==='menu'){if(G)G.raf=0;return}colocar();G.raf=requestAnimationFrame(f)};G.raf=requestAnimationFrame(f)}
function refrescar(){
 if(!G||!G.modo)return;
 if(G.key!==clave()){cerrarTodo();return}
 if(G.modo==='menu')return;
 const id=G.modo==='tour'&&G.data.pasos[G.i]?G.data.pasos[G.i].id:null;
 G.data=build();
 if(G.modo==='tour'){if(!G.data.pasos.length){cerrarTodo();return}
  const j=id?G.data.pasos.findIndex(p=>p.id===id):-1;G.i=j>=0?j:Math.min(G.i,G.data.pasos.length-1)}
 pintarTip(actual());pintarMarcas()}
function cerrarHoja(){const sh=$g('gSheet');if(sh)sh.classList.remove('up');const s=$g('gShade');if(s)s.hidden=true}
function cerrarCapa(){const l=$g('gLay');if(l)l.hidden=true;if(G&&G.raf){cancelAnimationFrame(G.raf);G.raf=0}}
function cerrarTodo(){cerrarCapa();cerrarHoja();G=null;verBoton();const b=$g('gBtn');if(b&&!b.hidden)b.focus({preventScroll:true})}

/* ---------- sección de dudas guardadas en la portada ---------- */
function seccionDudas(){
 if(view.v!=='home')return;const a=guardadas(),app=$g('app'),host=$g('dudasHost');if(!a.length||!app||!host||app.querySelector('.gDudas'))return;
 const txt=a.map(z=>`${z.fecha} · ${z.donde} · ${z.q}`).join('\n');
 const sec=h('div',{class:'gloss gDudas'},h('h3',null,'Dudas sin respuesta',h('em',{text:String(a.length)})),
  h('p',{class:'hint',text:'La guía no supo responderlas. Se guardan solo en este dispositivo. Si quieres ayudar a mejorar el curso, cópialas y envíaselas a quien te lo pasó.'}),
  h('pre',{class:'gPre',id:'gPre',text:txt}),
  h('div',{class:'gRow'},h('button',{class:'btn ghost',type:'button',on:{click:ev=>copiar(txt,ev.currentTarget)}},'Copiar'),
   h('button',{class:'btn ghost',type:'button',on:{click:()=>{try{localStorage.removeItem(DK)}catch(e){}render()}}},'Borrar')));
 host.append(sec)}
function copiar(t,btn){
 const sel=()=>{const pre=$g('gPre');if(pre&&window.getSelection){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r)}btn.textContent='Seleccionado: cópialo'};
 try{navigator.clipboard.writeText(t).then(()=>{btn.textContent='Copiado'},sel)}catch(e){sel()}}

/* ---------- enganches con la app ---------- */
window.gHook=function(){montar();seccionDudas();if(G&&G.key!==clave())cerrarTodo();else if(G)refrescar();verBoton()};
window.gFoot=function(){posBoton();if(G&&G.modo&&G.modo!=='menu')setTimeout(refrescar,0)};
window.__guia={build,crudo,ir:k=>ir(k),buscar:q=>buscar(q,build()),abrirMenu,tour:i=>{if(!G||G.modo==='menu'){G={key:clave(),data:build(),i:0,modo:'tour'}}tour(i)},preguntar:q=>{abrirMenu();preguntar(q)},cerrar:()=>cerrarTodo(),estado:()=>G,GX,CI};
try{document.documentElement.lang='es'}catch(e){}
window.gHook();
})();
</script>
