 strike:10000,prima:500,dn:8000,upx:11000,
 after:'El contrato es exactamente el mismo. Lo que decide si es especulación o cobertura no está en la opción: está en si quien la compra tiene algo que proteger, un activo que ya tiene o una compra o venta que tendrá que hacer.'},
{"t":"sandbox","id":"S14","modulo":3,"leccion":9,"tag":"Ilustrativo","kicker":"Aquí no hay una respuesta única","q":"Una apuesta por unos resultados.","sub":"Este escenario no puntúa: ninguna decisión resta vidas.","ctx":"Una empresa del Ibex presenta mañana sus resultados y tú crees que serán mucho mejores de lo que espera el mercado. No tienes sus acciones. Hoy cotizan a 100 €.","spot":10000,"call":{"strike":10000,"prima":500},"put":{"strike":10000,"prima":500},"final":11500,"expo":0,"noOperar":"neutral","mult":100,"unidad":"acción","score":false,"best":"none","lesson":"La acción subió a 115 €. La Call comprada da 15 € al ejercer menos 5 € de prima: +10 € por acción, 1.000 € por contrato, un +200 % sobre lo pagado. La Put comprada pierde su prima: −5 € (500 €). No operar: 0 €.","after":"No puntúa, aunque la Call comprada ganara. Adivinar cómo reaccionará el mercado a unos resultados no es una decisión con respuesta correcta: si la acción no se hubiera movido, la Call comprada habría perdido el 100 % de la prima. Un buen resultado no demuestra una buena decisión."},
{t:'case',kicker:'Lo que dice un manual universitario',tag:'Cita',
 p:'Lamothe y Pérez Somalo resumen así los dos usos en su manual universitario. Sobre la cobertura: «con una opción transferimos el riesgo de pérdida, pero mantenemos las posibilidades de beneficio». Sobre la especulación: «especulando con opciones limitamos las pérdidas a la prima y dejamos abiertas todas las posibilidades de beneficio si acertamos en la evolución de los precios». Ojo con la segunda frase: limitar la pérdida a la prima no la hace pequeña. Si el precio no se mueve a tu favor, pierdes el 100 % de lo pagado.',
 src:'P. Lamothe y M. Pérez Somalo, «Opciones financieras y productos estructurados», 2.ª ed., McGraw-Hill, 2003, cap. 2',
 after:'Especulación: comprar una opción sin tener nada que proteger, para beneficiarse de un movimiento. Cobertura: comprarla para limitar la pérdida de algo que ya se tiene o que se tendrá que comprar o vender.'},
{t:'quiz',q:'Ya tienes acciones y compras una Put para limitar tu pérdida si caen. ¿Qué estás haciendo?',
 opts:['Especular a la baja','Cubrir una posición','Vender opciones','Apalancarte'],ok:1,
 why:'Tienes el activo, así que la Put comprada compensa las pérdidas de tus acciones en lugar de apostar por ellas. Eso es cobertura.'},
{t:'quiz',q:'Una acción cotiza a 100 €. ¿Con qué pones menos dinero para beneficiarte de la subida de 100 acciones?',
 opts:['Comprando las 100 acciones (10.000 €)','Comprando una Call de strike 100 € (500 € de prima)','Es lo mismo','Depende del bróker'],ok:1,
 why:'Con la Call comprada pagas 500 € de prima en vez de 10.000 €. Aun así, tu resultado depende de 100 acciones que valen 10.000 €: los porcentajes sobre lo pagado se multiplican, a favor y en contra, y puedes perder el 100 % de lo pagado.'},
{"t":"sandbox","id":"S15","modulo":3,"leccion":9,"tag":"Ilustrativo","kicker":"Decides tú · el caso de Paula","q":"El seguro que no se usa.","sub":"Elige antes de ver el resultado.","ctx":"Paula tiene 100 acciones que hoy valen 100 €. En marzo las venderá para pagar la entrada de un piso y no puede perder más de 5 € por acción hasta entonces, contando lo que pague por protegerse.","spot":10000,"call":{"strike":10000,"prima":500},"put":{"strike":10000,"prima":500},"final":11500,"expo":1,"noOperar":"error","mult":100,"unidad":"acción","score":true,"best":"put","lesson":"La acción subió a 115 €. La Put comprada no se ejerce y cuesta su prima: Paula gana 15 € con las acciones y paga 5 €: +10 € por acción (1.000 € por contrato). Sin operar, +15 € (1.500 €). Con la Call comprada, +25 € (2.500 €): las acciones y la Call comprada ganan a la vez.","after":"La Call comprada dio más, pero no protegía nada y aumentaba la pérdida: si la acción hubiera caído a 80 €, Paula habría perdido 25 € por acción (20 € de las acciones y 5 € de prima) justo antes de comprar su piso. Con la Put comprada no podía perder más de 5 €. Pagar un seguro que al final no se usa no es un error."},
{"t":"sandbox","id":"S13","modulo":3,"leccion":9,"tag":"Ilustrativo","kicker":"Acertar no basta","q":"Una previsión más pequeña que la prima.","sub":"Elige antes de ver el resultado.","ctx":"Óscar no tiene acciones de esta empresa. Cree que en tres meses bajará, pero como mucho 5 €, desde los 100 € de hoy.","spot":10000,"call":{"strike":10000,"prima":500},"put":{"strike":10000,"prima":500},"final":9500,"expo":0,"noOperar":"neutral","mult":100,"unidad":"acción","score":true,"best":"none","por":"Óscar no tenía nada que proteger. Con su previsión (como mucho 5 € de bajada), la Put comprada daba como máximo 0 € y la Call comprada solo ganaba si la acción subía más de 5 €, lo contrario de lo que esperaba: las dos arriesgaban la prima sin nada que ganar.","lesson":"Óscar acertó del todo: la acción bajó justo 5 €, a 95 €. Aun así, la Put comprada da 5 € al ejercer menos 5 € de prima: 0 €. La Call comprada pierde su prima: −5 € por acción (500 € por contrato). No operar: 0 €.","after":"Antes de comprar una opción, compara el movimiento que esperas con la prima: si no la supera, no hay nada que ganar."},
{"t":"sandbox","id":"S24","modulo":3,"leccion":9,"tag":"Ilustrativo","kicker":"Decides tú · el caso de Álex","q":"Apalancamiento con el dinero del alquiler.","sub":"Elige antes de ver el resultado.","ctx":"Álex no tiene acciones de esta empresa. Tiene 500 € ahorrados que necesita para el alquiler dentro de tres meses y cree que la acción, hoy a 100 €, subirá. Un contrato de Call de strike 100 € cuesta justo 500 € (5 € por acción, 100 acciones).","spot":10000,"call":{"strike":10000,"prima":500},"put":{"strike":10000,"prima":500},"final":9000,"expo":0,"noOperar":"neutral","mult":100,"unidad":"acción","score":true,"best":"none","por":"Álex no tenía nada que proteger y esos 500 € eran los del alquiler: comprar cualquier opción era arriesgarlos enteros, acertara o no la dirección.","lesson":"La acción bajó a 90 €. La Call comprada no se ejerce: Álex pierde los 500 €, el 100 % de lo pagado y el alquiler. La Put comprada gana 5 € por acción: +500 €, un +100 %, en contra de lo que él mismo esperaba. No operar: 0 €.","after":"Con 500 € de prima, el resultado de Álex dependía de 100 acciones que valen 10.000 €. Eso multiplica los porcentajes a favor y en contra. Con un dinero que no puede perder, la decisión era no operar, acertara o no."},
{t:'pair',kicker:'Quién compra qué',q:'Quien comprará se protege con una Call comprada. Quien venderá, con una Put comprada.',
 sub:'Una harinera y un agricultor dependen del mismo precio del trigo, pero con riesgos opuestos. Toca cada uno.',
 a:{role:'QUIEN COMPRARÁ: HARINERA',word:'Teme que suba: Call comprada',hint:'Tocar para ver',txt:'Le perjudica que el precio suba, porque pagará más. La Call comprada le da derecho a comprar al strike: si el precio sube, la usa; si baja, compra más barato en el mercado. ¿Por qué no una Put comprada? Porque gana cuando el precio baja, justo cuando la harinera ya sale ganando al comprar más barato. Si el precio sube, la Put no le da nada: pagaría la prima y además el precio alto.'},
 b:{role:'QUIEN VENDERÁ: AGRICULTOR',word:'Teme que baje: Put comprada',hint:'Tocar para ver',txt:'Le perjudica que el precio baje, porque cobrará menos. La Put comprada le da derecho a vender al strike: si el precio baja, la usa; si sube, vende más caro en el mercado. ¿Por qué no una Call comprada? Porque gana cuando el precio sube, justo cuando el agricultor ya gana al vender más caro. Si baja, perdería con la cosecha y además la prima.'},
 after:'La regla: compra la opción que gana justo cuando tú pierdes. Si tu riesgo es que el precio suba, Call comprada; si es que baje, Put comprada. Comprar la contraria no protege: es apostar dos veces en la misma dirección y quedarte sin protección en la otra.'},
{t:'stack',kicker:'Tres formas de afrontar un precio',q:'No cubrirse, fijar el precio o comprar una opción.',
 sub:'Una empresa que comprará o venderá algo dentro de unos meses tiene tres caminos. Toca cada uno.',
 items:[
  {ic:'<svg class=ei data-i=dice-five aria-hidden=true><use href=#i-dice-five></use></svg>',b:'No cubrirse',p:'No pagas nada y aceptas el precio que haya ese día. Si el precio va a tu favor, te quedas todo el movimiento; si va en contra, lo sufres entero. Tiene sentido si puedes asumir el peor caso.'},
  {ic:'<svg class=ei data-i=lock-key aria-hidden=true><use href=#i-lock-key></use></svg>',b:'Fijar el precio con un futuro o un swap',p:'Un contrato que fija hoy el precio y obliga a las dos partes: ninguna puede echarse atrás sin pagar lo que pierda el contrato. No hay prima. Te protege si el precio va en contra, pero te quita lo que ganarías si va a favor, y te obliga aunque al final ya no necesites comprar o vender. En un futuro, además, las dos partes depositan garantías: dinero que exige el mercado mientras el contrato está vivo y que hay que aumentar si el precio va en contra. Verás el futuro en la Lección 12.'},
  {ic:'<svg class=ei data-i=shield-check aria-hidden=true><use href=#i-shield-check></use></svg>',b:'Comprar una opción',p:'Pagas una prima por adelantado y te aseguras un precio máximo de compra (Call comprada: strike + prima) o un precio mínimo de venta (Put comprada: strike − prima). Si el precio va a tu favor, no usas el derecho y lo aprovechas, menos la prima. Solo se obliga quien te la vende; tú no depositas garantías.'}],
 after:'Ninguna es la mejor siempre. Fijar el precio no cuesta prima, pero te obliga pase lo que pase. La opción comprada cuesta la prima, pero te deja libre si el precio va a tu favor. En la Lección 10 las compararás con números y con casos reales.'}
]},

10:{title:'Proteger una cartera, un combustible o una cosecha',beats:[
{t:'hedge',kicker:'Lo mismo, a escala de cartera',
 q:'Proteger una cartera que replica el Ibex.',
 sub:'Tu cartera vale 20.000 € y replica el Ibex 35, que suponemos en 20.000 puntos (cifra redonda para calcular). Para protegerla compras una Put Mini IBEX de MEFF, en la que cada punto del índice vale 1 €: un contrato equivale a tu cartera. Strike 20.000 puntos, prima 600 puntos (600 €). Cuatro retos debajo, con los importes ocultos.',
 cost:2000000,strike:2000000,prima:60000,min:1500000,max:2300000,barMax:500000,step:10000,
 retos:[
  {q:'Coloca el nivel del Ibex en el que la cartera sin cubrir y la cartera con la Put comprada dan el mismo resultado.',eq:1940000,
   mal:'El reto pide el nivel en el que las dos barras quedan a la misma altura.',
   pista:'Con la Put comprada, lo peor es −600 €. ¿Cuántos puntos tiene que caer el índice para que la cartera sin cubrir pierda eso?',
   why:'En 19.400 puntos: sin cubrir, la cartera pierde 600 € (1 € por punto); con la Put comprada, −600 € de la cartera, +600 € al ejercer (20.000 − 19.400) y −600 € de prima: −600 €. Por debajo de 19.400, la Put compensa; por encima, pesa más la prima.'},
  {q:'Coloca un nivel por debajo del strike en el que, aun así, la cartera sin cubrir salga mejor.',gt:1940000,lt:2000000,
   mal:'El reto pide un nivel por debajo de 20.000 puntos en el que la barra izquierda quede por encima de la derecha.',
   pista:'Por debajo del strike la Put se ejerce, pero ¿da lo suficiente para pagar los 600 € de prima?',
   why:'Entre 19.400 y 20.000 puntos la Put está dentro del dinero, pero da menos de 600 €. En 19.700: sin cubrir, −300 €; con la Put, −300 € + 300 € − 600 € = −600 €. Ese tramo es parte de lo que cuesta asegurarse contra las caídas grandes.'},
  {q:'Coloca el nivel en el que la cartera con la Put comprada gana 1.000 €.',eq:2160000,
   mal:'El reto pide +1.000 € en la barra derecha.',
   pista:'Si el índice sube, la Put no se ejerce: ganas lo que sube la cartera menos los 600 € de prima.',
   why:'En 21.600 puntos la cartera gana 1.600 € y la Put, que no se ejerce, costó 600 €: +1.000 €. Sin la Put habrías ganado 1.600 €. Con la protección, cuando el mercado sube siempre ganas 600 € menos.'},
  {q:'Coloca el nivel en el que la cartera sin cubrir pierde 3.000 €. Después, mira cuánto pierde la cartera cubierta.',eq:1700000,
   mal:'El reto pide −3.000 € en la barra izquierda: 1 € por cada punto que cae el índice desde 20.000.',
   pista:'Cada punto de caída es 1 €. ¿Cuántos puntos son 3.000 €?',
   why:'En 17.000 puntos, sin cubrir, −3.000 €. Con la Put comprada: −3.000 € de la cartera, +3.000 € al ejercer y −600 € de prima: −600 €, lo mismo que en 19.000 o en 15.000. Esa es la protección: la pérdida deja de crecer.'}],

 ttl:'Cartera de 20.000 € · Put comprada: strike 20.000 puntos, prima 600 puntos',
 labelA:'Cartera sin cobertura',labelB:'Cartera + Put comprada',
 floorTxt:'mínimo<br>−600 €',
 note:'El Ibex acaba en <b>{P}</b> puntos el día del vencimiento',
 unit:'pts',
 after:'Sin la Put, la cartera pierde 1 € por cada punto que cae el índice. Con la Put comprada, el resultado nunca baja de −600 €, la prima. Funciona así porque tu cartera replica el índice: si fuera distinta del Ibex, la Put Mini IBEX solo la protegería de forma aproximada.'},
{t:'stack',kicker:'Elegir el precio de ejercicio',q:'Un strike más bajo cuesta menos prima y protege menos.',
 sub:'La misma cartera de 20.000 €. Compara dos Puts compradas con cifras ilustrativas. Toca cada una.',
 items:[
  {ic:'<svg class=ei data-i=shield-check aria-hidden=true><use href=#i-shield-check></use></svg>',b:'Put de strike 20.000 · prima 600 €',p:'Protege desde el primer punto de caída. Resultado mínimo: −600 €, la prima. Es el 3 % de la cartera.'},
  {ic:'<svg class=ei data-i=receipt aria-hidden=true><use href=#i-receipt></use></svg>',b:'Put de strike 19.000 · prima 300 €',p:'Cuesta la mitad, pero solo paga por debajo de 19.000 puntos: la caída de 20.000 a 19.000, 1.000 €, la asumes tú. Resultado mínimo: −1.000 € − 300 € = −1.300 €, el 6,5 % de la cartera.'}],
 after:'Con una Put comprada, el resultado mínimo de la cartera es: (strike − valor inicial) − prima. Elegir el strike es decidir cuánta caída asumes tú y cuánto pagas por proteger el resto.'},
{t:'case',kicker:'Un ejemplo del manual oficial',tag:'Ilustrativo · ejemplo del manual de MEFF',
 p:'El manual básico de MEFF usa este ejemplo: cartera equivalente a 8.900 puntos, Put sobre el Mini IBEX de strike 8.500 comprada por 63 puntos, e índice que acaba en 8.300; cada punto vale 1 €. Sin cobertura se pierden 600 €. Con la Put comprada: la cartera pierde 600 € y la Put gana 200 € (8.500 − 8.300) menos 63 € de prima, +137 €: total −463 €. El manual da −493 €, pero la cuenta correcta es −463 €.',
 src:'MEFF, «Manual básico para operar con opciones», página 16 del PDF (la pérdida de 493 €) · especificaciones del Mini IBEX 35',
 after:'Recalcula siempre, incluso lo que viene de una fuente oficial.'},
{t:'quiz',q:'Compras una Put sobre el índice con strike por debajo del valor actual de tu cartera. ¿Qué estás limitando?',
 opts:['La ganancia máxima','La pérdida máxima si el mercado cae','Las comisiones','La volatilidad del índice'],ok:1,
 why:'Por debajo del strike, la Put comprada compensa lo que pierde la cartera: tu pérdida deja de crecer.'},
{t:'quiz',q:'El índice sube y tu Put no se ejerce. ¿Qué has pagado?',
 opts:['Nada: se devuelve la prima','La prima, igualmente','Solo la mitad','Una comisión de cancelación'],ok:1,
 why:'La prima se paga siempre, se use o no la protección, igual que la cuota de un seguro sin siniestros.'},
{t:'quiz',q:'Cartera de 20.000 € que replica el Ibex (20.000 puntos). Put comprada de strike 19.000 por 300 €. El Ibex cae a 16.000. ¿Resultado total?',
 opts:['−4.000 €','−1.300 €','−300 €','+1.700 €'],ok:1,
 why:'Cartera: −4.000 €. Put: 19.000 − 16.000 = +3.000 €, menos 300 € de prima: +2.700 €. Total: −1.300 €, el mínimo de esa protección.'},
{"t":"sandbox","id":"S18","modulo":3,"leccion":10,"tag":"Ilustrativo","kicker":"Ahora decides tú","q":"Una caída fuerte con la cartera cubierta.","sub":"Elige antes de ver el resultado. Cada punto vale 1 €.","ctx":"Tu cartera vale 20.000 € y replica el Ibex 35, que suponemos en 20.000 puntos. Hasta el vencimiento no puedes perder más de 1.500 €. Hay una Put Mini IBEX de strike 19.000 con prima de 300 puntos (300 €).","spot":2000000,"call":{"strike":2000000,"prima":60000},"put":{"strike":1900000,"prima":30000},"final":1720000,"expo":1,"noOperar":"error","mult":1,"unidad":"punto","score":true,"best":"put","lesson":"El índice cayó a 17.200 puntos. La cartera pierde 2.800 €. La Put comprada da 1.800 € al ejercer (19.000 − 17.200), menos 300 € de prima: +1.500 €. Total: −1.300 €. Sin operar: −2.800 €. Con la Call comprada (strike 20.000, prima 600): −3.400 €.","after":"−1.300 € es el mínimo de esta protección: la caída de 20.000 a 19.000 puntos, 1.000 €, no está cubierta y la asumes tú; los otros 300 € son la prima. Con el índice en 15.000, el resultado habría sido el mismo: por debajo de 19.000, la pérdida deja de crecer."},
{t:'cob3',kicker:'Cobertura de empresa, con números',q:'Una aerolínea y su combustible: tres decisiones.',
 sub:'Comprará queroseno dentro de tres meses. Hoy cuesta 800 € por tonelada. Puede no cubrirse, fijar hoy 800 € con un futuro o un swap, o comprar una Call de strike 800 € pagando 40 € de prima. Cifras ilustrativas. Cinco retos debajo, con los importes ocultos.',
 lado:'compra',spot:80000,strike:80000,prima:4000,min:60000,max:100000,step:1000,opt:'Call comprada',
 ttl:'Queroseno · hoy 800 €/t · Call comprada: strike 800 €, prima 40 €',
 note:'El queroseno acaba en <b>{P}</b> por tonelada',
 retos:[
  {q:'Coloca el precio en el que la Call comprada y el futuro le cuestan lo mismo.',eq:76000,
   mal:'El reto pide el precio en el que las barras del futuro y de la Call comprada quedan a la misma altura.',
   pista:'Con el futuro paga 800 €. Con la Call comprada, si el precio baja, compra en el mercado y suma 40 € de prima.',
   why:'A 760 €: con el futuro paga 800 €; con la Call comprada no ejerce, compra a 760 € y suma 40 € de prima: 800 €. Por encima de 760 €, el futuro sale más barato, porque no tiene prima.'},
  {q:'Coloca un precio en el que el futuro le sale MÁS CARO que la Call comprada.',lt:76000,
   mal:'El reto pide la barra del futuro por debajo de la de la Call comprada.',
   pista:'El futuro obliga a pagar 800 € aunque el mercado esté más barato. ¿Cuándo pesa más esa obligación que los 40 € de prima?',
   why:'Por debajo de 760 €. A 650 €: con el futuro sigue pagando 800 €, 150 € más que el mercado; con la Call comprada compra a 650 € y suma 40 €: 690 €. Y si ya no necesitara el combustible, el futuro le seguiría haciendo pagar esos 150 € sin darle nada a cambio: algo parecido le pasó a IAG en 2020, como verás en la pantalla siguiente.'},
  {q:'Coloca el precio en el que la Call comprada y no cubrirse le cuestan lo mismo.',eq:84000,
   mal:'El reto pide el precio en el que las barras «Sin cubrirse» y «Call comprada» quedan a la misma altura.',
   pista:'Con la Call comprada, lo máximo que paga es 800 € + 40 €.',
   why:'A 840 €: sin cubrirse paga 840 €; con la Call comprada ejerce, compra a 800 € y suma 40 €: también 840 €. Es el punto muerto de la Call comprada, strike más prima. Por encima, la Call comprada sale más barata: cada euro que sube el queroseno es un euro que se ahorra.'},
  {q:'Coloca un precio en el que no cubrirse habría sido lo más barato de las tres.',lt:80000,
   mal:'El reto pide la barra «Sin cubrirse» por encima de las otras dos.',
   pista:'Sin cubrirse no paga prima ni se compromete a nada. ¿Hacia dónde tiene que ir el precio para que eso sea lo mejor?',
   why:'Por debajo de 800 €, el precio de hoy. Si el queroseno baja, quien no se cubrió paga el precio de mercado; con la Call comprada paga eso más 40 € de prima, y con el futuro, 800 €. Cubrirse cuesta dinero justo cuando el precio va a favor.'},
  {q:'Coloca el precio en el que, sin cubrirse, pagaría 150 € más que hoy. Después, mira cuánto paga con la Call comprada.',eq:95000,
   mal:'El reto pide −150 € en la barra «Sin cubrirse».',
   pista:'Hoy cuesta 800 €.',
   why:'A 950 €: sin cubrirse paga 950 €; con la Call comprada, 840 €, lo máximo posible; con el futuro, 800 €. Si el queroseno subiera a 1.000 €, la Call comprada seguiría en 840 €.'}],
 after:'Ninguna de las tres gana en todos los precios: si el queroseno baja, gana no cubrirse; si sube, el futuro. La Call comprada no es la mejor en ningún precio concreto, pero es la única que pone un máximo sin renunciar a las bajadas: paga como mucho 840 € y, si el precio baja, también lo aprovecha. Sin cubrirse, lo que paga no tiene límite si el precio sube; con el futuro paga 800 € aunque el mercado esté a 600 €, y queda obligada aunque ya no necesite el combustible.'},
{t:'case',kicker:'Lo que le pasó a IAG en 2020',tag:'Caso real',
 p:'IAG, el grupo de Iberia, Vueling, British Airways y Aer Lingus, cubría el precio de buena parte de su combustible con contratos firmados con meses, e incluso años, de antelación. En 2020 la pandemia dejó los aviones en tierra y el queroseno se hundió. IAG tenía coberturas para un combustible que ya no iba a comprar: con el precio hundido, esas coberturas perdían valor y no había compras más baratas que lo compensaran. Registró una pérdida de 1.781 millones de euros por ellas (1.694 millones netos, tras una ganancia de 87 millones en coberturas de divisa asociadas). En mayo de 2021 cambió su política de cobertura, con un mayor uso de opciones de compra (Calls).',
 src:'IAG: resultados de 2020 (26 de febrero de 2021), de 2021 (febrero de 2022) y de 2025 (febrero de 2026)',
 after:'Con una Call comprada, si el combustible baja o ya no lo necesitas, lo máximo que pierdes es la prima. Hoy IAG explica que su política está pensada para poder responder a caídas bruscas de la demanda y a cambios fuertes del precio del combustible. Permite cubrir hasta el 75 % del combustible que prevé usar en los meses más próximos, cada vez menos después, hasta el 20 % en el tercer año, y usar Calls compradas para una parte de esa cobertura. Para 2026 tenía cubierto el 62 %.'},
{"t":"sandbox","id":"S19","modulo":3,"leccion":10,"tag":"Ilustrativo","kicker":"Ahora decides tú","q":"Cubrir una compra futura de combustible.","sub":"Elige antes de ver el resultado. Importes por tonelada.","ctx":"Una aerolínea comprará combustible dentro de tres meses. Hoy cuesta 700 € por tonelada y su presupuesto no admite pagar más de 735 €, contando lo que pague por protegerse. Hay opciones de strike 700 € con prima de 35 € por tonelada.","spot":70000,"call":{"strike":70000,"prima":3500},"put":{"strike":70000,"prima":3500},"final":82000,"expo":-1,"noOperar":"error","mult":1,"unidad":"tonelada","score":true,"best":"call","lesson":"El combustible subió a 820 €. Con la Call comprada, la aerolínea ejerce: paga 700 € más 35 € de prima, 735 € por tonelada, 35 € más que hoy. Sin operar, paga 820 €: 120 € más. Con la Put comprada pierde la prima y paga 820 €: 155 € más.","after":"Una Call comprada también es cobertura: la de quien tendrá que comprar y teme que suba. Si el combustible hubiera bajado, habría comprado más barato en el mercado y solo habría perdido la prima. Las cifras de este escenario son inventadas."},
{t:'cob3',kicker:'Ahora, quien vende',q:'Un agricultor y su trigo: tres decisiones.',
 sub:'Venderá su cosecha dentro de cuatro meses. Hoy el trigo se paga a 200 € por tonelada. Puede no cubrirse, fijar hoy 200 € con un futuro o un swap (en la práctica, se compromete a vender a ese precio), o comprar una Put de strike 200 € pagando 10 € de prima. Cifras ilustrativas. Cuatro retos debajo, con los importes ocultos.',
 lado:'venta',spot:20000,strike:20000,prima:1000,min:14000,max:26000,step:500,opt:'Put comprada',
 ttl:'Trigo · hoy 200 €/t · Put comprada: strike 200 €, prima 10 €',
 note:'El trigo acaba en <b>{P}</b> por tonelada',
 retos:[
  {q:'Coloca el precio en el que la Put comprada y el futuro le dejan lo mismo.',eq:21000,
   mal:'El reto pide que las barras del futuro y de la Put comprada queden a la misma altura.',
   pista:'Con el futuro cobra 200 €. Con la Put comprada, si el precio sube, vende en el mercado y descuenta 10 € de prima.',
   why:'A 210 €: con el futuro cobra 200 €; con la Put comprada no ejerce, vende a 210 € y descuenta 10 € de prima: 200 €. Por debajo de 210 €, el futuro le deja más, porque no tiene prima.'},
  {q:'Coloca un precio en el que el futuro le deja MENOS que la Put comprada.',gt:21000,
   mal:'El reto pide la barra del futuro por debajo de la de la Put comprada.',
   pista:'El futuro le obliga a vender a 200 € aunque el mercado pague más.',
   why:'Por encima de 210 €. A 240 €: con el futuro cobra 200 €, 40 € menos que el mercado; con la Put comprada vende a 240 € y descuenta 10 €: 230 €. No sabe si el trigo subirá, y la Put comprada le deja aprovecharlo si sube.'},
  {q:'Coloca un precio en el que la Put comprada le haga cobrar más que no cubrirse.',lt:19000,
   mal:'El reto pide la barra de la Put comprada por encima de la de «Sin cubrirse».',
   pista:'Con la Put comprada cobra como mínimo 200 € − 10 €.',
   why:'Por debajo de 190 €. A 160 €: sin cubrirse cobra 160 €; con la Put comprada vende a 200 € y descuenta 10 €: 190 €, lo mínimo posible. Es el mismo número que el del agricultor de la Lección 1.'},
  {q:'Coloca un precio en el que no cubrirse habría sido lo mejor de las tres.',gt:20000,
   mal:'El reto pide la barra «Sin cubrirse» por encima de las otras dos.',
   pista:'Sin cubrirse se queda todo el movimiento del precio. ¿Hacia dónde le conviene que vaya?',
   why:'Por encima de 200 €. Si el trigo sube, quien no se cubrió cobra el precio de mercado; con la Put comprada cobra lo mismo menos 10 €, y con el futuro, 200 €. Como la aerolínea, pero al revés: cubrirse cuesta justo cuando el precio va a favor.'}],
 after:'El mismo mecanismo, al revés: la Put comprada no es la mejor en ningún precio concreto, pero es la única que asegura un mínimo sin renunciar a las subidas. Cobra como mínimo 190 € y, si el trigo sube, lo aprovecha. Con el futuro tiene 200 € seguros, pero renuncia a cualquier subida, y queda obligado aunque una helada o una sequía le dejen sin cosecha.'},
{t:'case',kicker:'El trigo de verdad',tag:'Caso real',
 p:'Los movimientos de estos ejemplos no son exagerados. Según el Ministerio de Agricultura, en junio de 2021 el trigo blando panificable se pagaba en España a 230,99 € por tonelada, de media. En mayo de 2022, con la guerra en Ucrania, valía 394,59 €: un 71 % más. Y a finales de marzo de 2023 había bajado a 284,03 €: un 28 % menos. En Euronext, en París, donde se forma el precio de referencia del trigo en Europa, el futuro de trigo molturable cerró el 16 de mayo de 2022 en 438,25 € por tonelada, el cierre más alto de su historia, después de que la India prohibiera exportar trigo.',
 src:'Ministerio de Agricultura, Pesca y Alimentación: precios medios nacionales semanales del trigo blando panificable (semanas del 7 al 13 de junio de 2021, del 16 al 22 de mayo de 2022 y del 27 de marzo al 2 de abril de 2023) · Euronext: cierre del futuro de trigo molturable del 16 de mayo de 2022',
 after:'En menos de un año el precio subió un 71 %, y en otros diez meses bajó un 28 %. Para quien vende trigo, como el agricultor, el riesgo es que baje; para quien lo compra, como una harinera, que suba. Nadie sabía de antemano cuál de los dos movimientos tocaba.'},
{t:'case',kicker:'Por qué en 2022 se usaron más opciones',tag:'Caso real',
 p:'Con el precio tan volátil, de enero a julio de 2022 se negociaron en Euronext 1,62 millones de contratos de opciones sobre trigo, un 68 % más que un año antes. Según Euronext, en torno al 55 % de los participantes eran usuarios físicos: quienes producen, almacenan o transforman el trigo. Según Euronext, una de las razones estaba en las garantías. Quien había vendido futuros para fijar el precio de su trigo tenía que aportar más dinero cada vez que el precio subía, aunque ese trigo valiera más: no lo cobraría hasta venderlo. El responsable de materias primas de Euronext explicó que las garantías estaban asfixiando a quienes habían vendido futuros para cubrirse, y que con opciones la pérdida se limita a lo pagado por ellas.',
 src:'FIA, «Data Spotlight – Wheat options trading surges at Euronext», 6 de septiembre de 2022',
 after:'Esa es la diferencia práctica entre fijar el precio y comprar una opción: el futuro no tiene prima, pero exige garantías a las dos partes mientras está vivo, y si el precio va en contra hay que aportar más; la opción comprada cuesta la prima por adelantado y nada más.'},
{"t":"sandbox","id":"S20","modulo":3,"leccion":10,"tag":"Ilustrativo","kicker":"Ahora decides tú","q":"Cubrir una venta futura.","sub":"Elige antes de ver el resultado. Importes por tonelada.","ctx":"Un agricultor venderá su trigo tras la cosecha, dentro de cuatro meses. Hoy se paga a 200 € por tonelada y necesita cobrar al menos 190 €, contando lo que pague por protegerse. Hay opciones de strike 200 € con prima de 10 € por tonelada.","spot":20000,"call":{"strike":20000,"prima":1000},"put":{"strike":20000,"prima":1000},"final":17000,"expo":1,"noOperar":"error","mult":1,"unidad":"tonelada","score":true,"best":"put","lesson":"El trigo cayó a 170 €. Con la Put comprada, el agricultor gana 30 € al ejercer menos 10 € de prima, +20 €, y vende su trigo a 170 €: cobra 190 € netos por tonelada, lo mismo que si vendiera a 200 € y descontara la prima. Sin operar, 170 €. Con la Call comprada, 160 €.","after":"Mismo mecanismo que proteger acciones: quien tendrá algo que vender y teme que baje compra una Put. Las cifras de este escenario son inventadas."},
{"t":"sandbox","id":"S16","modulo":3,"leccion":10,"tag":"Caso real · niveles del Ibex reales, prima ilustrativa","kicker":"Con datos reales","q":"Un mes de cobertura, de vencimiento a vencimiento.","sub":"Elige antes de ver el resultado. Cada punto vale 1 €.","ctx":"Viernes 15 de mayo de 2026, vencimiento mensual en MEFF. El Ibex 35 cierra en 17.622,70 puntos. Un inversor tiene una cartera que replica el índice por el valor de un contrato Mini IBEX (1 € por punto): 17.622,70 €. Hasta el vencimiento de junio no puede perder más de 600 €. Hay una Put de strike 17.300, cerca de un 2 % por debajo del índice, como la que compraba cada mes el índice IBEX 35 Protective Put, que BME dejó de calcular en noviembre de 2025.","spot":1762270,"call":{"strike":1760000,"prima":35000},"put":{"strike":1730000,"prima":18000},"final":1934740,"expo":1,"noOperar":"error","mult":1,"unidad":"punto","score":true,"best":"put","fuente":"Cierres del Ibex 35: 17.622,70 (15-may-2026, Expansión) y 19.347,40 (19-jun-2026, Merca2 y Valencia Plaza). Metodología del IBEX 35 Protective Put (índice cesado en noviembre de 2025): newsletter MEFF n.º 64. Primas: ilustrativas. Simplificación: el precio final es el cierre del índice; en MEFF, las opciones sobre el IBEX 35 se liquidan al precio de liquidación del futuro, la media del índice entre las 16:15 y las 16:45 del día de vencimiento.","lesson":"El viernes 19 de junio, día de cuádruple hora bruja, el Ibex cerró en 19.347,40 puntos: casi un 10 % más. La Put comprada venció fuera del dinero y costó sus 180 €; la cartera ganó 1.724,70 €. Total: +1.544,70 €. Sin operar: +1.724,70 €. Con la Call comprada (strike 17.600, prima 350): +3.122,10 €.","after":"El seguro no se usó y costó 180 €. Con él, lo peor que podía pasar en ese mes era −502,70 € (17.300 − 17.622,70 − 180). Simplificación: tomamos el cierre como precio final; MEFF liquida con la media del Ibex entre las 16:15 y las 16:45, y la opción es sobre el futuro Mini IBEX, no sobre el índice."}
]},

11:{title:'Comprador y vendedor no corren el mismo riesgo',beats:[
{t:'twocurves',kicker:'Las dos caras del mismo contrato',
 q:'Call comprada frente a Call vendida.',
 sub:'El mismo contrato visto desde los dos lados: Call de strike 100 € y prima 5 €, resultado por acción. Lo que gana uno lo pierde el otro. Cuatro retos debajo, con los resultados ocultos hasta que compruebes.',

 retos:[

   pista:'El vendedor se queda toda la prima si el comprador no ejerce. ¿Cuándo no ejerce quien compró una Call?',
   why:'En 100 € o por debajo, quien compró la Call no ejerce: comprar a 100 € no le da ventaja. El vendedor se queda los 5 €. Es su ganancia máxima: por mucho que baje la acción, no gana más.'},
  {q:'Coloca un precio en el que quien vendió la Call todavía gane, pero menos que la prima.',gt:10000,lt:10500,
   mal:'El reto pide un resultado de la Call vendida entre 0 € y +5 €, sin llegar a ninguno de los dos.',
   pista:'Por encima de 100 € el comprador ejerce, y el vendedor paga esa diferencia con lo que cobró de prima.',
   why:'Entre 100 € y 105 €, el comprador ejerce y el vendedor tiene que entregar a 100 € algo que vale más. Paga la diferencia con la prima y le sobra algo. A 103 €: +5 € de prima − 3 € = +2 €; quien compró la Call, −2 €.'},
  {q:'Coloca el precio en el que comprador y vendedor quedan los dos a 0 €.',eq:10500,

  {q:'Coloca el precio en el que quien vendió la Call sin tener las acciones pierde 20 € por acción.',eq:12500,
   mal:'El reto pide −20 € en la línea de la Call vendida, la gris discontinua.',
   pista:'El vendedor cobró 5 €. ¿Cuánto tiene que perder al entregar a 100 € para acabar en −20 €?',
   why:'En 125 €: tiene que comprar a 125 € unas acciones que entrega a 100 €, −25 €, y cobró 5 € de prima: −20 € por acción, −2.000 € por contrato. Si la acción siguiera subiendo, la pérdida seguiría creciendo: no tiene límite.'}],

 after:'La línea de la Call comprada tiene un mínimo: −5 €. La de la Call vendida tiene un máximo, +5 €, y ningún mínimo: si la acción sube sin límite, la pérdida de quien vendió la Call sin tener las acciones crece sin límite. El vendedor quiere justo lo contrario que el comprador.'},
{t:'pair',kicker:'La asimetría, en dos frases',q:'Quien compra conoce su pérdida máxima. Quien vende conoce su ganancia máxima.',
 sub:'Toca cada lado.',
 a:{role:'QUIEN COMPRA UNA OPCIÓN',word:'Pérdida limitada',hint:'Tocar para ver',txt:'Pérdida máxima: la prima que pagó. Ganancia máxima: sin límite en la Call comprada; strike menos prima en la Put comprada. Sabe cuánto puede perder antes de operar.'},
 b:{role:'QUIEN VENDE UNA OPCIÓN',word:'Puede perder mucho',hint:'Tocar para ver',txt:'Ganancia máxima: la prima que cobró. Pérdida máxima: sin límite si vendió una Call sin tener las acciones; si vendió una Put, el strike menos la prima (si la acción llega a 0 €). Cobra una cantidad fija a cambio de una pérdida posible mucho mayor.'},
 after:'Por eso, en las opciones, solo deposita garantías quien las vende: es la parte que tiene obligaciones. Quien compra paga la prima y ya no debe nada más.'},
{t:'grid2x2',kicker:'El mapa completo',q:'Las cuatro posiciones, con su gráfico.',
 sub:'Filas: comprar o vender. Columnas: Call o Put. El dibujo de cada casilla es su gráfico de resultado al vencimiento. Toca las cuatro.',
 after:'Quien compra paga la prima y tiene el derecho. Quien vende cobra la prima y tiene la obligación. Y la confusión más común: vender una Put obliga a COMPRAR.'},
{t:'gridquiz',kicker:'Ahora sin mirar',q:'¿En qué casilla estás?',
 sub:'Ocho situaciones. Toca la posición. Aquí tampoco se pierden vidas.',
 rounds:[

  {s:'Cobras una prima y te comprometes a vender si te lo piden.',a:'cs',why:'Cobras y te obligas a vender: has vendido una Call.'},
  {s:'Pagas una prima y te quedas el derecho a vender.',a:'pb',why:'Pagas y tienes un derecho de venta: has comprado una Put.'},
  {s:'Cobras una prima y te comprometes a COMPRAR si te lo piden.',a:'ps',why:'Esta es la que más se confunde: vender una Put obliga a comprar. Quien te la compró tiene derecho a venderte las acciones.'},
  {s:'Cobras la prima y lo que más te conviene es que la acción acabe en el strike o por debajo.',a:'cs',why:'Si vendiste una Call y la acción acaba por encima del strike, te obligan a vender acciones por debajo de lo que valen.'},
  {s:'Cobras la prima y lo que más te conviene es que la acción acabe en el strike o por encima.',a:'ps',why:'Si vendiste una Put y la acción acaba por debajo del strike, te obligan a comprar acciones por encima de lo que valen.'},
  {s:'Tu pérdida máxima es la prima y ganas si la acción cae por debajo del strike menos la prima.',a:'pb',why:'Put comprada: pérdida limitada a la prima, ganancia con las caídas.'},
  {s:'Puedes perder sin límite si la acción sube mucho y no la tienes.',a:'cs',why:'Call vendida sin tener las acciones: tendrías que comprarlas cada vez más caras para entregarlas al strike.'}],
 after:'Has acertado {S}. Este cuadro vuelve en el repaso: es lo que más cuesta interiorizar de todo el curso.'},
{"t":"sandbox","id":"S23","modulo":3,"leccion":11,"tag":"Ilustrativo","kicker":"El escenario que engaña","q":"Acertar la dirección no es suficiente.","sub":"Este escenario no puntúa: ninguna decisión resta vidas.","ctx":"Una cotizada española presenta resultados ligeramente mejores de lo esperado. El mercado lleva semanas tranquilo. No tienes sus acciones, pero crees que subirán un poco. Hoy cotizan a 100 €. Vencimiento: dentro de un mes.","spot":10000,"call":{"strike":10000,"prima":500},"put":{"strike":10000,"prima":500},"final":10300,"expo":0,"noOperar":"neutral","mult":100,"unidad":"acción","score":false,"best":"none","lesson":"La acción subió 3 €, a 103 €. Quien compró una Call acertó la dirección y aun así perdió 2 € por acción, 200 € por contrato: la subida (3 €) fue menor que la prima (5 €). No perdió la prima entera, solo una parte, porque acabó entre el strike y el punto muerto. La Put comprada perdió sus 5 €. No operar: 0 €.","after":"Creer que basta con adivinar hacia dónde va el precio es un error de intuición muy frecuente entre principiantes. Para ganar al vencimiento, el precio tiene que pasar del strike más la prima con una Call comprada, o bajar del strike menos la prima con una Put comprada."},
{t:'case',kicker:'Lo que este curso no te enseña a hacer',tag:'Aviso',
 p:'Vender opciones queda fuera de este curso. Una Call vendida sin tener las acciones puede perder sin límite. Una Put vendida puede perder hasta el strike menos la prima, aunque tengas reservado el dinero para comprar las acciones: reservarlo te evita quedarte sin liquidez, no te evita la pérdida. Hacerlo exige entender garantías y gestión del riesgo, propias de una asignatura de derivados.',
 src:'CNMV, guía «Qué debe saber de… opciones y futuros» · MEFF, «Manual básico para operar con opciones»',
 after:'Que el tiempo juegue a favor del vendedor hace que vender opciones parezca una fuente de ingresos segura. No lo es: el vendedor cobra una cantidad pequeña a cambio de asumir una pérdida posible mucho mayor.'},
{t:'case',kicker:'Así es un documento de verdad',tag:'Documento real',
 p:'Si eres inversor particular, antes de que operes con un derivado el intermediario tiene que entregarte un KID, un documento de datos fundamentales. Un ejemplo real es el de Eurex, el mercado de derivados alemán, para vender Puts sobre divisas, de diciembre de 2025. Explica qué es el producto, cómo funciona, sus riesgos y qué podría pasar en distintos escenarios. Avisa en la primera página de que el producto no es sencillo y puede ser difícil de comprender, y le asigna un indicador de riesgo de 7 sobre 7, el máximo.',
 src:'KID «FX options put short», Eurex Deutschland, 1 de diciembre de 2025',
 after:'Si alguien te ofrece operar con opciones y no te enseña este documento, desconfía. Si te lo enseña, léelo: el apartado de escenarios es un gráfico de resultado como los que ya sabes leer.'},
{t:'quiz',q:'¿Quién puede tener pérdidas sin límite con una Call?',
 opts:['El comprador','El vendedor, si no tiene las acciones','Los dos','Ninguno'],ok:1,
 why:'Si el precio sube sin límite, quien vendió la Call sin tener las acciones tiene que entregar al strike unas acciones que valen cada vez más.'},
{t:'quiz',q:'¿Cuál es la pérdida máxima de quien compra una opción, sea Call o Put?',
 opts:['La prima que pagó','El precio del subyacente','Ilimitada','El strike'],ok:0,
 why:'Comprar una opción limita la pérdida a lo pagado. Es lo que hace que su riesgo se conozca de antemano.'},
{"t":"sandbox","id":"S21","modulo":3,"leccion":11,"tag":"Ilustrativo","kicker":"Decides tú · el caso de Hugo","q":"Lo que gana uno lo pierde el otro.","sub":"Elige antes de ver el resultado.","ctx":"Hugo no tiene acciones de esta empresa, no va a necesitarlas y no tiene ninguna opinión sobre ella. Hoy cotizan a 100 €. Vencimiento: dentro de tres meses.","spot":10000,"call":{"strike":10000,"prima":500},"put":{"strike":10000,"prima":500},"final":15000,"expo":0,"noOperar":"neutral","mult":100,"unidad":"acción","score":true,"best":"none","lesson":"Una oferta para comprar toda la empresa disparó la acción a 150 €. La Call comprada da 50 € al ejercer menos 5 € de prima: +45 € por acción (4.500 € por contrato). La Put comprada pierde su prima: −5 € (500 €). No operar: 0 €.","after":"La Call comprada ganó por suerte: Hugo no tenía ni previsión ni nada que proteger, así que no operar era lo acertado. Y mira el otro lado: quien vendió esa Call sin tener las acciones pierde exactamente esos 45 € por acción. Si la acción hubiera llegado a 300 €, perdería 195 €. La pérdida de una Call vendida así no tiene límite."},
{"t":"sandbox","id":"S22","modulo":3,"leccion":11,"tag":"Ilustrativo","kicker":"Decides tú · el caso de Nerea","q":"El otro lado de tu Put comprada.","sub":"Elige antes de ver el resultado.","ctx":"Nerea tiene 100 acciones que hoy valen 100 €. Hasta el vencimiento, dentro de tres meses, no puede perder más de 5 € por acción, contando lo que pague por protegerse.","spot":10000,"call":{"strike":10000,"prima":500},"put":{"strike":10000,"prima":500},"final":7000,"expo":1,"noOperar":"error","mult":100,"unidad":"acción","score":true,"best":"put","lesson":"La acción cayó a 70 €. La Put comprada da 30 € al ejercer menos 5 € de prima: +25 €. Con las acciones: −5 € por acción (500 € por contrato). Sin operar: −30 € (3.000 €). Con la Call comprada: −35 € (3.500 €).","after":"Quien vendió una Put como esa cobró 5 € y, si le asignan el ejercicio, tiene que comprar a 100 € acciones que valen 70 €: pierde 25 € por acción. Su pérdida máxima, si la acción llegara a 0 €, sería strike − prima: 95 €. Es grande, pero no ilimitada."}
]},

12:{title:'Dónde ocurre todo esto',beats:[
{t:'chain',kicker:'De tu móvil al mercado',
 q:'Tu orden no llega sola a MEFF.',
 sub:'Toca cada eslabón de la cadena.',
 steps:[
  {ic:'<svg class=ei data-i=user aria-hidden=true><use href=#i-user></use></svg>',n:'Tú',h:'El inversor particular',p:'Decides comprar una opción. No puedes enviar la orden directamente al mercado: MEFF solo acepta órdenes de sus miembros.'},
  {ic:'<svg class=ei data-i=bank aria-hidden=true><use href=#i-bank></use></svg>',n:'Bróker',h:'Intermediario miembro del mercado',p:'Una entidad autorizada que es miembro de MEFF, o que opera a través de uno. Recibe tu orden, comprueba que tienes saldo para pagar la prima (y, si vendes opciones, las garantías) y la envía al mercado en tu nombre. Cobra una comisión.'},
  {ic:'<svg class=ei data-i=chart-bar aria-hidden=true><use href=#i-chart-bar></use></svg>',n:'MEFF',h:'El mercado oficial',p:'Aquí se cruzan compradores y vendedores con contratos estandarizados: mismos strikes, mismos vencimientos, mismas reglas para todos. Cada opción tiene dos precios: el más alto que está dispuesto a pagar un comprador (precio de demanda, en inglés bid) y el más bajo que pide un vendedor (precio de oferta, ask). Si compras ya, pagas la oferta; si vendes ya, cobras la demanda. Es el mercado oficial español de derivados financieros, aunque opciones sobre algunas acciones españolas también cotizan en otros mercados europeos, como Eurex.'},
  {ic:'<svg class=ei data-i=shield-check aria-hidden=true><use href=#i-shield-check></use></svg>',n:'Cámara',h:'BME Clearing',p:'Se interpone entre las dos partes y garantiza que el contrato se cumple aunque una de ellas no pueda pagar. Desde 2013 esta función la ejerce BME Clearing, una sociedad distinta del mercado. Por eso no necesitas saber quién está al otro lado.'}],
 after:'Esa cadena es la diferencia entre una opción negociada en un mercado organizado y un acuerdo privado: reglas comunes, supervisión y una cámara que responde si una parte falla.'},
{t:'pair',kicker:'Lo otro que se negocia aquí',q:'Una opción no es un futuro.',
 sub:'En MEFF también se negocian futuros, y conviene no confundirlos. Toca cada uno.',
 a:{role:'EN UNA OPCIÓN',word:'Solo se obliga el vendedor',hint:'Tocar para ver',txt:'El comprador paga una prima y se queda con el derecho a decidir. El vendedor cobra esa prima y asume la obligación. Es lo que llevas viendo todo el curso.'},
 b:{role:'EN UN FUTURO',word:'Se obligan los dos',hint:'Tocar para ver',txt:'Comprador y vendedor se comprometen los dos, uno a comprar y otro a vender, a un precio fijado y en una fecha. Ninguno puede negarse a cumplir, aunque los dos pueden cerrar su posición antes del vencimiento. Por eso ninguno paga prima: no hay ningún derecho a elegir por el que pagar. Y como los dos tienen obligaciones, los dos depositan garantías.'},
 after:'La prima es el precio de poder no ejercer. En un futuro no existe, porque ninguna de las dos partes puede negarse a cumplir. La Put Mini IBEX de la Lección 10 era una opción sobre el Futuro Mini IBEX: una opción cuyo subyacente es un futuro.'},
{t:'pair',kicker:'Un último dato de la ficha',q:'¿Cuándo se puede ejercer?',
 sub:'Depende del estilo de la opción. Toca cada uno.',
 a:{role:'ESTILO EUROPEO',word:'Solo al vencimiento',hint:'Tocar para ver',txt:'Quien compró la opción solo puede ejercerla el día del vencimiento. Antes puede venderla en el mercado, pero no ejercerla. Las opciones sobre el Mini IBEX de MEFF son europeas.'},
 b:{role:'ESTILO AMERICANO',word:'Cualquier día hasta el vencimiento',hint:'Tocar para ver',txt:'Quien compró la opción puede ejercerla cualquier día hasta el vencimiento, y quien la vendió puede recibir el aviso de ejercicio (la asignación) en cualquier momento. En MEFF hay opciones sobre acciones de los dos estilos: las americanas se liquidan por entrega de las acciones; las europeas, por entrega o por diferencias, según el contrato. El nombre no tiene que ver con el país donde se negocian.'},
 after:'El estilo solo cambia cuándo se puede ejercer. La prima, el strike, el derecho de quien compra y la obligación de quien vende funcionan igual.'},
{t:'timeline',kicker:'Cómo se construyó todo esto',q:'De un libro en castellano a un grupo europeo.',
 sub:'Toca cada hito.',
 nodes:[
  {yr:'1688',mark:'Verificado',h:'Un libro en castellano, en Ámsterdam',p:'José de la Vega, nacido en España, publica en Ámsterdam <i>Confusión de confusiones</i>, escrito en castellano y considerado el primer libro sobre la bolsa. Ya describe las opciones que se negociaban allí.'},
  {yr:'1973',mark:'Verificado',h:'Chicago estandariza el contrato',p:'El 26 de abril de 1973 abre el CBOE (Chicago Board Options Exchange), el primer mercado organizado de opciones con contratos estandarizados. Hasta entonces se negociaban en privado, con condiciones distintas en cada acuerdo.'},
  {yr:'1989',mark:'Verificado',h:'España: dos mercados rivales',p:'En noviembre de 1989 nace en Madrid OM Ibérica, el primer mercado organizado de opciones en España, filial del mercado sueco OM. En marzo de 1990 aparece MEFF en Barcelona, para futuros sobre deuda pública. Dos mercados, con dos cámaras distintas, competían por la misma liquidez en un mercado pequeño.'},
  {yr:'1991',mark:'Verificado',h:'Se integran',p:'Los dos mercados se fusionan en un solo grupo, con dos cámaras especializadas: la renta fija en Barcelona y la renta variable en Madrid. De ahí sale el MEFF que hoy negocia opciones sobre el Ibex 35 y sobre acciones. Las opciones sobre acciones españolas llegan en 1993.'},
  {yr:'2002',mark:'Verificado',h:'Nace BME',p:'Queda formado el grupo Bolsas y Mercados Españoles, creado el año anterior, que reúne MEFF, AIAF (renta fija privada), SENAF (deuda pública) y las cuatro bolsas: Madrid, Barcelona, Bilbao y Valencia.'},
  {yr:'2020',mark:'Verificado',h:'BME entra en el grupo SIX',p:'El operador suizo SIX adquiere BME. MEFF sigue funcionando como mercado oficial español supervisado por la CNMV, dentro de un grupo europeo mayor.'}],
 after:'Más de tres siglos entre el primer libro sobre la bolsa, que ya describía las opciones, y el mercado donde hoy se negocian en España.'},
{t:'case',kicker:'Quién vigila',tag:'Caso real',
 p:'La CNMV supervisa MEFF y a los intermediarios, igual que supervisa las bolsas españolas. Antes de que un inversor particular opere con un derivado, el intermediario debe entregarle el KID (documento de datos fundamentales), obligatorio en la Unión Europea desde 2018 para este tipo de productos.',
 src:'Reglamento (UE) 1286/2014 (PRIIPs) · preguntas y respuestas de la CNMV sobre PRIIPs',
 after:'Si algún día operas, pide el KID y comprueba que tu intermediario está autorizado por la CNMV.'},
{t:'quiz',q:'¿Puede un particular enviar una orden directamente a MEFF?',
 opts:['Sí, abriendo una cuenta en MEFF','No, necesita un intermediario','Solo si opera más de 100 contratos','Solo para futuros'],ok:1,
 why:'MEFF solo acepta órdenes de sus miembros. El particular accede siempre a través de un intermediario.'},
{t:'quiz',q:'¿Quién supervisa MEFF?',
 opts:['El Banco de España','La CNMV','El Ministerio de Economía','SIX Group'],ok:1,
 why:'La CNMV es el supervisor de los mercados de valores y derivados en España.'},
{t:'quiz',q:'Compraste una opción de estilo europeo. ¿Cuándo puedes ejercerla?',
 opts:['Cualquier día','Solo el día del vencimiento','Solo si se negocia en Europa','Nunca: solo se vende'],ok:1,
 why:'Estilo europeo: solo al vencimiento. Antes puedes venderla en el mercado, pero no ejercerla.'},
{"t":"sandbox","id":"S17","modulo":3,"leccion":12,"tag":"Caso real · niveles del Ibex reales; strike y prima ilustrativos","kicker":"Con datos reales","q":"Acertar la dirección con el Ibex.","sub":"Elige antes de ver el resultado. Cada punto vale 1 €.","ctx":"Viernes 19 de junio de 2026, cuádruple hora bruja. El Ibex 35 cierra en 19.347,40 puntos. Un estudiante sin cartera cree que el índice subirá un poco durante el verano, en torno a un 1 o un 2 %, hasta el vencimiento del 18 de septiembre. Las opciones Mini IBEX de strike 19.350 cuestan 600 puntos (600 €).","spot":1934740,"call":{"strike":1935000,"prima":60000},"put":{"strike":1935000,"prima":60000},"final":1951380,"expo":0,"noOperar":"neutral","mult":1,"unidad":"punto","score":true,"best":"none","fuente":"Cierres del Ibex 35: 19.347,40 (19-jun-2026, Merca2 y Valencia Plaza) y 19.513,80 (18-sep-2026, Estrategias de Inversión y Datosmacro). Primas: ilustrativas.","lesson":"El viernes 18 de septiembre, otra cuádruple hora bruja, el Ibex cerró en 19.513,80 puntos: subió un 0,86 %. El estudiante acertó la dirección. La Call comprada acaba 163,80 puntos dentro del dinero, menos 600 de prima: −436,20 €. La Put comprada pierde sus 600 €. No operar: 0 €.","after":"Una subida esperada de un 1 o un 2 % son unos 190 a 390 puntos, menos que los 600 de prima: aunque acertara del todo, la Call comprada no podía ganar. El punto muerto estaba en 19.950 puntos. Simplificación: usamos el cierre como precio final. Con esto cierras la Unidad 3: ya sabes qué es una opción, cómo se comporta, para qué sirve y dónde se negocia."}
]},

13:{title:'Repaso: lo que tienes que saber de memoria',beats:[
{t:'cards',kicker:'Tarjetas de repaso',q:'¿Te acuerdas?',
 sub:'Lee el término, intenta explicarlo en voz alta y toca para darle la vuelta. Las que no sepas volverán al final.',
 deck:[
  {f:'Comprar una opción',b:'Pagar la prima y adquirir el derecho, no la obligación, de comprar (Call) o vender (Put) el subyacente al strike.'},
  {f:'Vender una opción',b:'Cobrar la prima y asumir la obligación de cumplir si el comprador ejerce.'},
  {f:'Call',b:'Opción de compra: da a quien la compra el derecho a COMPRAR el subyacente al strike.'},
  {f:'Put',b:'Opción de venta: da a quien la compra el derecho a VENDER el subyacente al strike.'},
  {f:'Strike (precio de ejercicio)',b:'El precio fijado en el contrato al que se compra (Call) o se vende (Put) si se ejerce. No cambia, salvo ajuste por una operación extraordinaria de la empresa.'},
  {f:'Prima',b:'El precio de la opción: lo que paga el comprador al vendedor. Es la pérdida máxima de quien compra.'},
  {f:'Vencimiento',b:'El último día en que se puede ejercer. Después, el contrato deja de existir.'},
  {f:'En el dinero (ATM)',b:'Precio del subyacente exactamente igual al strike. Es un punto, no una franja.'},
  {f:'Dentro del dinero (ITM)',b:'Ejercer ahora daría ventaja: Call con el precio por encima del strike, Put con el precio por debajo.'},
  {f:'Punto muerto',b:'Call comprada: strike más prima. Put comprada: strike menos prima. Ahí el resultado es cero.'},
  {f:'Valor temporal',b:'Prima menos valor intrínseco. Baja con el tiempo y al vencimiento vale cero.'},
  {f:'Apalancamiento',b:'Con la prima, tu resultado depende de la variación de 100 acciones: los porcentajes se multiplican, a favor y en contra.'}],
 after:'Si alguna se te ha resistido, está también en el glosario de la portada.'},
{t:'gridquiz',kicker:'Las cuatro posiciones, otra vez',q:'¿En qué casilla estás?',

  {s:'Te llega una asignación: tienes que COMPRAR acciones al strike.',a:'ps',why:'Solo quien vendió una Put tiene la obligación de comprar.'},
  {s:'Pagas 5 € y, si la acción cae a 80 €, puedes venderla a 100 €.',a:'pb',why:'Pagas la prima y tienes derecho a vender a un precio fijado: Put comprada.'},
  {s:'Cobras 5 € hoy y, si la acción acaba muy por encima del strike, pierdes.',a:'cs',why:'Cobras la prima y pierdes con las subidas: Call vendida.'}],

{t:'stack',kicker:'Cuatro cuentas que no debes olvidar',q:'Con esto calculas casi todo.',
 sub:'Toca cada una.',
 items:[
  {ic:'<svg class=ei data-i=wall aria-hidden=true><use href=#i-wall></use></svg>',b:'Lo máximo que pierde quien compra una opción',p:'La prima. Siempre, sea Call o Put, se mueva lo que se mueva la acción.'},
  {ic:'<svg class=ei data-i=scales aria-hidden=true><use href=#i-scales></use></svg>',b:'El punto muerto',p:'Call comprada: strike + prima. Put comprada: strike − prima. La prima siempre juega en contra de quien compra, así que el precio tiene que pasar el strike en más de la prima: hacia arriba en la Call, hacia abajo en la Put.'},
  {ic:'<svg class=ei data-i=puzzle-piece aria-hidden=true><use href=#i-puzzle-piece></use></svg>',b:'De qué está hecha la prima',p:'Prima = valor intrínseco + valor temporal. Al vencimiento solo queda el valor intrínseco.'},
  {ic:'<svg class=ei data-i=shield-check aria-hidden=true><use href=#i-shield-check></use></svg>',b:'El resultado mínimo con una Put protectora',p:'Por acción: strike − precio de compra de las acciones − prima. Con acciones a 100 €, strike 100 € y prima 5 €: −5 €.'}],

{t:'quiz',q:'Llega el vencimiento. ¿Cuánto vale el valor temporal de cualquier opción?',

{"t":"sandbox","id":"S26","modulo":4,"leccion":13,"tag":"Ilustrativo","kicker":"Repaso","q":"Entre el strike y el punto muerto.","sub":"Elige antes de ver el resultado.","ctx":"Diego comprará 100 acciones en diciembre, cuando cobre un premio de fin de carrera. Hoy valen 100 € y no puede pagar más de 105 € por acción, contando lo que pague por protegerse.","spot":10000,"call":{"strike":10000,"prima":500},"put":{"strike":10000,"prima":500},"final":10300,"expo":-1,"noOperar":"error","mult":100,"unidad":"acción","score":true,"best":"call","lesson":"La acción subió a 103 €. La Call comprada está 3 € dentro del dinero: Diego ejerce y compra a 100 €; con la prima, cada acción le cuesta 105 €, 5 € más que hoy (500 € por contrato). Sin operar, compra a 103 €: 3 € más (300 €). Con la Put comprada pierde la prima y compra a 103 €: 8 € más (800 €).","after":"Esta vez no operar salió 2 € más barato, porque la subida fue menor que la prima. La Call comprada no perdió los 5 € enteros, solo 2 €: entre el strike y el punto muerto se pierde una parte de la prima, no toda. Y Diego tenía garantizado su máximo de 105 €."}
]},

const KEY='opciones-v7';
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);p.terms=p.terms||[];return p}}catch(e){}
 return{done:[],streak:0,hearts:5,xp:0,last:null,terms:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* MODO DESARROLLADOR: true mientras el autor revisa la app. Abre todas las lecciones y la práctica,
   y deja saltar pantallas con › sin completarlas. Para la versión final con alumnos: const DEV=false;
   (con DEV=false, el enlace terminado en #libre sigue abriendo las lecciones para revisar). */
const DEV=false;
const LIBRE=DEV||(()=>{try{return location.hash==='#libre'}catch(e){return false}})();
const unlocked=id=>LIBRE||id===1||S.done.includes(id-1);
const isDone=id=>S.done.includes(id);
const xpAdd=n=>{if(!isDone(view.id))S.xp=(S.xp||0)+n};
const built=id=>!!LESSONS[id];
const beatsOf=id=>LESSONS[id].beats;
const curBeat=()=>beatsOf(view.id)[bi];
const eur=c=>{let v=Math.round(c)/100;const s=v<0?'−':'';v=Math.abs(v);const t=Number.isInteger(v)?String(v):v.toFixed(2).replace('.',',');return s+t.replace(/^(\d+)/,m=>m.replace(/\B(?=(\d{3})+(?!\d))/g,'.'))+'\u00a0€'};
function touchStreak(){const t=new Date().toDateString();
 if(S.last!==t){S.streak=(S.last&&(Date.now()-new Date(S.last))<1728e5)?S.streak+1:1;S.last=t;S.maxStreak=Math.max(S.maxStreak||0,S.streak)}}

function home(){try{posSave()}catch(e){}view={v:'home'};hideFoot();render()}
function start(id,fresh){
 if(!unlocked(id)||!built(id))return;
 correct=0;asked=0;bi=0;maxBi=0;states={};local=states[0]={};S.hearts=5;xp0=S.xp||0;
 S.posL=S.posL||{};const p=S.posL[id];
 if(!fresh&&p&&p.bi<beatsOf(id).length&&(p.bi>0||hayEstado(p.st))){bi=p.bi;maxBi=Math.max(p.maxBi||0,bi);states=p.st&&typeof p.st==='object'?p.st:{};correct=Math.min(p.correct||0,p.asked||0);asked=p.asked||0;S.hearts=p.hearts>0?p.hearts:5;local=states[bi]||(states[bi]={});save();
  view={v:'beats',id};hideFoot();render();window.scrollTo(0,0);return}
 delete S.posL[id];save();
 if(STORY[id]){stOpen(id);return}
 view={v:'beats',id};hideFoot();render();window.scrollTo(0,0)}
function nextBeat(){
 const n=beatsOf(view.id).length;

 return `<p style="text-align:center;font-size:13px;color:var(--ink-soft);margin:12px 0 0">La acción cotiza a <b style="color:var(--ink);font-size:16px">${eur(p)}</b></p>
  <div class="mcards">
   ${rtHid(b)?`<div class="mc"><div class="ttl">CALL DE STRIKE ${eur(b.strike)}</div><div class="st">?</div><div class="ex">Derecho a comprar a ${eur(b.strike)}. Etiqueta oculta: dedúcela.</div></div>
   <div class="mc"><div class="ttl">PUT DE STRIKE ${eur(b.strike)}</div><div class="st">?</div><div class="ex">Derecho a vender a ${eur(b.strike)}. Etiqueta oculta: dedúcela.</div></div></div>`
   :`<div class="mc ${cS}"><div class="ttl">CALL DE STRIKE ${eur(b.strike)}</div><div class="st">${lbl[cS]}</div><div class="ex">${cEx}</div></div>
   <div class="mc ${pS}"><div class="ttl">PUT DE STRIKE ${eur(b.strike)}</div><div class="st">${lbl[pS]}</div><div class="ex">${pEx}</div></div></div>`}`}

function tvTop(d){const b=curBeat()||{},intr=b.intr||50,t0=b.temp||60,temp=Math.round(t0*Math.sqrt(d/180)),tot=intr+temp,hid=rtHid(b);
 const full=intr+t0,iw=intr/full*100,tw=temp/full*100;
 return `<div class="tvtot">${hid?'?':eur(tot)}</div><p class="tvsub">${hid?'prima total: oculta hasta que compruebes el reto':`prima total de la opción · queda el ${Math.round(temp/t0*100)} % del valor temporal inicial`}</p>
  <div class="tvbar"><span class="tvi" style="width:${iw}%">${iw>22?eur(intr):''}</span>
   <span class="tvt" style="width:${tw}%">${!hid&&tw>22?eur(temp):''}</span></div>
  <div class="tvkey"><span><i style="background:var(--gain)"></i>Valor intrínseco ${eur(intr)}</span>
   <span><i style="background:var(--gold)"></i>Valor temporal${hid?'':' '+eur(temp)}</span>
   <span><i class="tvlost"></i>Valor temporal ya perdido</span></div>`}
function tvBottom(d){
 return `<p class="tvdays">Han pasado <b>${180-d}</b> días. Quedan <b>${d}</b> hasta el vencimiento.</p>
  ${d<=20?`<div class="vbox vb-mid" style="margin-top:14px"><b class="h">Efecto yunque</b>En los últimos días el valor temporal baja más deprisa que al principio. Si compraste la opción, el paso del tiempo le quita valor aunque el precio no se mueva.</div>`:''}`}

const pfHide=b=>(!!b.challenge&&!local.tried)||(!!b.retos&&!local.rdone);
function pfTop(b,p){
 const pnl=b.kind==='call'?Math.max(p-b.strike,0)-b.prima:Math.max(b.strike-p,0)-b.prima;
 const oculto=!!b.retos&&!local.rdone&&!local.rfb;
 return `${b.label?`<p class="pfttl">${b.label}<br>resultado por acción al vencimiento</p>`:''}${pfKpi(b,pfHide(b))}${payoffSVG(b,p,pfHide(b))}
  <div class="pfread">${oculto?`<b style="color:var(--ink-soft)">?</b><i>resultado oculto: dedúcelo del gráfico</i>`:`<b class="${pnl>=0?'pos':'neg'}">${pnl>0?'+':''}${eur(pnl)}</b><i>resultado</i>`}</div>
  <p class="pfprice">si la acción acaba en <b>${eur(p)}</b></p>`}
/* ---- retos sobre el gráfico de resultado ---- */
const rtOk=(r,p)=>r.eq!=null?p===r.eq:((r.gt==null||p>r.gt)&&(r.lt==null||p<r.lt)&&(r.ge==null||p>=r.ge)&&(r.le==null||p<=r.le));
/* retos activos y resultado oculto (hasta comprobar cada reto) */
const rtIni=b=>b.ini!=null?b.ini:b.min;
const rtAct=b=>!!b&&!!b.retos&&!local.rdone;
const rtHid=b=>rtAct(b)&&!local.rfb;
/* caja del reto, o la explicación cuando ya están terminados */
const rtArea=(b,p,msg)=>b.retos?rtBox(b)+(local.rdone&&msg?`<div class="pfmsg">${msg}</div>`:''):'';
function pfMsg(b,p){
 const pnl=b.kind==='call'?Math.max(p-b.strike,0)-b.prima:Math.max(b.strike-p,0)-b.prima;
 const call=b.kind==='call',pc=eur(b.prima*100);
 if(call){
  if(p<b.strike)return `La acción acaba en ${eur(p)}, por debajo del strike de ${eur(b.strike)}: la Call está fuera del dinero. Comprar a ${eur(b.strike)} algo que vale menos no tiene sentido, así que no ejerces y la Call comprada pierde la prima entera: ${eur(b.prima)} por acción, ${pc} por contrato. Baja el precio todo lo que quieras: la línea ya no baja más.`;
  if(p===b.strike)return `La acción acaba exactamente en el strike, ${eur(b.strike)}: la Call está en el dinero. Ejercer no da ventaja ni desventaja, y la Call comprada pierde la prima entera: ${eur(b.prima)} por acción. Aquí se dobla la línea.`;
  if(pnl<0)return `La acción acaba en ${eur(p)}: la Call está dentro del dinero. Ejerces y ganas ${eur(p-b.strike)} por acción al comprar por debajo del mercado, pero eso no cubre los ${eur(b.prima)} de prima. Resultado: ${eur(pnl)}. Desde el strike, cada euro que sube la acción sube el resultado un euro.`;
  if(pnl===0)return `La acción acaba en ${eur(p)}, el punto muerto: lo que ganas al ejercer es exactamente la prima. Resultado: 0 €.`;
  return `La acción acaba en ${eur(p)}. Ejerces y ganas ${eur(p-b.strike)} por acción, más que la prima de ${eur(b.prima)}. Resultado: +${eur(pnl)} por acción, +${eur(pnl*100)} por contrato. La línea sigue subiendo: no hay límite.`}
 if(p>b.strike)return `La acción acaba en ${eur(p)}, por encima del strike de ${eur(b.strike)}: la Put está fuera del dinero. Vender a ${eur(b.strike)} algo que vale más no tiene sentido, así que no ejerces y la Put comprada pierde la prima entera: ${eur(b.prima)} por acción, ${pc} por contrato.`;
 if(p===b.strike)return `La acción acaba exactamente en el strike, ${eur(b.strike)}: la Put está en el dinero. Ejercer no da ventaja ni desventaja, y la Put comprada pierde la prima entera: ${eur(b.prima)} por acción. Aquí se dobla la línea.`;
 if(pnl<0)return `La acción acaba en ${eur(p)}: la Put está dentro del dinero. Ejerces y ganas ${eur(b.strike-p)} por acción al vender por encima del mercado, pero eso no cubre los ${eur(b.prima)} de prima. Resultado: ${eur(pnl)}. Cada euro que baja la acción sube el resultado un euro.`;
 if(pnl===0)return `La acción acaba en ${eur(p)}, el punto muerto: lo que ganas al ejercer es exactamente la prima. Resultado: 0 €.`;
 return `La acción acaba en ${eur(p)}. Ejerces y ganas ${eur(b.strike-p)} por acción, más que la prima de ${eur(b.prima)}. Resultado: +${eur(pnl)} por acción, +${eur(pnl*100)} por contrato. El límite: la acción no puede bajar de 0 €.`}
function rtBox(b){
 const R=b.retos,i=Math.min(local.ri||0,R.length-1),r=R[i];
 if(local.rdone)return `<div class="pfchal"><p>Retos terminados: ${local.rok||0} de ${R.length} a la primera. ${b.t==='payoff'?'Ya ves el gráfico completo: el punto muerto, las zonas de ganancia y pérdida y las tres cifras de la posición.':'Ya ves todas las cifras. Sigue moviendo el deslizador: la caja de abajo explica cada precio.'}</p></div>`;
 const head=`<p class="rtq"><small>RETO ${i+1} DE ${R.length}</small>${r.q}</p>`;
 if(!local.rfb)return `<div class="pfchal">${head}<button class="btn gold wide" onclick="rtCheck()">Comprobar</button></div>`;
 const f=local.rfb,last=i>=R.length-1;
 if(f.warn)return `<div class="pfchal">${head}<div class="rtfb warn"><b>Primero, mueve el punto</b>${f.txt}</div></div>`;
 const btn=f.ok||(local.rt||0)>=2?`<button class="btn wide" onclick="rtNext()">${last?'Terminar los retos':'Siguiente reto'}</button>`:`<button class="btn gold wide" onclick="rtRetry()">Probar otra vez</button>`;
 return `<div class="pfchal">${head}<div class="rtfb ${f.ok?'ok':'no'}"><b>${f.ok?'Correcto':((local.rt||0)>=2?'Tampoco. Esta es la respuesta':'Aquí no')}</b>${f.txt}</div>${btn}</div>`}
/* Cada tipo de pantalla con retos dice: qué valor mira el reto (val), cómo se redibuja (draw) y cómo se explica un precio (msg) */
const RT={
 payoff:{val:b=>local.price===undefined?rtIni(b):local.price,draw:(b,v)=>{setHTML('dynA',pfTop(b,v));setHTML('dynB',pfBottom(b,v))},msg:(b,v)=>pfMsg(b,v)},
 decide:{val:b=>local.price===undefined?rtIni(b):local.price,draw:(b,v)=>{setHTML('dynA',decTop(b,v));setHTML('dynB',decBottom(b,v))},msg:(b,v)=>decMsg(b,v)},
 money:{val:b=>local.p===undefined?rtIni(b):local.p,draw:(b,v)=>{setHTML('dynA',moneyBar(b,v));setHTML('dynB',moneyCards(b,v)+rtArea(b,v,moneyMsg(b,v)))},msg:(b,v)=>moneyMsg(b,v)},
 timevalue:{val:b=>180-(local.d===undefined?180:local.d),draw:(b,v)=>{setHTML('dynA',tvTop(180-v));setHTML('dynB',tvBottom(180-v)+rtArea(b,v,tvMsg(b,180-v)))},msg:(b,v)=>tvMsg(b,180-v)},
 putfloor:{val:b=>local.p===undefined?rtIni(b):local.p,draw:(b,v)=>{setHTML('dynA',hedgeChart(b,v));setHTML('dynB',hedgeNote(b,v)+rtArea(b,v,hedgeMsg(b,v)))},msg:(b,v)=>hedgeMsg(b,v)},
 twocurves:{val:b=>local.price===undefined?rtIni(b):local.price,draw:(b,v)=>{setHTML('dynA',tcTop(b,v));setHTML('dynB',rtArea(b,v,tcMsg(b,v)))},msg:(b,v)=>tcMsg(b,v)},
 cob3:{val:b=>local.p===undefined?rtIni(b):local.p,draw:(b,v)=>{setHTML('dynA',c3Chart(b,v));setHTML('dynB',c3Note(b,v)+rtArea(b,v,c3Msg(b,v)))},msg:(b,v)=>c3Msg(b,v)}};
RT.hedge=RT.putfloor;
function rtCheck(){
 const b=curBeat(),R=RT[b.t],i=local.ri||0,r=b.retos[i],v=R.val(b),ok=rtOk(r,v);
 if(!local.rmv&&!(local.rt>0)){local.rfb={warn:true,txt:'<p>Antes de comprobar, mueve el punto hasta el precio que pide el reto. Así eliges tu respuesta y no gastas el intento.</p>'};R.draw(b,v);return}
 local.rt=(local.rt||0)+1;
 if(local.rt===1){asked++;if(ok){correct++;xpAdd(15);local.rok=(local.rok||0)+1}else S.hearts=Math.max(0,S.hearts-1);save();hud()}
 const acc=r.cmp?` La acción comprada a ${eur(b.strike)} daría ${v-b.strike>0?'+':''}${eur(v-b.strike)} por acción.`:'';
 const base=R.msg(b,v)+acc;
 const pr=(t,x)=>`<p><b>${t}</b> ${x}</p>`;
 local.rfb={ok,txt:`<p>${base}</p>`+(ok?pr('Por qué:',r.why):pr('Lo que pedía el reto:',r.mal)+(local.rt>=2?pr('La respuesta:',r.why):pr('Pista:',r.pista)))};
 R.draw(b,v);fb(ok)}
function rtRetry(){const b=curBeat(),R=RT[b.t];local.rfb=null;R.draw(b,R.val(b))}
function rtNext(){
 const b=curBeat(),R=RT[b.t];
 local.ri=(local.ri||0)+1;local.rt=0;local.rfb=null;local.rmv=false;
 if(local.ri>=b.retos.length){local.ri=b.retos.length-1;local.rdone=true;render();footNeutral(`Has acertado ${local.rok||0} de ${b.retos.length} a la primera. ${b.after}`,true);return}
 R.draw(b,R.val(b))}
/* al mover el deslizador, una respuesta fallada se borra para poder probar otra vez */
function rtMoved(b){local.rmv=true;if(b.retos&&!local.rdone&&local.rfb&&!local.rfb.ok&&(local.rt||0)<2)local.rfb=null}
/* ---- explicaciones de cada precio, para los retos ---- */
function decMsg(b,p){return decBox(b,p).replace(/<b class="h">[^<]*<\/b>/,'').replace(/<[^>]+>/g,'')}
function decBottom(b,p){return b.retos?(rtBox(b)+(local.rdone?decBox(b,p):'')):decBox(b,p)}
function moneyMsg(b,p){const k=b.strike;
 if(p===k)return `Con la acción a ${eur(p)}, exactamente el strike, ejercer no da ventaja ni desventaja a ninguna de las dos: la Call y la Put están en el dinero.`;
 const c=p>k,d=Math.abs(p-k);
 return `Con la acción a ${eur(p)}: ejercer la Call es comprar a ${eur(k)} algo que vale ${eur(p)}, ${c?`una ventaja de ${eur(d)}: está dentro del dinero`:`una desventaja: está fuera del dinero`}. Ejercer la Put es vender a ${eur(k)} algo que vale ${eur(p)}, ${c?'una desventaja: está fuera del dinero':`una ventaja de ${eur(d)}: está dentro del dinero`}.`}
function tvMsg(b,d){const intr=b.intr||50,t0=b.temp||60,temp=Math.round(t0*Math.sqrt(d/180));
 return `Han pasado ${180-d} días y quedan ${d}. La prima vale ${eur(intr+temp)}: ${eur(intr)} de valor intrínseco, que no cambia porque la acción sigue en ${b.spotTxt||''}, y ${eur(temp)} de valor temporal, ${temp===0?'nada':`el ${Math.round(temp/t0*100)} % del que tenía el primer día`}.`}
function hedgeMsg(b,p){
 const cost=b.cost||2300,k=b.strike||2300,pr=b.prima||60,pts=b.unit==='pts';
 const fp=v=>pts?String(Math.round(v/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' puntos':eur(v);
 const sg=v=>(v>0?'+':'')+eur(v),sin=p-cost,con=Math.max(p,k)-cost-pr,un=pts?'':' por acción';
 const qui=pts?'la cartera':'las acciones';
 return `${pts?'El Ibex':'La acción'} acaba en ${fp(p)}. Sin cobertura, ${qui}: ${sg(sin)}${un}. Con la Put comprada: ${p<k?`${sg(sin)} de ${qui}, ${sg(k-p)} al ejercer (${pts?`se liquida en efectivo: la diferencia entre ${fp(k)} y ${fp(p)}`:`vendes a ${fp(k)} lo que vale ${fp(p)}`}) y −${eur(pr)} de prima`:`no ejerces, porque vender a ${fp(k)} no da ventaja: ${sg(sin)} de ${qui} y −${eur(pr)} de prima`}, total ${sg(con)}${un}.`}
function tcMsg(b,p){const c=Math.max(p-b.strike,0)-b.prima,sg=v=>(v>0?'+':'')+eur(v);
 return `La acción acaba en ${eur(p)}. ${p>b.strike?`Quien compró la Call ejerce: compra a ${eur(b.strike)} algo que vale ${eur(p)}, ${sg(p-b.strike)}, menos ${eur(b.prima)} de prima`:`Quien compró la Call no ejerce, porque comprar a ${eur(b.strike)} no le da ventaja, y pierde la prima`}: ${sg(c)}. Quien la vendió, justo lo contrario: ${sg(-c)}. Los dos resultados suman cero.`}
/* ---- cobertura de empresa: sin cubrir, futuro y opción comprada ---- */
function c3V(b,p){const buy=b.lado==='compra',k=b.strike,s=b.spot,pr=b.prima;
 return buy?{sin:s-p,fut:0,opt:s-(Math.min(p,k)+pr),eS:p,eF:s,eO:Math.min(p,k)+pr}
           :{sin:p-s,fut:0,opt:Math.max(p,k)-pr-s,eS:p,eF:s,eO:Math.max(p,k)-pr}}
function c3Chart(b,p){
 const v=c3V(b,p),hid=rtHid(b),buy=b.lado==='compra';
 const ends=[b.min,b.strike,b.max].map(x=>c3V(b,x)),all=ends.flatMap(e=>[e.sin,e.fut,e.opt]);
 const top=Math.max(...all),bot=Math.min(...all),pad=(top-bot)*.12;
 const W=330,H=240,PL=44,PR=6,PT=18,PB=44,cw=W-PL-PR,ch=H-PT-PB;
 const yMax=top+pad,yMin=bot-pad,Y=x=>PT+(yMax-x)/(yMax-yMin)*ch,y0=Y(0),f1=x=>x.toFixed(1);
 const col=x=>x>0?'var(--gain)':(x<0?'var(--loss)':'var(--ink-soft)');
 const halo='stroke="var(--surface)" stroke-width="3" paint-order="stroke"';
 const bw=cw*.22,xs=[PL+cw*.18,PL+cw*.5,PL+cw*.82];
 const bar=(k,cx,x)=>{const h=Math.max(Math.abs(Y(x)-y0),2),y=x>=0?y0-h:y0;
  return `<rect class="fbar ${k}" x="${f1(cx-bw/2)}" y="${f1(y)}" width="${f1(bw)}" height="${f1(h)}" rx="3" fill="${col(x)}"/>`
   +`<text x="${f1(cx)}" y="${f1(x>=0?y-6:y+h+14)}" font-size="12" font-weight="700" fill="${col(x)}" text-anchor="middle" ${halo}>${hid?'?':(x>0?'+':'')+eur(x)}</text>`};
 const worst=buy?b.spot-(b.strike+b.prima):b.strike-b.prima-b.spot,yw=Y(worst);
 const cat=(x,y,t)=>`<text x="${f1(x)}" y="${y}" font-size="10.5" fill="var(--ink-soft)" text-anchor="middle">${t}</text>`;
 return `<p class="pfttl">${b.ttl}<br>resultado por tonelada frente al precio de hoy</p>
 <svg class="fchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sin cubrir, futuro y ${b.opt}: resultado frente al precio de hoy">
  <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="var(--line)" stroke-width="1.5"/>
  <line class="fline" x1="${PL}" y1="${f1(yw)}" x2="${W-PR}" y2="${f1(yw)}" stroke="var(--loss)" stroke-width="1.4" stroke-dasharray="5 4" opacity=".75"/>
  ${bar('c3s',xs[0],v.sin)}${bar('c3f',xs[1],v.fut)}${bar('c3o',xs[2],v.opt)}
  <line class="fzero" x1="${PL}" y1="${f1(y0)}" x2="${W-PR}" y2="${f1(y0)}" stroke="var(--ink-soft)" stroke-width="1.4"/>
  <text x="${PL-5}" y="${f1(y0+3)}" font-size="9.5" fill="var(--ink-soft)" text-anchor="end">0 €</text>
  <text x="${PL-5}" y="${f1(yw+11)}" font-size="9.5" fill="var(--loss)" text-anchor="end" font-weight="700">${hid?'':(worst>0?'+':'')+eur(worst)}</text>
  <text x="${PL-5}" y="${PT+8}" font-size="9.5" fill="var(--gain)" text-anchor="end">mejor</text>
  <text x="${PL-5}" y="${H-PB}" font-size="9.5" fill="var(--loss)" text-anchor="end">peor</text>
  ${cat(xs[0],H-PB+17,'Sin')}${cat(xs[0],H-PB+30,'cubrirse')}${cat(xs[1],H-PB+17,'Futuro')}${cat(xs[1],H-PB+30,'o swap')}${cat(xs[2],H-PB+17,b.opt.split(' ')[0])}${cat(xs[2],H-PB+30,b.opt.split(' ').slice(1).join(' '))}
 </svg>
 <p class="c3ef">${buy?'Paga':'Cobra'} por tonelada: ${hid?'<b>?</b> · <b>?</b> · <b>?</b>':`<b>${eur(v.eS)}</b> · <b>${eur(v.eF)}</b> · <b>${eur(v.eO)}</b>`}<br><small>Línea roja discontinua: lo peor que le puede pasar con la ${b.opt}.</small></p>`}
function c3Note(b,p){return `<p style="text-align:center;font-size:13px;color:var(--ink-soft);margin:10px 0 0">${(b.note||'El precio acaba en <b>{P}</b>').replace('{P}',eur(p))}</p>`}
function c3Msg(b,p){const v=c3V(b,p),buy=b.lado==='compra',k=b.strike,sg=x=>(x>0?'+':'')+eur(x);
 if(buy)return `A ${eur(p)} por tonelada. Sin cubrirse paga ${eur(p)}: ${sg(v.sin)} frente a hoy. Con el futuro paga ${eur(b.spot)} pase lo que pase: 0 €. Con la ${b.opt} ${p>k?`ejerce y compra a ${eur(k)}`:`no ejerce, porque comprar a ${eur(k)} no le da ventaja, y compra a ${eur(p)} en el mercado`}; con los ${eur(b.prima)} de prima, ${eur(v.eO)}: ${sg(v.opt)}.`;
 return `A ${eur(p)} por tonelada. Sin cubrirse cobra ${eur(p)}: ${sg(v.sin)} frente a hoy. Con el futuro cobra ${eur(b.spot)} pase lo que pase: 0 €. Con la ${b.opt} ${p<k?`ejerce y vende a ${eur(k)}`:`no ejerce, porque vender a ${eur(k)} no le da ventaja, y vende a ${eur(p)} en el mercado`}; descontando los ${eur(b.prima)} de prima, ${eur(v.eO)}: ${sg(v.opt)}.`}
function c3Move(x){const b=curBeat();local.p=+x;local.moved=(local.moved||0)+1;rtMoved(b);RT.cob3.draw(b,local.p);
 if(!b.retos&&!local.shown&&local.moved>8){local.shown=true;footNeutral(b.after)}}
function pfBottom(b,p){
 const pnl=b.kind==='call'?Math.max(p-b.strike,0)-b.prima:Math.max(b.strike-p,0)-b.prima;
 const be=b.kind==='call'?b.strike+b.prima:b.strike-b.prima;
 if(b.retos)return rtBox(b)+(local.rdone?`<div class="pfmsg">${pfMsg(b,p)}</div>`:'');
 if(b.challenge)return local.tried
  ? `<div class="pfchal"><p>${local.ok?'Lo has clavado.':`El punto muerto estaba en ${eur(be)}.`}</p></div>`

     <button class="btn gold wide" onclick="pfCheck()">Comprobar</button></div>`;
 const call=b.kind==='call',pc=eur(b.prima*100);
 let msg;
 if(call){

const PRD=['dom','lun','mar','mié','jue','vie','sáb'],PRM=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function prFecha(f,largo){const [y,m,d]=f.split('-').map(Number),w=new Date(Date.UTC(y,m-1,d)).getUTCDay();
 return `${largo?PRD[w]+' ':''}${d} ${PRM[m-1]} ${y}`}
